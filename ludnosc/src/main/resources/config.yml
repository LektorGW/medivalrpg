    spichlerz: 'Spichlerz'
    admin: 'Admin'
  help-entries:
    budynek-zglos:
      short: 'nadaj funkcję budynkowi postawionemu przez graczy'
      description: 'Zaznacz budynek (/ludnosc kopia pos1 i pos2 albo WorldEdit) i zgłoś go z typem: mieszkanie (całe łóżka), spichlerz i magazyn (skrzynie/beczki), koszary (łóżka), kuźnia (kowadło + piec), studnia (źródło wody), karczma (beczka + palenisko), kościół (pulpit + świeca lub dzwon), ratusz (stół kartograficzny + pulpit). Cały obrys na ziemi kraju, bez nachodzenia na inne budynki; limity na kraj i wymagania epoki jak przy zamawianiu. Budowniczowie go nie przebudują ani nie naprawią.'
      rank: 'Doradca lub Władca'
    budynek-typy:
      short: 'typy do zgłoszenia i ich wymagania'
      description: 'Lista typów własnych budynków: wymagane bloki, działanie i czy twój kraj może teraz zgłosić dany typ (limit, poziom osady, ludność, epoka).'
      rank: 'każdy'
    budynek-info:
      short: 'co to za budynek, w którym stoisz'
      description: 'Typ, kraj, kto zgłosił albo zamówił, czy działa i czego brakuje. Pokazuje obrys cząsteczkami.'
      rank: 'każdy'
    budynek-usun:
      short: 'wyrejestruj zgłoszony budynek'
      description: 'Stań w budynku zgłoszonym przez graczy twojego kraju: traci funkcję i znika z rejestru, bloki zostają. Budynków budowniczych to nie dotyczy.'
      rank: 'Doradca lub Władca'
    buduj-gracze:
      short: 'Niezbędne budynki kraju'
      description: 'Kraj graczy: chata, kopalnia, kamieniołom, tartak, pole, przystań, huta szkła, cegielnia, owczarnia, kuźnia, spichlerz, magazyn, studnia i koszary. Pozostałe budowle wznosicie sami; kopie własnych budowli pozostają dostępne.'
      rank: 'Doradca lub Władca'
    buduj-anuluj-plac:
      short: 'Anuluj podgląd lub zleconą budowę'
      description: 'Bez argumentu anuluje tylko podgląd (plac nigdy nie znika przez przypadek — wtedy pokazuje się lista placów). Z id (8 znaków) — wskazany plac; potwierdz — plac, na którym stoisz, albo jedyny plac lub zlecenie. Zwrot 100%, jeśli prace się nie zaczęły, potem według building.refund-on-cancel; materiały niewykorzystane wracają. Kolejka: /ludnosc kolejka anuluj <nr> (zwrot 100%).'
      rank: 'Doradca lub Władca'
    pomoc:
      short: 'ta pomoc'
      description: 'Interaktywna pomoc Ludności. Kliknij komendę, aby ją wpisać.'
      rank: 'każdy'
    info:
      short: 'ludność, łóżka, jedzenie, podatki'
      description: 'Pokazuje liczbę obywateli NPC, mieszkań, stan spichlerza, dzienny podatek i budynki kraju (domyślnie twojego).'
      rank: 'każdy'
    budynki:
      short: 'lista budynków i placów budowy'
      description: 'Zbudowane i zgłoszone budynki kraju oraz postęp trwających budów.'
      rank: 'każdy'
    typy:
      short: 'budynki do zbudowania'
      description: 'Lista szablonów (chata, dom, spichlerz, koszary, kuźnia, studnia, wieża...) z rozmiarem, łóżkami i kosztem.'
      rank: 'każdy'
    buduj:
      short: 'plan budynku z podglądem'
      description: 'Pokazuje obrys budynku cząsteczkami w miejscu, na które patrzysz (front w twoją stronę). Potem obróć, potwierdź lub anuluj. Koszt płaci skarbiec kraju.'
      rank: 'Doradca'
    buduj-auto:
      short: 'planer proponuje budynek'
      description: 'Planer osady wybiera, czego kraj potrzebuje (łóżka, spichlerz, koszary, rozwój, budynki reprezentacyjne według poziomu) i gdzie (płaski teren, front do centrum, droga). Pokazuje podgląd do potwierdzenia.'
      rank: 'Doradca'
    buduj-obroc:
      short: 'obróć plan o 90°'
      description: 'Obraca planowany budynek zgodnie z ruchem wskazówek zegara.'
      rank: 'Doradca'
    buduj-potwierdz:
      short: 'zleć budowę'
      description: 'Płaci ze skarbca i wysyła budowniczych. Budowa trwa stopniowo i przetrwa restart serwera.'
      rank: 'Doradca'
    buduj-anuluj:
      short: 'porzuć plan'
      description: 'Porzuca plan budowy (nic nie kosztuje).'
      rank: 'Doradca'
    plan:
      short: 'pokaż plan miasta'
      description: 'Cząsteczkami pokazuje działki (budynki, budowy, kolejkę) i drogi kraju w pobliżu przez 20 sekund.'
      rank: 'każdy'
    kolejka:
      short: 'kolejka budów kraju'
      description: 'Gdy wszystkie place budowy są zajęte, nowe zamówienia czekają tu (opłacone, z zarezerwowanym terenem) i ruszają same po zakończeniu budowy. Przyciski: wyżej, niżej, pokaż, usuń.'
      rank: 'Doradca'
    kolejka-anuluj:
      short: 'usuń pozycję (zwrot 100%)'
      description: 'Usuwa zamówienie z kolejki i zwraca całą zapłaconą kwotę do skarbca.'
      rank: 'Doradca'
    kolejka-wyzej:
      short: 'przesuń wyżej'
      description: 'Przesuwa zamówienie o jedno miejsce bliżej startu.'
      rank: 'Doradca'
    kolejka-nizej:
      short: 'przesuń niżej'
      description: 'Przesuwa zamówienie o jedno miejsce dalej.'
      rank: 'Doradca'
    kolejka-pokaz:
      short: 'pokaż obrys'
      description: 'Pokazuje obrys zakolejkowanego budynku cząsteczkami przez 10 sekund.'
      rank: 'Doradca'
    napraw:
      short: 'napraw uszkodzony budynek'
      description: 'Zleca naprawę uszkodzonego budynku (id z /ludnosc budynki) albo wszystkich. Koszt zależy od zniszczeń; naprawa ma pierwszeństwo w kolejce budów, ale czeka na koniec oblężenia.'
      rank: 'Doradca'
    modernizuj:
      short: 'modernizuj budynek'
      description: 'Przebudowuje ściany, dach, okna i podłogi budynku na materiały obecnego poziomu osady (id z /ludnosc budynki albo wszystkie). Taniej niż nowy budynek; ma pierwszeństwo w kolejce.'
      rank: 'Doradca'
    kopalnia:
      short: 'kopalnie kraju'
      description: 'Pokazuje kopalnie kraju: górników i miejsca, poziom, długość chodników, dzienny urobek (rudy, kamień, kruszce) i ile trafia od razu do skarbca.'
      rank: 'każdy'
    pora:
      short: 'pora roku i plony'
      description: 'Obecna pora roku (wiosna, lato, jesień, zima), ile dni zostało, mnożniki plonów i wzrostu upraw oraz szansa nieurodzaju. Zimą pola prawie nic nie dają — zrób zapasy jesienią.'
      rank: 'każdy'
    praca:
      short: 'kto gdzie pracuje'
      description: 'Rolnicy na polach, górnicy w kopalniach, kamieniarze, drwale i rybacy: zajęte i wolne miejsca pracy, dzisiejsze plony i połowy z widocznej pracy.'
      rank: 'każdy'
    magazyn:
      short: 'surowce kraju'
      description: 'Drewno od drwali, kamień z kamieniołomów i kopalni, rudy i kruszce z kopalni, ryby z przystani. Nadwyżka idzie do skarbca.'
      rank: 'każdy'
    buduj-wariant:
      short: 'inny wariant planowanego budynku'
      description: 'Dom, chata, kamienica, karczma i inne mają kilka wariantów (szachulec, kamień, strzecha...). Podgląd wybiera wariant dla działki; ta komenda przełącza na następny w tym samym miejscu i obrocie.'
      rank: 'Doradca'
    budowy:
      short: 'place budowy i czego brakuje'
      description: 'Każdy plac budowy kraju: etap (niwelacja, fundament, ściany, dach...), postęp, budowniczowie, materiał do końca (drewno, kamień, szkło, cegła, wełna, siano, żelazo...) z oznaczeniem: z magazynu kraju albo za monety zamówienia, i powód przestoju.'
      rank: 'każdy'
    obywatel:
      short: 'dom, praca, pensja i rodzina obywatela'
      description: 'Karta obywatela: stały dom i łóżko, miejsce pracy, co robi teraz, pensja, oszczędności i rodzina. Spójrz na wieśniaka albo podaj imię.'
      rank: 'każdy'
    obywatele:
      short: 'bezdomni, bezrobotni, oszczędności'
      description: 'Statystyki obywateli kraju: bezdomni, bezrobotni, średnie oszczędności, pary, dzieci, pensje i samodzielne chaty.'
      rank: 'każdy'
    obywatele-chatki:
      short: 'obywatele sami budują chaty'
      description: 'Włącza/wyłącza chaty opłacane z oszczędności obywateli, gdy brakuje łóżek, i limit chat budowanych naraz.'
      rank: 'Doradca+'
    kopia:
      short: 'kopie budowli graczy'
      description: 'Zaznacz budowlę (pos1/pos2 albo WorldEdit) na ziemi kraju i zapisz jako szablon (zapisz, lista, info, nazwa, usun); budowniczowie postawią kopię w innym miejscu (buduj, obrót i podgląd jak przy /ludnosc buduj) za opłatą ze skarbca i z drewnem/kamieniem z magazynu.'
      rank: 'Doradca (zapis/budowa), lista i info — każdy'
    gospodarka:
      short: 'przepływ materiałów kraju'
      description: 'Co produkują pola, tartaki, kamieniołomy, kopalnie i zakłady (huta szkła, cegielnia, owczarnia, kuźnia), gdzie leży towar, które materiały kraj wytwarza, a które kupuje za monety, spichlerz i wzrost, potrzeby budów, tragarze w drodze i braki.'
      rank: 'każdy'
    zaklady:
      short: 'łańcuchy produkcji: szkło, cegły, wełna, siano, żelazo'
      description: 'Zakłady kraju: huta szkła (piasek z brzegów → szkło), cegielnia (glina znad wody → cegły i terakota), owczarnia (owce → wełna, pszenica → bele siana), kuźnia (surowe żelazo → sztabki, węgiel i drewno → pochodnie). Stan pracy, wydobycie dziś, paliwo, stado oraz lista materiałów: z własnych zakładów albo za monety zamówień.'
      rank: 'każdy'
    plan-krolestwo:
      short: 'mapa królestwa'
      description: 'Mapa ziemi kraju w czacie: stolica, osady, drogi, lasy, skały i woda.'
      rank: 'każdy'
    przebudowa:
      short: 'plan przebudowy miasta'
      description: 'Pokazuje nowy plan miasta (ulice, rozbiórki, wyrównanie kwartałów), koszt i czas; potwierdz (Władca) go uruchamia.'
      rank: 'Doradca'
    przebuduj:
      short: 'drogi w stylu epoki'
      description: 'Przebudowuje drogi kraju w stylu obecnej epoki (bruk, kostka, asfalt z pasami, chodniki, latarnie). Płatne ze skarbca.'
      rank: 'Doradca'
    podziemia:
      short: 'podziemia budynków'
      description: 'Piwnice pod domami, lochy pod ratuszem, lochy z tunelem ucieczkowym pod zamkiem i katakumby pod katedrą — stan kopania.'
      rank: 'każdy'
    podziemia-kop:
      short: 'dokop podziemia'
      description: 'Zleca wykopanie podziemi pod starszym budynkiem (id z /ludnosc podziemia). Nowe budynki dostają je same.'
      rank: 'Doradca'
    kopalnia-rozbuduj:
      short: 'rozbuduj kopalnię'
      description: 'Płaci za kolejny odcinek chodnika najkrótszej wolnej kopalni (albo o podanym id). Górnicy drążą go w godzinach pracy.'
      rank: 'Doradca'
    spichlerz:
      short: 'stan spichlerza'
      description: 'Ile jedzenia ma kraj i ile może zmieścić. Jedzenie wkłada się do skrzyń spichlerza.'
      rank: 'każdy'
    spichlerz-oznacz:
      short: 'skrzynia = punkt zbiórki'
      description: 'Skrzynia lub beczka, na którą patrzysz, staje się punktem zbiórki spichlerza: jedzenie włożone do niej trafia do zapasów kraju przy zamknięciu.'
      rank: 'Doradca'
    spichlerz-usun:
      short: 'odznacz skrzynię'
      description: 'Skrzynia, na którą patrzysz, przestaje należeć do spichlerza.'
      rank: 'Doradca'
    dom-zglos:
      short: 'zgłoś dom z zaznaczenia WE'
      description: 'Rejestruje budynek zaznaczony WorldEditem jako mieszkanie; pojemność = liczba łóżek w środku.'
      rank: 'admin'
    dom-usun:
      short: 'wyrejestruj budynek'
      description: 'Usuwa z rejestru budynek, w którym stoisz (bloki zostają).'
      rank: 'admin'
    admin-dodaj:
      short: 'dodaj obywateli'
      description: 'Tworzy n obywateli kraju w miejscu, w którym stoisz (na terenie kraju).'
      rank: 'admin'
    admin-usun:
      short: 'usuń obywateli'
      description: 'Usuwa n obywateli kraju (najpierw wczytanych).'
      rank: 'admin'
    admin-budynek-anuluj:
      short: 'anuluj budowę'
      description: 'Anuluje plac budowy, na którym stoisz, albo o podanym id (początek id wystarczy).'
      rank: 'admin'
    admin-kolejka:
      short: 'kolejka budów kraju'
      description: 'Pokazuje kolejkę budów kraju; z "wyczysc" usuwa wszystkie pozycje ze zwrotem 100%.'
      rank: 'admin'
    admin-jedzenie:
      short: 'ustaw jedzenie'
      description: 'Ustawia zapas jedzenia w spichlerzu kraju.'
      rank: 'admin'
    admin-pora:
      short: 'pora roku: podgląd / ustaw'
      description: 'info pokazuje początek i koniec obecnej pory oraz kraje z nieurodzajem; ustaw <wiosna|lato|jesien|zima> [dzień] zaczyna wybraną porę teraz (ogłoszenie dla wszystkich).'
      rank: 'admin'
    admin-nieurodzaj:
      short: 'wywołaj / zakończ nieurodzaj'
      description: 'Zaczyna nieurodzaj w kraju na podaną liczbę dni (domyślnie seasons.poor-harvest.max-days) albo kończy go słowem koniec.'
      rank: 'admin'
    admin-praca:
      short: 'podgląd pracy wieśniaka'
      description: 'Pokazuje przydział, miejsce pracy, stan (np. niesie plony do spichlerza), trzymany przedmiot i cel wieśniaka, na którego patrzysz. Bez celu: statystyki i czas przebiegu.'
      rank: 'admin'
    admin-dzien:
      short: 'wymuś dzienny rozrachunek'
      description: 'Od razu liczy produkcję, posiłki, podatki NPC i odejścia wszystkich krajów.'
      rank: 'admin'
    admin-wzrost:
      short: 'wymuś wzrost ludności'
      description: 'Od razu wykonuje tick wzrostu ludności.'
      rank: 'admin'
    admin-przebudowa:
      short: 'wymuś przebudowę miasta'
      description: 'Plan v2 dowolnego kraju: podglad (cząsteczki + podsumowanie i postęp), teraz (rozbiórki, wyrównanie kwartałów, ulice i budynki w kwartałach — kolejka uzupełniana na bieżąco; ponowne teraz nie dokłada drugiej przebudowy), anuluj (zatrzymuje trwającą) albo reset (anuluj + teraz). Dodaj darmowo, aby skarbiec nie płacił.'
      rank: 'admin'
    admin-drogi:
      short: 'wymuś drogi epoki'
      description: 'Przebudowuje sieć dróg dowolnego kraju w stylu jego epoki (darmowo = bez kosztu).'
      rank: 'admin'
    admin-modernizuj:
      short: 'wymuś modernizację'
      description: 'Modernizuje wszystkie przestarzałe budynki dowolnego kraju (darmowo = bez kosztu).'
      rank: 'admin'
    admin-reload:
      short: 'przeładuj konfigurację'
      description: 'Wczytuje ponownie config.yml i szablony budynków.'
      rank: 'admin'
    admin-krolestwo:
      short: 'królewska przebudowa KRÓLESTWA'
      description: 'Preview sprawdza przygotowany manifest i assety bez zmiany świata. Start rozpoczyna autoryzowaną pełną przebudowę jednego ustalonego kraju. Status pokazuje postęp, resume po awarii ponownie sprawdza SHA i bezpiecznie powtarza etapy. Wymaga przygotowanych kopii zapasowych; nie uruchamia restartu.'
      rank: 'admin'

# Fizyczne magazyny: skan wyłącznie znanych bbox, bez wymuszania chunków.
production:
  scan-blocks-per-tick: 128
  # Maksymalnie jeden zatwierdzony pakiet na interwał; trwały zapis regionów może opóźnić tick.
  commit-interval-ticks: 20
  # Magazyn (zamówiony i zgłoszony): każda skrzynia i beczka w jego obrysie jest składem kraju — najwyżej tyle na magazyn.
  warehouse-containers: 40

# Alerty tylko do władcy i doradców kraju. Kraje NPC: jawnie wskazani zarządcy.
alerts:
  enabled: true
  cooldown-seconds: 600       # ograniczone do 60–3600 s; osobno na miejsce pracy / kraj dla żywności
  npc-manager-uuids: []      # brak automatycznego rozsyłania wszystkim administratorom

# Opcjonalny most pluginów: rzeczywisty transfer gracz -> istniejący magazyn kraju.
supply:
  enabled: true
  warehouse-range: 16       # od gracza do każdej połowy skrzyni; ograniczone do 4–32 bloków
  disk-proof-timeout-seconds: 30 # 5–120 s; brak obu zapisanych markerów -> blokada/audyt, nie potwierdzenie
  allowed-materials: [COBBLESTONE, COBBLED_DEEPSLATE, STONE, STONE_BRICKS, OAK_LOG, SPRUCE_LOG, BIRCH_LOG, RAW_IRON, RAW_COPPER, IRON_INGOT, COAL, TORCH, WHEAT, COD, SALMON, BREAD, CARROT, POTATO]
