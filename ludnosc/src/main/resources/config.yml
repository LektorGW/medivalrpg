  brama: {cost: 8000, tier: 2, max-per-country: 4, population: 20}
  zamek: {cost: 60000, tier: 3, max-per-country: 1, population: 40, treasury: 100000, bonus: {tax: 0.1}}
  pole: {cost: 600, tier: 0}
  palac: {cost: 150000, tier: 4, max-per-country: 1, population: 60, treasury: 250000, bonus: {tax: 0.15}}
  piekarnia: {cost: 3500, tier: 1, max-per-country: 2, population: 8, bonus: {food: 12}}
  browar: {cost: 5000, tier: 2, max-per-country: 1, population: 16, bonus: {tax: 0.04, growth: 0.1}}
  tartak: {cost: 3000, tier: 1, max-per-country: 2, population: 8, bonus: {tax: 0.05}}
  kopalnia: {cost: 4000, tier: 1, max-per-country: 2, population: 10}
  biblioteka: {cost: 9000, tier: 2, max-per-country: 1, population: 20, bonus: {tax: 0.02, growth: 0.15}}
  zielarnia: {cost: 3000, tier: 1, max-per-country: 1, population: 10, bonus: {growth: 0.25}}
  przystan: {cost: 3000, tier: 1, max-per-country: 2, population: 8, bonus: {food: 10, tax: 0.03}}
