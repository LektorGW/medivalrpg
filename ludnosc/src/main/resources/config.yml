  koszary: {cost: 6000, tier: 1, max-per-country: 3, population: 10}
  wieza: {cost: 5000, tier: 1}
  karczma: {cost: 7000, tier: 1, max-per-country: 2, population: 12, bonus: {tax: 0.05, growth: 0.1}}
  mlyn: {cost: 6000, tier: 1, max-per-country: 2, population: 12, bonus: {food: 8}}
  stajnia: {cost: 4500, tier: 1, max-per-country: 2, population: 10}
  mur: {cost: 2500, tier: 1, population: 10}
  targ: {cost: 5000, tier: 2, max-per-country: 1, population: 16, bonus: {tax: 0.1}}
  kamienica: {cost: 9000, tier: 2, population: 16}
