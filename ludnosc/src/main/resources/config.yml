# Copyright (c) 2026 Maciej Kaczmarczyk — lektoro.pl
# Ludnosc — obywatele NPC (wieśniacy) państw i budowanie budynków. Serwer MEDIVALRPG.
# Kwoty pieniędzy zawsze w miedziakach (1 sr = 10 md, 1 zł = 100 md). Jedzenie liczone w "punktach jedzenia".
# Teksty: MiniMessage (https://docs.advntr.dev/minimessage/format.html).

# Transport wizualny działa na istniejących torach, w załadowanych chunkach blisko graczy.
# Wagoniki kopalniane: każda epoka; tramwaje: od 3; dźwigi przy wieżowcach: od 4.
# Przy limicie epok 2 działają wyłącznie wagoniki kopalniane.
transport:
  enabled: true
  max-carts: 24
  max-cranes: 8

citizens:
  # Wieśniak bez kraju, który się urodzi albo stoi (przy wczytaniu chunka / zajęciu terenu) na terenie kraju,
  # staje się jego obywatelem.
  adopt-villagers: true
  # true = przyjmuj tylko, gdy kraj ma wolne łóżka.
  adopt-requires-free-housing: false
  # Imię obywatela (custom name). <imie>, <kraj>, <kolor>...</kolor> = kolor kraju.
  name-format: '<kolor><imie></kolor>'
  # false = imię widać po najechaniu celownikiem, true = zawsze nad głową.
  name-always-visible: false
  # Nadany zawód nie przepada, gdy wieśniak nie znajdzie stanowiska pracy (ustawia 1 pkt doświadczenia).
  lock-profession: true
  # Wagi losowania zawodu nowych osadników (klucze vanilla bez "minecraft:"). none = bezrobotny.
  professions:
    farmer: 30
    fisherman: 6
    shepherd: 6
    butcher: 5
    fletcher: 5
    mason: 5
    leatherworker: 4
    librarian: 4
    cleric: 4
    armorer: 4
    weaponsmith: 4
    toolsmith: 4
    cartographer: 2
    none: 10
  # Rekord obywatela, którego nie ma w chunku ostatniej znanej pozycji przy tylu kolejnych wczytaniach, jest usuwany.
  forget-after-missed-loads: 3
  # Rozwiązanie kraju: release = zostają zwykłymi wieśniakami, remove = znikają.
  on-disband: release
  # Chunk zdobyty / przekazany innemu krajowi: switch = obywatele przechodzą do nowego kraju,
  # release = stają się wolnymi wieśniakami, leave = odchodzą (znikają).
  on-conquest: switch
  # Chunk porzucony (dzicz, np. bankructwo): release | keep (zostają obywatelami) | leave.
  on-unclaim: release
  # Pobór (LudnoscApi.conscript): najpierw najbliższy załadowany wieśniak; true = gdy żadnego nie ma w pobliżu,
  # bierze obywatela z niezaładowanego chunka (od razu znika z rejestru, encja zniknie przy wczytaniu chunka).
  # Dzięki temu rekrutacja z panelu www i przez AI działa także bez graczy w pobliżu.
  conscript-unloaded: true
  names:
    - Bolesław
    - Mieszko
    - Kazimierz
    - Władysław
    - Przemysł
    - Bogdan
    - Bogusław
    - Bronisław
    - Czesław
    - Dobromir
    - Jarosław
    - Mirosław
    - Radosław
    - Sobiesław
    - Stanisław
    - Wojciech
    - Zbigniew
    - Ziemowit
    - Leszek
    - Lech
    - Racibor
    - Siemowit
    - Wit
    - Zawisza
    - Jan
    - Maciej
    - Bartosz
    - Szymon
    - Mikołaj
    - Wawrzyniec
    - Florian
    - Jakub
    - Marcin
    - Piotr
    - Tomasz
    - Grzegorz
    - Bartłomiej
    - Michał
