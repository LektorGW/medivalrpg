  magazyn: {cost: 6000, tier: 2, max-per-country: 2, population: 16, bonus: {granary: 300}}
  laznia: {cost: 8000, tier: 2, max-per-country: 1, population: 18, bonus: {growth: 0.15}}
  latarnia: {cost: 9000, tier: 2, max-per-country: 1, population: 20, bonus: {food: 4, tax: 0.03}}
  rynek: {cost: 14000, tier: 3, max-per-country: 1, population: 30, treasury: 30000, bonus: {tax: 0.06, growth: 0.05}}
  ogrody: {cost: 30000, tier: 4, max-per-country: 1, population: 60, treasury: 150000, bonus: {tax: 0.03, growth: 0.1}}
  koszary2: {cost: 14000, tier: 3, max-per-country: 2, population: 30}
  akademia: {cost: 22000, tier: 3, max-per-country: 1, population: 35, treasury: 50000}
  skarbiec: {cost: 25000, tier: 3, max-per-country: 1, population: 35, treasury: 60000, bonus: {tax: 0.08}}
  katedra: {cost: 90000, tier: 4, max-per-country: 1, population: 50, treasury: 120000, bonus: {tax: 0.02, growth: 0.3}}
  arena: {cost: 35000, tier: 3, max-per-country: 1, population: 35, treasury: 40000, bonus: {tax: 0.04, growth: 0.05}}
  most: {cost: 5000, tier: 1, max-per-country: 4, population: 10, bonus: {tax: 0.02}}
  kamieniolom: {cost: 4500, tier: 2, max-per-country: 2, population: 12, bonus: {tax: 0.04}}
  # Budynki epok (plugin Postep): wymagana epoka i odkrycie są w szablonie (requires.era, requires.discovery).
  kamienica_renesansowa: {cost: 9000, tier: 1, population: 14}
  kamienica_czynszowa: {cost: 12000, tier: 2, population: 20}
  fabryka: {cost: 25000, tier: 2, max-per-country: 3, population: 25, bonus: {tax: 0.10}}
  dworzec: {cost: 30000, tier: 3, max-per-country: 1, population: 30, bonus: {tax: 0.06, growth: 0.05}}
  blok: {cost: 30000, tier: 2, population: 40}
  wiezowiec_biurowy: {cost: 120000, tier: 3, max-per-country: 2, population: 60, treasury: 150000, bonus: {tax: 0.15}}
  wiezowiec: {cost: 200000, tier: 5, max-per-country: 3, population: 120, treasury: 250000}

register:
  # /ludnosc dom zglos — maksymalna objętość zaznaczenia WorldEdit.
  max-volume: 40000

# Budynki postawione ręcznie przez graczy i zgłoszone z typem: /ludnosc budynek zglos <typ> [nazwa] (Władca/Doradca —
# ranga building.rank). Zaznaczenie z /ludnosc kopia pos1/pos2 albo WorldEdit. Cały obrys na ziemi własnego kraju,
# bez nachodzenia na inne budynki, place budowy i miejsca zamówione w kolejce. Limity na kraj i wymagania (epoka,
# odkrycie, poziom osady, ludność, skarbiec) jak dla budynku zamawianego tego rodzaju (szablon `template`).
# Zgłoszony budynek nie jest burzony, przebudowywany, modernizowany ani naprawiany przez budowniczych; bez kluczowych
# bloków jego funkcja wyłącza się do czasu naprawy przez graczy.
player-buildings:
  enabled: true
  max-volume: 32768          # największe zaznaczenie (pól)
  min-side: 3                # najmniejsza szerokość i głębokość
  min-height: 3              # najmniejsza wysokość
  max-per-country: 40        # wszystkich zgłoszonych budynków kraju (0 = bez limitu)
  requirements: true         # poziom osady, ludność i skarbiec jak przy zamawianiu (epoka i odkrycie zawsze)
  recheck-delay-ticks: 40    # po zmianie bloków w budynku: ponowne sprawdzenie po tylu tickach
  sweep-seconds: 30          # co tyle sekund sprawdzany jest jeden wczytany zgłoszony budynek (0 = wyłącz)
  # Typy (klucz → nadpisania). Klucze: enabled, name, max (zgłoszonych tego typu na kraj, 0 = tylko limit szablonu),
  # min-volume, template, function, effect, blocks: [{name, count, materials: [BLOK|#BED|#WATER|#CONTAINER|#ANVIL|#CANDLE]}].
  # #BED = całe łóżko (obie połowy w obrysie), #WATER = źródło wody, #CONTAINER = skrzynia/beczka.
  # Domyślne (w kodzie): mieszkanie, spichlerz (max 3), magazyn, koszary, kuznia, studnia, karczma, kosciol, ratusz.
  # Funkcje z własnym mechanizmem (kopalnia, pole, tartak, kamieniołom, przystań, huta, cegielnia, owczarnia, mur,
  # brama, most) i budynki epok przemysłowych nie są przyjmowane.
  types:
    spichlerz:
      max: 3

templates:
  # Kopiuje wbudowane szablony do plugins/Ludnosc/budynki/ (można je tam edytować; pliki mają pierwszeństwo).
  export-builtins: true
  # Koszt budynku z pliku .schem bez pliku opisu <nazwa>.schem.yml.
  schematic-default-cost: 3000
  # Sprawdza przy starcie obracanie stanów bloków z BlockData#rotate serwera (ostrzega przy różnicach).
  verify-rotation: true

storage:
  autosave-minutes: 5

