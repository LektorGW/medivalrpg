growth:
  # Co ile minut kraj może dostać nowego osadnika (jeśli ludność < mieszkania i jest jedzenie).
  interval-minutes: 20
  max-per-tick: 1
  # Jedzenie zużywane przez przybycie jednego osadnika.
  food-per-settler: 20

daily:
  # Dzienny rozrachunek: produkcja jedzenia, posiłki, podatki NPC, odejścia. Nadrabiany po restarcie.
  time: '06:00'
  timezone: 'Europe/Warsaw'
  max-catch-up-days: 3

food:
  per-citizen: 4
  # Jedzenie dziennie od jednego dorosłego rolnika (farmer).
  farmer-production: 10
  # Jedzenie dziennie z jednego pola uprawnego (budynek "pole").
  farm-production: 15
  # Pojemność spichlerza kraju: bazowa + za każdy zbudowany spichlerz.
  base-capacity: 300
  capacity-per-granary: 2000
  # Ile skrzyń/beczek można oznaczyć /ludnosc spichlerz oznacz (poza tymi w budynkach spichlerza).
  max-marked-chests: 6
  # Punkty jedzenia za sztukę przedmiotu włożonego do skrzyni spichlerza.
  items:
    WHEAT: 1
    CARROT: 1
    POTATO: 1
    BEETROOT: 1
    BREAD: 5
    BAKED_POTATO: 4
    APPLE: 3
    MELON_SLICE: 1
    SWEET_BERRIES: 1
    HAY_BLOCK: 9
    COOKED_BEEF: 8
    COOKED_PORKCHOP: 8
    COOKED_MUTTON: 6
    COOKED_CHICKEN: 6
    COOKED_RABBIT: 5
    COOKED_COD: 5
    COOKED_SALMON: 6
    BEEF: 3
    PORKCHOP: 3
    MUTTON: 2
    CHICKEN: 2
    COD: 2
    SALMON: 2
    PUMPKIN_PIE: 8
    MUSHROOM_STEW: 6
    BEETROOT_SOUP: 6
    RABBIT_STEW: 10
    COOKIE: 1
    DRIED_KELP: 1

taxes:
  # Dzienny podatek od dorosłego obywatela NPC (md), mnożony przez mnożnik zawodu.
  per-citizen: 3
  baby-multiplier: 0.0
  # Mnożnik przy całkowitym głodzie (liniowo do 1.0 przy pełnym wyżywieniu).
  hungry-multiplier: 0.3
  # Mnożnik dla obywateli ponad liczbę łóżek.
  homeless-multiplier: 0.5
  # Decyzja użytkownika 2026-10-29: podatek obywateli NPC +50% (mnożniki ×1,5; per-citizen jest liczbą całkowitą).
  professions:
    none: 0.9
    nitwit: 0.3
    farmer: 1.5
    fisherman: 1.5
    shepherd: 1.5
    butcher: 1.65
    fletcher: 1.8
    mason: 1.8
    leatherworker: 1.8
    librarian: 2.25
    cleric: 2.1
    cartographer: 2.25
    armorer: 2.4
    weaponsmith: 2.4
    toolsmith: 2.25

departures:
  # Dni głodu tolerowane; potem odchodzi ułamek ludności (proporcjonalnie do braku jedzenia) dziennie.
  hunger-grace-days: 2
  hunger-fraction: 0.2
  # Dni z brakiem łóżek tolerowane; potem odchodzi ułamek bezdomnych dziennie.
  homeless-grace-days: 3
  homeless-fraction: 0.25
  max-per-day: 5
  # Głód działa stopniowo: jednego dnia odchodzi najwyżej taki ułamek ludności (zawsze co najwyżej max-per-day).
  max-fraction-per-day: 0.1

# Pory roku (jeden cykl dla całego serwera, w czasie rzeczywistym): wiosna → lato → jesień → zima.
# Pora mnoży produkcję jedzenia (rolnicy, pola, premie budynków, jedzenie wirtualne krajów NPC, widoczne zbiory).
# Zimą pola dają bardzo mało — kraje muszą zrobić zapasy jesienią. Zmiana pory jest ogłaszana graczom.
seasons:
  enabled: true
  # Długość jednej pory roku w dniach rzeczywistych (może być ułamek, np. 0.5).
  length-days: 7
  # Pora, od której zaczyna się cykl przy pierwszym uruchomieniu (wiosna | lato | jesien | zima).
  # Potem pora jest liczona z zapisanego początku (data.json); zmiana: /ludnosc admin pora ustaw.
  first: jesien
  # Mnożnik produkcji jedzenia w danej porze.
  food:
    wiosna: 0.9
    lato: 1.1
    jesien: 1.4
    zima: 0.25
  # Szansa, że krok wzrostu upraw w świecie (pszenica, marchew, ziemniaki, buraki...) się uda (1 = jak w vanilla).
  crop-growth:
    enabled: true
    wiosna: 1.0
    lato: 1.0
    jesien: 0.9
    zima: 0.4
  # Kraje NPC też odczuwają pory roku i nieurodzaj.
  affects-npc-countries: true
  # Ogłoszenie nowej pory (czat + tytuł) i krótka informacja po wejściu na serwer.
  announce: true
  announce-on-join: true
  # Nieurodzaj: losowany codziennie (dzienny rozrachunek) osobno dla każdego kraju z ludnością.
  poor-harvest:
    chance:
      wiosna: 0.04
      lato: 0.06
      jesien: 0.03
      zima: 0.0
    # Mnożnik produkcji jedzenia podczas nieurodzaju i jego długość w dniach rzeczywistych.
    multiplier: 0.4
    min-days: 2
    max-days: 4
    # Po nieurodzaju kraj ma tyle dni spokoju.
    cooldown-days: 10

# Praca obywateli: przydział do pól, kopalń, kamieniołomów, tartaków i przystani oraz widoczna praca wieśniaków.
# Plan dnia (do pracy, targ, karczma, dom) prowadzi plugin Zycie; Ludnosc steruje wieśniakiem tylko na miejscu pracy.
# Bez Zycie Ludnosc sama prowadzi pracowników do pracy. Wszystko tylko w załadowanych chunkach, w pobliżu graczy;
# niezaładowane osady produkują wirtualnie (dzienny rozrachunek).
work:
  enabled: true
  # Widoczna praca tylko z graczem w tym promieniu (bloki).
  player-range: 64
  # Wydajność: najwyżej tylu wieśniaków co 5 ticków i budżet czasu na jeden przebieg (ms).
  citizens-per-tick: 12
  budget-ms: 1.0
  # Godziny pracy (czas MC: 0 = 6:00, 6000 = 12:00) — jak praca w planie dnia Zycie.
  hours: {start: 2000, end: 9000}
  # Odnoszenie plonów do spichlerza po pracy (zebranie przy dzwonie — Zycie wtedy nie steruje).
  delivery-hours: {start: 9000, end: 10500}
  # Zawody vanilla w kolejności pierwszeństwa (najpierw pierwszy zawód, potem kolejne; none = bezrobotny).
  jobs:
    farmer: [farmer]
    miner: [mason, toolsmith, armorer, weaponsmith, none]
    quarryman: [mason, none]
    woodcutter: [fletcher, none]
    fisher: [fisherman]
  # Miejsca pracy w budynku (kopalnia: mines.slots-base + mines.slots-per-level za poziom).
  slots:
    farm: 2
    quarry: 2
    sawmill: 2
    harbor: 2
  # Rolnik niesie tyle zbiorów, zanim pójdzie do spichlerza (resources.food-per-harvest × pora roku za zbiór).
  basket: 6
  # Dzienny limit jedzenia z widocznych zbiorów na rolnika (ponad jego zwykłą dzienną produkcję) i ryb na rybaka.
  harvest-cap-per-farmer: 8
  fish-cap-per-fisher: 6
  # Najdalszy spichlerz (budynek albo oznaczona skrzynia), do którego rolnik zanosi plony; dalej — oddaje przy polu.
  granary-range: 64
  # Droga do spichlerza trwająca dłużej jest zaliczana bez dojścia (jedzenie nie przepada).
  delivery-timeout-seconds: 45
  # Pole bez pracującego obywatela-rolnika obsługuje manekin-zastępca (false = tylko obywatele).
  stand-in-workers: true
  # Rolnicy otwierają furtkę pola i zamykają ją po wyjściu (tylko pola Ludnosc).
  open-field-gates: true

protection:
  enabled: true
  # Obcy nie mogą krzywdzić obywateli na terenie ich kraju. W wojnie (KrajeApi.isAtWar) mogą, jeśli true.
  war-allows-damage: true
  # Obywatele-gracze mogą krzywdzić własnych wieśniaków.
  own-country-can-damage: true
  # Zakaz zmiany imienia obywatela nametagiem i prowadzenia go na smyczy przez obcych.
  block-name-tags: true
  block-leash-by-foreigners: true

npc-countries:
  # Kraj NPC (CountryCreateEvent npc=true): osadnicy w stolicy, zapas jedzenia i darmowe budynki startowe.
  initial-settlers: 4
  initial-food: 200
  # Jedzenie wirtualne co dzień (bez rolników i skrzyń).
  virtual-food-per-day: 10
  virtual-food-per-citizen: 5
  ignore-capacity: false
  starting-buildings: [dom]
  starting-buildings-free: true

building:
  # Minimalna ranga w kraju do /ludnosc buduj (CITIZEN, ADVISOR, RULER).
  rank: ADVISOR
  # Place budowy naraz: bazowo + sites-per-tier za każdy poziom osady powyżej Osady + sites-per-era za każdą epokę
  # powyżej Średniowiecza (plugin Postep), najwyżej max-sites-cap (Osada 5, Wieś 6 … Metropolia 10).
  max-sites-per-country: 5
  sites-per-tier: 1
  sites-per-era: 1
  max-sites-cap: 12
  # Bloki na sekundę na jednego budowniczego.
  blocks-per-second: 2.0
  builders-per-site: 2
  # Limit bloków na jeden tick nadrabiania (plac wczytany po przerwie).
  max-blocks-per-tick: 40
  # Czy plac w niezaładowanym chunku też "pracuje" (bloki zostaną postawione po wczytaniu, nic się nie ładuje).
  offline-progress: true
  # Ile warstw naturalnego terenu (ziemia, kamień, piasek...) powyżej podłogi wolno wykopać.
  max-terrain-cut: 2
  # Maksymalna głębokość fundamentu pod podłogą.
  max-foundation-depth: 12
  # Zwrot kosztu przy anulowaniu budowy (0..1).
  refund-on-cancel: 0.5
  # Jak długo trwa podgląd /ludnosc buduj (sekundy).
  preview-seconds: 90
  # Dodatkowe bloki uznawane za naturalny teren (oprócz ziemi, kamienia, piasku, liści, terakoty).
  terrain-blocks: [GRAVEL, CLAY, SNOW_BLOCK, ICE, PACKED_ICE, SANDSTONE, RED_SANDSTONE, MOSS_BLOCK, MUD, COAL_ORE, IRON_ORE, COPPER_ORE]
  builder:
    # mannequin = postać gracza z narzędziem, villager = wieśniak-murarz (bez AI).
    type: mannequin
    # Nicki Mojang do skinów budowniczych (pusta lista = domyślne skiny Mannequina).
    skins: []
    tools: [IRON_AXE, IRON_SHOVEL, STONE_PICKAXE, IRON_PICKAXE, WOODEN_AXE]
    move-interval-ticks: 30
  hologram: true
  effects: true

construction:
  # Kolejka budów: gdy kraj ma już building.max-sites-per-country placów, nowe zamówienia czekają w kolejce
  # (płatne od razu, teren zarezerwowany). Anulowanie pozycji z kolejki zwraca 100%. 0 = bez kolejki.
  queue-size: 10
  # Budżet CPU: najwyżej tyle bloków na tick budowy (co 0,5 s) na kraj i na cały serwer (place obsługiwane po kolei).
  blocks-per-tick-country: 80
  blocks-per-tick-server: 400
  # Aktywne place budowy trzymają swoje chunki załadowane (bilety chunków pluginu), żeby budowa szła 24/7 także bez
  # graczy w pobliżu. Limit na cały serwer; pierwszeństwo mają najstarsze zamówienia. Place poza limitem budują
  # wirtualnie (postęp liczony w czasie) i nadrabiają po wczytaniu chunka.
  keep-loaded: true
  max-loaded-chunks-total: 64
  # Godziny pracy w czasie Minecrafta (0 = 6:00, 12000 = 18:00). Poza nimi budowniczowie odpoczywają przy ognisku.
  work-hours:
    enabled: true
    start: 0
    end: 12000
  night-campfire: true
  # Materiały: na placu stoi skrzynia "magazyn budowy". Drewno (kłody, 1 kłoda = 4 deski) i kamień (bruk, kamień)
  # przynoszą do niej tragarze z magazynów kraju, a budowniczowie zużywają je blok po bloku. Pozostałe bloki (szkło,
  # wełna, kraty...) są opłacone kosztem zamówienia. false = budowa wyłącznie za monety (bez fizycznego materiału).
  require-materials: true
  # Kraj bez tartaku (drewno) albo kamieniołomu/kopalni (kamień) lub bez żadnego zarejestrowanego magazynu kupuje dany
  # materiał za monety zamówienia (nie blokuje się). Kraj, który go wytwarza, czeka na dostawę najwyżej tyle minut,
  # potem też kupuje (0 = czeka bez końca).
  material-wait-minutes: 60
  # Ile bloków budowniczy przynosi naraz ze stosu materiału na placu (potem idzie po kolejną porcję; 0 = bez noszenia).
  carry-load: 12
  # Budowniczych: building.builders-per-site + 1 na każde N bloków budynku, maksymalnie builders-max.
  blocks-per-extra-builder: 800
  builders-max: 6
  # Szybkość chodu budowniczych (bloki/s) i zasięg rąk (bloki).
  walk-speed: 3.5
  reach: 4.5
  # Rusztowanie przy ścianach wyższych niż N bloków (rozbierane po zakończeniu).
  scaffolding: true
  scaffolding-min-height: 3
  scaffolding-max-blocks: 400
  # Schody do drzwi zewnętrznych, gdy próg jest nad terenem.
  entrance-stairs: true
  max-entrance-steps: 8
  # Modernizacja (nowe materiały po awansie osady): koszt = koszt budynku × udział bloków-materiałów × mnożnik.
  upgrade-cost-multiplier: 0.4

underground:
  # Podziemia budynków: piwnice (cellar) pod domami, lochy (dungeon) pod ratuszem, lochy z tunelem ucieczkowym
  # (tunnel) pod zamkiem, katakumby (catacombs) pod katedrą. Kopane stopniowo w godzinach pracy po zbudowaniu
  # budynku (starsze budynki: /ludnosc podziemia kop, kraje NPC same). Najpierw obmurowanie (jaskinie, woda i lawa
  # odcięte), potem kopanie, na końcu drabiny, światło i wyposażenie. Wejście: klapa w podłodze.
  enabled: true
  blocks-per-step: 6
  # Każda gotowa piwnica powiększa spichlerz o tyle.
  cellar-capacity: 50
  # Typ budynku → rodzaj podziemi (none = bez).
  features:
    chata: cellar
    dom: cellar
    kamienica: cellar
    karczma: cellar
    ratusz: dungeon
    zamek: tunnel
    katedra: catacombs
  # Koszt dokopania podziemi do istniejącego budynku (md); przy nowych budynkach gratis.
  cost:
    cellar: 300
    dungeon: 3000
    tunnel: 5000
    catacombs: 4000

resources:
  # Drwale z tartaków ścinają całe drzewa na ziemi kraju (z liśćmi), sadzą sadzonki; omijają drogi, budynki z ogrodami
  # i centrum, zawsze zostawiają co najmniej keep-trees-around drzew w pobliżu. Kamieniołomy, kopalnie i przystanie
  # dają kamień, rudy i ryby raz dziennie. Nadwyżka ponad sell-above jest sprzedawana do skarbca (ceny w md).
  lumberjacks: true
  lumberjack-blocks-per-step: 3
  lumberjack-rest-seconds: 20
  lumberjack-radius: 28
  lumberjack-max-logs: 120
  keep-trees-around: 3
  quarry-stone-per-day: 32
  mine-ore-per-day: 8
  harbour-fish-per-day: 16
  sell-above: 512
  prices: {drewno: 2, kamien: 1, rudy: 6, ryby: 2, kruszce: 25}
  # Rolnicy na polach zbierają dojrzałe uprawy i sieją od nowa (jedzenie do spichlerza), kamieniarze i rybacy pracują
  # w kamieniołomie i na przystani (produkcja dzienna). Przy require-materials brakujące drewno/kamień biorą z magazynu.
  field-workers: true
  food-per-harvest: 2

logistics:
  # Tragarze NPC przenoszą prawdziwe przedmioty między zarejestrowanymi skrzyniami kraju: pełne magazyny tartaków,
  # kamieniołomów i kopalń → magazyn kraju; plony pól i ryby → spichlerz (zamieniane na zapas jedzenia, który zasila
  # wzrost ludności); drewno i kamień z magazynów → skrzynia placu budowy. Oba końce muszą być wczytane i w zasięgu.
  enabled: true
  # przedmiotów na jeden kurs, najdłuższy kurs (bloki), tragarzy naraz na kraj i na serwer
  load: 32
  max-distance: 160
  per-country: 3
  total: 16
  # tyle jednostek drewna/kamienia (1 kłoda = 4) tragarze trzymają w skrzyni placu, gdy budowa jeszcze ich potrzebuje
  site-stock: 96
  # od takiego zapełnienia slotów skrzynia miejsca pracy jest opróżniana do magazynu kraju
  unload-fill: 0.75
  walk-speed: 2.5

workshops:
  # Łańcuchy produkcji wiosek (huta szkła, cegielnia, owczarnia, kuźnia). Zakład pracuje fizycznie tylko w
  # wczytanym terenie z graczem w promieniu player-range, w godzinach pracy; wszystko trafia do jego prawdziwej skrzyni
  # (albo magazynu kraju), a tragarze wożą dalej. Materiał, którego kraj nie wytwarza (brak zakładu albo zakład bez
  # surowca/paliwa dłużej niż stall-grace-minutes), budowy kupują za monety zamówienia jak dotąd.
  enabled: true
  player-range: 96
  budget-ms: 2.0
  per-tick: 6
  action-seconds: 10
  stall-grace-minutes: 20
  # bez nowego kroku, gdy tyle zapisów produkcji czeka (kopalnie i pola mają swoją kolej); zakład bez własnej
  # skrzyni (pracujący z magazynu kraju) robi krok najwyżej co shared-store-seconds
  max-pending: 2
  shared-store-seconds: 30
  dig:
    # piasek (huta) i glina (cegielnia) wyłącznie na ziemi kraju: poza strefami planu gracza, obszarami chronionymi,
    # spawnem, budynkami i drogami; tylko wierzchnia warstwa (bez dołów, bez nowych strumieni przy wodzie)
    radius: 24
    sand-per-day: 48
    clay-per-day: 24
    scan-columns: 192
    rescan-seconds: 120
    spawn-radius: 160
    building-margin: 3
  kiln:
    batch: 8
    # wytopów z 1 węgla / węgla drzewnego (kłody zamieniane na węgiel drzewny, gdy nie ma czym palić)
    smelts-per-fuel: 8
    brick-stock: 64
    terracotta-stock: 16
  smithy:
    # kuźnia wytapia surowe żelazo z kopalni i robi pochodnie (1 kłoda + 4 węgle → 16)
    enabled: true
    torch-stock: 32
  sheep:
    flock: 4
    # pierwsza para w cenie budynku; po wymarciu stada nowa para po refound-days dniach (0 = nigdy)
    founders: 2
    regrow-minutes: 10
    breed-minutes: 15
    refound-days: 3
    hay-stock: 4

walls:
  # Mury miejskie (kraje NPC, od poziomu osady from-level): prostokąt wokół zabudowy + margin, baszty co tower-every
  # bloków i w narożnikach, bramy tam, gdzie mur przecina drogi; budowane modułami po module-cells bloków.
  from-level: 2
  margin: 6
  tower-every: 16
  module-cells: 32
  cost-per-cell: 40
  # Mur idzie za miastem: wypukła otoczka zabudowy, po grzbietach, z bramami na każdej drodze; rzeka, jezioro i klif
  # zastępują mur. Gdy miasto wyrośnie poza mur (albo kraj straci ziemię), powstaje nowy pierścień, a stary jest
  # rozbierany odcinkami (demolish) albo zostaje jako mur wewnętrzny (keep). Najpierw odcinki od strony obcych/wrogów.
  old-ring: demolish

kingdom:
  # Plan królestwa (kraje NPC): duży i bogaty kraj zakłada nowe osady na swojej ziemi, co najmniej min-distance bloków
  # od innych osad (płasko, sucho, zwarcie), z własnym centrum (najpierw studnia) i planowaniem; trakt do stolicy.
  min-level: 2
  min-treasury: 60000
  min-chunks: 24
  min-distance: 96
  max-settlements: 3
  # Wojna: palisady / mury na najbardziej zagrożonych odcinkach granicy (od strony wroga), najwyżej tyle odcinków.
  border-segments: 6

redesign:
  # Przeprojektowanie miasta (plan v2): regularne ulice wokół rynku (gęstsze w późniejszych epokach), kwartały,
  # zieleń. Kraje NPC liczą plan po awansie i co interval-hours, gracze przez /ludnosc przebudowa. Realizacja
  # stopniowa: rozbiórki co demolish-hours (tylko budynki Ludnosc, nigdy zabytki), ulice odcinkami, niwelacja wolnych
  # kwartałów najwyżej level-blocks-per-day bloków terenu dziennie na kraj.
  radius: 96
  interval-hours: 24
  demolish-hours: 2
  level-blocks-per-day: 4000
  level-cost-per-column: 1
  # /ludnosc admin przebudowa|drogi|modernizuj: płaci skarbiec kraju (chyba że admin doda "darmowo").
  admin-pays: true

rebuild:
  # Zabytki: nigdy nie są wyburzane.
  heritage: [kosciol, katedra, zamek, palac, pomnik, ratusz, cmentarz]
  # Przebudowa miast w nowej epoce (plugin Postep): drogi w stylu epoki, modernizacja materiałów, wyburzanie małych
  # domów i stawianie większych (chata → kamienica → blok). Kraje NPC same, przez kolejne tygodnie; co ile godzin
  # najwyżej jedna rozbiórka; budynki bliżej placu niż old-town-radius zostają jako starówka.
  demolish-hours: 6
  old-town-radius: 22

villages:
  # Przejmowanie wiosek (LudnoscApi.findVillage/adoptVillage, woła je Armia): chunk z co najmniej tyloma blokami
  # ziemi uprawnej należy do wioski; zasięg szukania pokoju wokół łóżka (domy → "dom wiejski");
  # tyle bloków ziemi uprawnej liczy się jak jedno pole (jedzenie, food.farm-production).
  min-farmland-per-chunk: 4
  house-reach: 7
  farmland-per-field: 40

mines:
  # Fizyczne światło w galerii, przed wydobyciem wymagającym kolejnego punktu oświetlenia.
  lighting:
    enabled: true
    spacing: 7
    item: TORCH
    consume-from-store: true
  # Kopalnia drąży chodnik z dna szybu: schody w dół o "depth" bloków, potem poziomy chodnik z torami, stemplami
  # i pochodniami. Omija wodę i lawę, zamurowuje jaskinie, nie kopie pod cudzym terenem. Jeden krok co 2 s w godzinach pracy.
  depth: 12
  # Kroki chodnika w jednym zleceniu rozbudowy (pierwsze po zbudowaniu kopalni gratis) i jego koszt (md).
  extension-blocks: 16
  extension-cost: 800
  # Dłuższe chodniki: poziomy kopalni (1–5) rosną z długością, piętrami (co 10 bl. w dół) i epoką.
  max-length: 400
  # Dochód dzienny za każdy blok chodnika (md), wypłacany razem z podatkiem NPC.
  income-per-block: 2
  # Urobek: dziennie na górnika (obywatele z work.jobs.miner), × poziom kopalni × narzędzia × nastrój. Działa także,
  # gdy osada nie jest wczytana. Do tego resources.mine-ore-per-day na kopalnię i prawdziwe rudy z chodników.
  ore-per-miner: 6
  stone-per-miner: 10
  precious-per-miner: 0.4
  # +30% urobku za każdy poziom kopalni powyżej 1.
  level-bonus: 0.3
  # Miejsca dla górników: poziom 1 = slots-base, każdy kolejny poziom + slots-per-level.
  slots-base: 2
  slots-per-level: 2
  # Narzędzia: kuźnia w kraju +25%, każda epoka powyżej pierwszej +15%.
  smithy-tool-bonus: 0.25
  era-tool-bonus: 0.15
  # Część dziennego urobku sprzedawana od razu do skarbca (reszta trafia do magazynu kraju).
  sell-share: 0.6
  # Cena kruszców (złoto, diamenty, szmaragdy), gdy brak jej w resources.prices.
  precious-price: 25
  # Górnicy sami drążą chodnik (bez płatnej rozbudowy): kroki na górnika na godzinę rzeczywistą w godzinach pracy.
  # Płatna rozbudowa (/ludnosc kopalnia rozbuduj) nadal drąży szybciej. Chodnik nigdy nie wychodzi poza ziemię kraju.
  auto-dig: true
  steps-per-miner-hour: 4
  # Najwyżej tyle kopalni drążących same trzyma wczytany chunk przodka (bilety chunków).
  max-auto-tickets: 8
  # Widoczni górnicy (manekiny) przy przodku, gdy gracz jest w pobliżu: połowa górników, najwyżej tylu.
  crew-max: 3
  # Gracz, który spadnie do szybu kopalni, nie dostaje obrażeń (lina asekuracyjna).
  fall-protection: true

repair:
  # Automatyczna naprawa budynków z szablonów: okresowe porównanie z szablonem (tylko załadowane chunki, budżet czasu).
  enabled: true
  # Budżet czasu sprawdzania na tick (ms) i jak często sprawdzać ten sam budynek (minuty).
  budget-ms: 1.0
  interval-minutes: 10
  # Zlecenie naprawy, gdy brakuje więcej niż ten ułamek bloków albo zniszczony jest kluczowy blok (łóżko, drzwi, dach nad łóżkiem).
  threshold: 0.02
  # Koszt = koszt budynku × (brakujące / wszystkie) × mnożnik.
  cost-multiplier: 0.5
  # Kraje graczy: true = naprawa zlecana automatycznie (jak w krajach NPC), false = powiadomienie + /ludnosc napraw.
  auto-for-players: false
  # Ruina: zniszczony ponad ten ułamek → rebuild (odbudowa od zera) albo remove (usunięcie z rejestru).
  ruin-threshold: 0.7
  ruin-mode: rebuild

planner:
  # Planowanie osady (LudnoscApi.developSettlement i /ludnosc buduj auto).
  search-radius: 64
  spacing: 2
  max-slope: 4
  # Mieszkania, gdy wolnych łóżek mniej niż ten ułamek ludności.
  housing-free-ratio: 0.2
  # Spichlerz, gdy zapas jedzenia przekracza ten ułamek pojemności.
  granary-full-ratio: 0.85
  roads: true
  # Od tego poziomu osady drogi są z bruku (wcześniej ścieżki).
  paved-road-level: 3
  # Gdy nie ma miejsca na budynek: kraje NPC same zajmują przyległe chunki (koszt i limit terenu jak w Kraje, przyczyna
  # NPC), wybierając płaski i suchy teren blisko centrum. true = także kraje graczy. Najwyżej auto-claim-max na próbę.
  auto-claim-for-players: false
  auto-claim-max: 3

# Poziomy osady liczone z ludności i skarbca (md). Kolejność od najniższego; indeks = tier budynków.
levels:
  - {name: 'Osada', population: 0, treasury: 0}
  - {name: 'Wieś', population: 8, treasury: 2000}
  - {name: 'Miasteczko', population: 20, treasury: 10000}
  - {name: 'Miasto', population: 40, treasury: 30000}
  - {name: 'Stolica', population: 70, treasury: 80000}
  - {name: 'Metropolia', population: 150, treasury: 300000}

# Balans budynków (nadpisuje wartości z szablonów): koszt (md), poziom (tier), limit na kraj, wymagania.
# bonus (za każdy ukończony budynek): food = jedzenie/dzień, tax = +udział podatku (0.05 = +5%),
# growth = szansa na dodatkowego osadnika na tick wzrostu, granary = pojemność spichlerza.
# Premie wojskowe (koszary, stajnia, wieża) wymagałyby API Armii — patrz README.
buildings:
  studnia: {cost: 800, tier: 0, max-per-country: 3}
  chata: {cost: 1500, tier: 0}
  dom: {cost: 4000, tier: 0}
  spichlerz: {cost: 3000, tier: 0}
