    none-here: '<prefix><red>Nie stoisz w żadnym zarejestrowanym budynku</red> <gray>(ani nie patrzysz na niego).</gray>'
    info-header: '<prefix><gold><name></gold> <dark_gray>id <id></dark_gray>'
    info-country: ' <gray>Kraj:</gray> <white><country></white> <gray>obrys <box></gray>'
    info-own: ' <gray>Postawiony przez graczy, zgłosił <white><author></white> (<date>).</gray>'
    info-working: ' <green>✔ Działa jako <function></green> <gray>— <effect>.</gray>'
    info-broken: ' <red>✘ Nieczynny (<function>): brakuje <missing>.</red> <gray>Postawcie brakujące bloki w obrysie — funkcja wróci sama.</gray>'
