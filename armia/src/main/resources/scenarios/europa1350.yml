# ============================================================
#  Scenariusz „Europa 1350” — państwa NPC rozstawione jak na mapie Europy
#  © 2026 Maciej Kaczmarczyk — lektoro.pl
#
#  /nk scenariusz pokaz europa1350        — lista państw i planowanych miejsc
#  /nk scenariusz zaladuj europa1350 potwierdz — tworzy państwa (istniejące nazwy są pomijane)
#
#  Wszystko edytuje się tutaj: nazwy, kolory, władców, pozycje, osobowości i liczby. Północ = −Z, wschód = +X,
#  spawn ok. 0,0, świat pregenerowany w promieniu 4000. Nazwy państw jak w Kraje: litery, cyfry, _ i -, bez spacji,
#  3–24 znaki. Kolory muszą być różne. skin: nick Mojang albo puste (domyślny wygląd władcy).
#  Stolica: najbliższa wioska w promieniu „promien-wioski” od x/z (przy dzwonie), inaczej x/z na suchym i płaskim
#  terenie; zawsze z dala od obszarów chronionych Kraje (spawn) i od innych państw.
#  honor (0–100, opcjonalny): dotrzymywanie słowa i pogarda dla podłych interesów w rozmowach (plugin Wladcy);
#  pominięty = liczony z osobowości (wysoka dyplomacja i niska agresja → wyższy honor).
# ============================================================
id: europa1350
wersja: 2                        # wersja pliku (Armia nadpisuje starszą wersją z jara, zostawiając kopię .yml.old)
nazwa: "Europa 1350"
opis: "Dwanaście królestw, cesarstw i księstw średniowiecznej Europy"
swiat: ""                        # pusty = pierwszy świat serwera
promien-wioski: 400              # szukanie wioski wokół x/z (bloki)
odleglosc-od-spawnu: 300         # odstęp od obszarów chronionych Kraje (np. spawn) albo od spawnu świata
odleglosc-miedzy-panstwami: 500  # minimalny odstęp stolic (także od już istniejących krajów)

