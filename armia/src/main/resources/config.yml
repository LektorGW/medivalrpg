# Epoki (Postep): bonus do HP i obrażeń za każdą epokę powyżej pierwszej (plus efekt „sila-armii” z odkryć),
# przezbrojenie kosztuje rearm-cost-share kosztu nowej jednostki; AI przezbraja do ai-rearm-per-tick żołnierzy na tick.
eras:
  hp-bonus-per-era: 0.1
  damage-bonus-per-era: 0.1
  rearm-cost-share: 0.5
  ai-rearm-per-tick: 3

ai:
  enabled: true
  tick-minutes: 5
  create-force: false      # /nk stworz pomija odstępy od innych krajów
  require-citizen: false   # kraje NPC rekrutują bez poboru obywateli
  border-guard-fraction: 0.6
  border-guard-radius: 7
  war-cooldown-minutes: 180
  # AI wypowiada wojny przez KrajeApi.declareWar: koszt (war.declare-cost w Kraje), cooldown i reguły wasalstwa jak u graczy.
  # Ta wartość (≥ 0) zmienia już tylko koszt pokazywany w panelu; -1 = jak w Kraje.
  war-declare-cost: -1
  proposal-cooldown-minutes: 60
  # Ważność propozycji sojuszu/pokoju (jak proposal-expiry-seconds w Kraje) — do pokazania „oczekujących” w panelu.
  proposal-expiry-minutes: 5
  # AI v2: nastawienie (panel), postawa, podział budżetu, obrona i odbudowa, kapitulacje, trybuty.
  v2:
    friendly-opinion: 30          # nastawienie „przyjazne” = +30 do opinii (rzadsze wojny, łatwiejszy sojusz)
    hostile-opinion: 30           # „wrogie” / „cel ataku” = −30
    preferred-weight: 3.0         # „cel ataku”: waga celu wojny/oblężeń ×3
    preferred-advantage: 0.8      # „cel ataku”: wymagana przewaga ×0.8
    offensive-war-chance: 1.5     # postawa ofensywna: szansa wojny ×1.5
    offensive-advantage: 0.9
    offensive-siege-cooldown: 0.5 # ofensywna: oblężenia 2× częściej
    defensive-siege-cooldown: 1.5 # obronna: rzadziej i tylko po utracone ziemie
    defensive-guard-bonus: 0.25   # obronna: +25% żołnierzy na granicy
    offensive-guard-cut: 0.2
    reclaim-weight: 0.5           # waga wojny +50% za każdy utracony chunk (max 3)
    reclaim-cooldown-minutes: 360 # po pokoju utracone ziemie są powodem nowej wojny dopiero po tym czasie
    revenge-war-declared: 40      # opinia o agresorze spada o tyle
    revenge-chunk-lost: 15        # … i o tyle za każdy zdobyty chunk
    revenge-siege: 10
    negative-decay-ticks: 4       # ujemna opinia wraca o 1 pkt co 4 ticki AI (dodatnia co tick)
    crisis-hours: 2.0             # utrata chunka (albo oblężenie) w ostatnich 2 h wojny = tryb kryzysowy
    crisis-army-share: 0.85       # w kryzysie tyle udziału budów idzie na wojsko
    crisis-recruit-multiplier: 2.0
    crisis-soldiers-multiplier: 1.3
    war-army-share: 0.6           # w zwykłej wojnie
    rebuild-hours: 6.0            # po pokoju: odbudowa (domy, spichlerz, więcej na budowy)
    rebuild-buildings-share: 0.5
    help-cooldown-minutes: 60     # prośba o pomoc do sojuszników
    ally-join-threshold: 0.6      # wynik, od którego sojusznik NPC dołącza do wojny
    capitulate-ratio: 0.6         # przegrywający (siła < 0.6 wroga) …
    capitulate-lost-chunks: 2     # … który stracił tyle chunków …
    capitulate-treasury-drop: 0.4 # … albo 40% skarbca, sam proponuje kapitulację
    capitulate-cooldown-minutes: 60
    capitulation-threshold: 0.5   # wynik potrzebny do przyjęcia czyjejś kapitulacji
    greedy-tribute-per-strength: 15 # chciwy władca (dyplomacja < 40, agresja > 60) chce trybutu ≥ 15 md × siła przegranego
    release-opinion: 85           # suweren zwalnia wasala przy takiej opinii (±10 zależnie od agresji)
    buyout-reserve-factor: 1.5    # wasal wykupuje się, gdy po wykupie zostaje 1.5 × rezerwa
    tribute-days: 7               # żądany trybut płaci się codziennie przez tyle dni
    tribute-expiry-minutes: 30    # czas gracza na odpowiedź na żądanie
    tribute-max: 100000           # największy dzienny trybut (md)
    tribute-accept-ratio: 1.5     # kraj NPC ulega żądaniu przy przewadze żądającego ×1.5 (przy agresji 50)
    tribute-refused-opinion: 15
    ledger-keep-hours: 48         # historia przepływów pieniędzy (rozbicie 24 h w panelu)
  war-on-npc: true
  claim-cost-estimate: 100
  unit-mix:
    piechota: 5
    lucznik: 3
    rycerz: 1
    kusznik: 1
    pikinier: 5
    muszkieter: 3
    arkebuzer: 3
    katapulta: 1
    taran: 1
    armata: 1
    piechota-liniowa: 6
    kawaleria: 2
    artyleria: 1
    zolnierz: 6
    snajper: 1
    pojazd-opancerzony: 1
    medyk: 1
  defaults:
    agresja: 50
    ekspansja: 50
    dyplomacja: 50
    bogactwo: 50
    max-chunki: 40
    max-zolnierze: 20
  buildings:
    enabled: true
    # Z nową Ludnosc budowę planuje jej planer osady; poniższe listy są tylko dla starszej Ludnosc.
    housing: [dom, chata]
    utilities: [spichlerz, koszary, studnia, kuznia, wieza]
    max-housing: 12
  sieges:
    enabled: true
    player-radius: 96      # oblężenie tylko gdy w pobliżu chunka są gracze
    soldiers: 8
    cooldown-minutes: 30
    # Machiny (katapulta/armata) wysłane do oblężenia NPC same ostrzeliwują oblegany chunk (te same reguły co /armia ostrzal:
    # aktywne oblężenie, KrajeApi.canSiegeBreak, amunicja ze skarbca). Najwyżej tyle salw na przebieg (co 5 s).
    artillery: true
    artillery-shots-per-run: 4
    # Tarany wysłane do oblężenia NPC same wybierają bramę (drzwi, furtę) albo najbliższy mur obleganego chunka
    # od strony taranu i uderzają w niego (te same reguły co /armia taranuj).
    rams: true
  # Zamknięta pula pieniędzy (Skarbiec 2026-10-28): AI nie tworzy pieniędzy. „Dochód kraju NPC” to przelew z budżetu
  # operacyjnego świata (world:payments — tam trafiają żołd, opłaty i koszty), ograniczony udziałem i progiem.
  economy:
    closed-pool: auto              # auto | true | false
    payments-floor: 100000         # tyle md budżetu operacyjnego zawsze zostaje dla innych systemów (1000 zł)
    payments-share-per-tick: 0.002 # najwyżej 0,2% nadwyżki ponad próg na kraj i tick AI
    sustain-days: 14               # armia ma być opłacalna z dochodu + oszczędności przez tyle dni
  # Desanty AI (wave 13/16): kraj NPC w wojnie z wrogiem bez wspólnej granicy lądowej buduje transportowiec/karawelę,
  # zaokrętowuje oddział, płynie (tylko w załadowanych chunkach, przy graczach), wyładowuje go i zaczyna desant w Kraje.
  naval:
    enabled: true
    min-soldiers: 4
    max-soldiers: 12
    max-range: 256          # bloki od własnego wybrzeża do brzegu wroga
    cooldown-minutes: 90    # między operacjami jednego kraju
    timeout-minutes: 15     # operacja bez postępu jest przerywana (wojsko wraca na brzeg)
    min-aggression: 40      # poniżej tylko odbijanie utraconych ziem
    min-advantage: 0.9      # wymagany stosunek sił (my / oni), nie dotyczy odbijania
    max-operations: 3       # jednocześnie na całym serwerze
    require-players-near: true # cel desantu tylko przy graczach (jak oblężenia lądowe); false wyłącznie do testów
    # Wyprawy dalekie (2026-10-31): wróg poza zasięgiem fizycznego rejsu (np. 3500 bloków niewczytanego morza).
    # Rejs liczony w tle (żołnierze zostają w rejestrze: limit 1000 i żołd), stan przetrwa restart. U celu flota czeka,
    # aż przy wybrzeżu wroga będą gracze, wtedy statek pojawia się na wodzie, wojsko ląduje i zaczyna desant Kraje.
    long-range:
      enabled: true
      minutes-per-1000-blocks: 6   # czas rejsu ~ odległość (stolica → cel)
      min-minutes: 3
      max-minutes: 30
      wait-minutes: 240            # tyle flota czeka u brzegu na okazję do lądowania, potem wraca
      max-soldiers: 16             # na wyprawę (i nie więcej niż mieści statek)
      home-guard-share: 0.35       # tyle armii zawsze zostaje w domu
      vs-npc: false                # AI sama płynie tylko na kraje graczy (z NPC walczy w tle); admin: /nk desant
      approach-warning-minutes: 3  # drugie ostrzeżenie obrońców przed przybyciem
  # Wojny w tle (2026-10-29): państwa NPC podbijają się nawzajem także daleko od graczy. Ofensywa to abstrakcyjne
  # oblężenie jednego chunka liczone w rundach (siła i typy jednostek, epoka, morale, żołd, umocnienia Ludnosci, odległość
  # od stolicy, zmęczenie wojną, sojusznicy, statki). Straty żołnierzy są prawdziwe (rejestr i limit 1000). Gdy przy celu
  # pojawi się gracz, ofensywa staje i działa zwykła walka fizyczna. Zdobycie stosuje Kraje (te same zasady co oblężenie).
  conquest:
    enabled: true
    abstract-vs-players: false   # ziemi krajów graczy NIE zdobywa się w tle (tylko fizycznie, przy graczach)
    interval-minutes: 5          # jedna runda bitwy / cykl symulacji
    budget-ms: 4                 # czas głównego wątku na krok; reszta w następnej sekundzie
    player-radius: 160           # gracz bliżej celu (bloki) = walka fizyczna zamiast tła
    min-war-minutes: 30          # pierwsza ofensywa po tylu minutach wojny
    offensive-cooldown-minutes: 45
    target-retry-minutes: 120    # nieudany cel nie jest atakowany ponownie przez tyle minut
    max-chunks-per-day: 3        # zdobycze jednego kraju na dobę
    max-loss-per-day: 3          # straty jednego kraju na dobę (ochrona słabszych)
    global-max-chunks-per-day: 20
    min-soldiers: 4
    min-odds: 1.2                # ofensywa tylko przy szacowanej przewadze (ten sam wzór co bitwa, bez losowości)
    max-force: 12
    home-guard-share: 0.35       # tyle armii zawsze zostaje w domu
    max-rounds: 18
    progress-per-round: 0.35
    luck: 0.15
    casualty-rate: 0.10
    supply-cost-per-soldier: 3   # md za żołnierza i rundę (skarbiec → budżet operacyjny świata)
    war-range-chunks: 80         # kraje NPC w tym zasięgu są możliwym celem wojny (nie tylko sąsiedzi)
    distance-penalty: 0.35       # utrata siły przy maksymalnej odległości od stolicy
    ally-share: 0.25             # sojusznicy NPC w wojnie z tym samym wrogiem dokładają tyle swojej siły (bez strat)
    expeditions:
      enabled: true              # cel bez wspólnej granicy: wyprawa zakłada przyczółek (limit przyczółków z Kraje)
      max-distance-chunks: 96
      strength: 0.8
      naval-bonus: 0.1           # własny statek poprawia siłę wyprawy (wsparcie desantu)
    defence:
      capital-bonus: 0.5         # premia obrońcy przy stolicy, maleje do 0 na capital-bonus-range chunków
      capital-bonus-range: 8
      fort-wall: 0.12            # mury i bramy Ludnosci w promieniu fort-radius-chunks
      fort-tower: 0.10
      fort-castle: 0.30
      fort-max: 1.0
      fort-radius-chunks: 2
      engine-vs-fort: 0.15       # każda katapulta/armata atakującego zbija tyle premii z umocnień
      militia: 1.0               # uzbrojeni mieszkańcy bronią się nawet bez żołnierzy
      garrison-radius-chunks: 6
      reinforcement-share: 0.5
    exhaustion:
      per-hour-at-war: 0.6
      per-soldier-lost: 1.5
      per-chunk-lost: 4
      per-failed-offensive: 5
      decay-per-hour-peace: 2
      block-offensive: 70        # od tej wartości brak nowych ofensyw
      propose-peace: 60          # kraj sam proponuje pokój
      accept-peace: 75           # kraj przyjmuje każdy pokój
      strength-penalty: 0.4
    overextension:
      free-chunks: 100           # powyżej rośnie dzienny koszt zarządu i słabnie armia
      cost-per-chunk: 4
      strength-floor: 0.6
    revolt:
      window-hours: 72           # zdobyte ziemie mogą się zbuntować przez tyle godzin
      chance-per-day: 0.04
      max-per-day: 1
    vassals:
      secession-chance-per-day: 0.15
      secession-overlord-exhaustion: 60
    coalition:
      share: 0.30                # kraj NPC z takim udziałem ziem NPC (albo ratio × drugi) jest hegemonem
      ratio: 1.8
      opinion-per-day: 8
      opinion-floor: -60
      join-chance-per-day: 0.25
    peace:
      tribute-share: 0.15        # pokój po zdobyczach: przegrany płaci trybut (udział dochodu + za chunk)
      tribute-per-chunk: 20
      tribute-max: 2000
    announce-minutes: 15         # zbiorcze ogłoszenia na czacie (bez spamu)
    log-rounds: true
  rail:
    base-fee: 500           # opłata za zgodę na tory przy neutralnej opinii (md); mnożona przez nieufność i bogactwo
  log:
    size: 200
    file: true             # plugins/Armia/logs/ai-decisions.log
  tuning:
    base-income-per-day: 300
    income-per-chunk-per-day: 25
    expansion-chance: 0.6
    reserve-days-of-wages: 2.0
    min-reserve: 200
    soldiers-per-chunk: 0.5
    max-recruit-per-tick: 3
    min-aggression-for-war: 55
    war-advantage: 1.6
    war-advantage-aggression: 0.8
    war-chance: 0.35
    max-concurrent-wars: 1
    war-opinion-block: 40
    min-war-hours: 2.0
    fatigue-hours: 6.0
    loss-tolerance: 4
    losing-ratio: 0.8
    peace-threshold: 0.5
    alliance-threshold: 0.55
    min-diplomacy-for-alliance: 30
    alliance-propose-diplomacy: 65
    alliance-propose-chance: 0.25
    player-weight: 1.5
    offline-player-weight: 0.3
    # Rozbudowa osady (LudnoscApi.developSettlement): budżet = udział skarbca ponad rezerwę.
    build-base-share: 0.15        # udział przy bogactwie i ekspansji 0
    build-wealth-share: 0.25      # + przy bogactwie 100
    build-expansion-share: 0.15   # + przy ekspansji 100
    build-war-cut: 0.6            # w wojnie tyle udziału (i oszczędności) idzie na armię
    build-max-share: 0.6
    build-min-budget: 100         # mniejszy budżet = nie zamawiaj
    # Bogate państwo odkłada na budynki reprezentacyjne: gdy planer odpowie „brak środków”, rekrutacja
    # nie rusza build-savings-share skarbca, dopóki budowa się nie uda.
    rich-wealth: 70
    rich-treasury: 5000
    build-savings-share: 0.5


# ============================================================
#  Najemnicy — wojsko do wynajęcia od ręki (bez poboru obywateli i bez koszar), droższe, na kontrakt
# ============================================================
mercenaries:
  enabled: true
  cost-multiplier: 2.5        # koszt wynajęcia = koszt jednostki bazowej × 2,5
  wage-multiplier: 2.0        # żołd = żołd jednostki bazowej × 2
  contract-hours: 72          # długość kontraktu (realne godziny); potem odchodzą, chyba że przedłużysz
  extend-cost-share: 0.5      # przedłużenie kontraktu = 50% kosztu wynajęcia
  max-share: 0.3              # najwyżej 30% limitu wojska kraju to najemnicy (i tak wliczają się w limit)
  # Bez żołdu najemnicy odchodzą od razu. defect-to-enemy: true = gdy skarbiec jest prawie pusty, przechodzą
  # do najbogatszego wroga (wojna), który ma wolne miejsce.
  defect-to-enemy: false
  defect-treasury-below: 100
  ai:
    enabled: true             # AI w trybie kryzysowym najmuje, gdy ma mało ludności i dużo pieniędzy
    max-population: 10
    min-treasury: 5000
    per-tick: 2
  types:
    najemnik-piechur:
      base: piechota
      name: "<dark_gray>Najemnik piechur"
      description: "<gray>Topór i kolczuga, bez barw"
      company: "Czarna Kompania"
      skin: losowy
      equipment: {head: CHAINMAIL_HELMET, chest: CHAINMAIL_CHESTPLATE, legs: CHAINMAIL_LEGGINGS, feet: CHAINMAIL_BOOTS, hand: IRON_AXE}
    kusznik-genuenski:
      base: kusznik
      name: "<gray>Kusznik genueński"
      description: "<gray>Kusza i stalowy hełm"
      company: "Kompania Genueńska"
      skin: losowy
      equipment: {head: IRON_HELMET, chest: CHAINMAIL_CHESTPLATE, legs: CHAINMAIL_LEGGINGS, feet: CHAINMAIL_BOOTS, hand: CROSSBOW}
    rycerz-najemnik:
      base: rycerz
      name: "<dark_gray>Rycerz-najemnik"
      description: "<gray>Czarny hełm, żelazna zbroja, koń"
      company: "Wolni Kopijnicy"
      skin: losowy
      equipment: {head: NETHERITE_HELMET, chest: IRON_CHESTPLATE, legs: IRON_LEGGINGS, feet: IRON_BOOTS, hand: IRON_SWORD}
diplomacy:
  rank: RULER              # kto może prowadzić dyplomację w GUI władcy NPC
  tribute-amounts: [100, 1000, 5000, 20000]
  copper-per-opinion: 50   # 1 punkt opinii za tyle miedziaków trybutu

ruler:
  default-skin: ""
  # Władcy NPC nie otrzymują żadnych obrażeń (także od graczy w trybie kreatywnym). true = gracz z armia.admin
  # może zranić władcę, kucając. Zniknięty władca wraca na swoje miejsce (co 30 s, po załadowaniu chunka, w ticku AI).
  admin-kill: false
  names: [Bolesław, Mieszko, Kazimierz, Władysław, Przemysł, Leszek, Jadwiga, Dobrawa]

# Scenariusze (/nk scenariusz): gdy cel wypada na wodzie, ląd jest szukany po spirali coraz dalej (krok search-step bl.,
# do max-search-radius bl.), z preferencją miejsc bliżej celu i bliżej środka mapy; chunki wczytywane asynchronicznie,
# step-timeout-seconds na jeden krok.
scenario:
  max-search-radius: 800
  search-step: 48
  step-timeout-seconds: 15

# ============================================================
#  Wioski → państwa NPC (/nk wioska, panel admin.npc.fromVillage, automat)
# ============================================================
villages:
  find-radius: 96              # szukanie wioski wokół gracza / punktu (Ludnosc findVillage)
  auto:
    enabled: true
    chance: 0.33               # każda wioska losowana raz
    min-spawn-distance: 600    # od obszarów chronionych Kraje (spawn) albo spawnu świata
    min-country-distance: 400  # od każdego zajętego chunka każdego kraju (także graczy)
    max-countries: 18          # wszystkie kraje NPC razem (scenariusz ma 12) — przy tylu automat nic nie robi
    max-auto-countries: 6      # osobny limit państw powstałych z wiosek
    scan-radius: 4000          # jednorazowy skan pregenerowanego świata (stan w plugins/Armia/villages.json)
    scan-step: 800             # siatka skanu
    interval-seconds: 5        # jeden krok automatu (punkt skanu albo nowa wioska) co tyle sekund
  # Nazwy (spacje → _, bo Kraje nie przyjmuje spacji; w ogłoszeniu wracają spacje) i władcy.
  names: [Księstwo_Wiślan, Ziemia_Sądecka, Hrabstwo_Pomorskie, Księstwo_Mazowieckie, Ziemia_Łęczycka, Księstwo_Opolskie,
          Ziemia_Dobrzyńska, Hrabstwo_Kłodzkie, Księstwo_Raciborskie, Ziemia_Sieradzka, Kasztelania_Wiska, Księstwo_Oświęcimskie,
          Ziemia_Chełmińska, Księstwo_Głogowskie, Ziemia_Przemyska, Margrabstwo_Łużyckie, Księstwo_Cieszyńskie, Ziemia_Lubelska]
  rulers: [Bolesław, Mieszko, Kazimierz, Władysław, Przemysł, Leszek, Siemowit, Henryk, Konrad, Ziemowit, Bolko, Wacław,
           Jadwiga, Dobrawa, Rycheza, Salomea]

