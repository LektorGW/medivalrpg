# Armia — żołnierze NPC i AI państw NPC (MEDIVALRPG)
# © 2026 Maciej Kaczmarczyk — lektoro.pl
# Kwoty zawsze w miedziakach (1 sr = 10 md, 1 zł = 100 md). Teksty: MiniMessage.

# Wygląd żołnierzy:
#  mannequin — widoczne ciało to Mannequin (skin gracza), a AI i punkty życia ma NIEWIDZIALNY i ukryty przed
#              klientami mob-"mózg" (brain-entity). Ciało jest co tick ustawiane na pozycji mózgu. (domyślne)
#  mob       — widoczny humanoidalny mob (units.*.mob-type) z ekwipunkiem i (opcjonalnie) głową ze skinem.
visual: mannequin
# Mob niosący AI w trybie mannequin. Dozwolone: WANDERING_TRADER (domyślny: nie jest potworem, więc golemy go
# nie atakują), ZOMBIE, HUSK, SKELETON, STRAY, VINDICATOR, PILLAGER, EVOKER, ILLUSIONER, WITCH, ZOMBIE_VILLAGER.
brain-entity: WANDERING_TRADER
# Drużyna na głównej tablicy wyników z collisionRule=never (żołnierze nie popychają graczy — spójnie z klientem).
no-collision: true
# Nazwa nad głową widoczna zawsze (false = tylko po najechaniu).
show-names: false
# visual: mob — zakładaj głowę gracza ze skinem jednostki zamiast hełmu.
mob-skin-head: true

limits:
  global-max: 1000         # wszystkich żołnierzy na serwerze
  country-base: 5          # na kraj: bazowo...
  country-per-chunk: 0.5   # ...plus tyle na zajęty chunk
  country-max: 60          # twardy limit na kraj

cpu:
  think-budget-ms: 2.0     # czas na tick na wybór celów (round-robin)
  think-interval-ticks: 10 # co ile ticków żołnierz szuka celu
  max-spawns-per-tick: 4
  repair-seconds: 30       # co ile sprawdzać zaginionych żołnierzy

command-rank: ADVISOR      # kto dowodzi (CITIZEN, ADVISOR, RULER)
recruit:
  rank: ADVISOR
  require-citizen: true    # gdy jest Ludnosc: rekrut = obywatel (LudnoscApi.conscript)
  max-per-command: 10
  citizen-max-distance: 48 # dalszy obywatel → żołnierz pojawia się przy rekrutującym
  barracks:
    required: false
    # Z Ludnosc: kraj musi mieć gotowy budynek tego typu (LudnoscApi.hasBuilding).
    building: koszary
    # Bez Ludnosc (albo ze starszą wersją): blok w promieniu od rekrutującego zastępuje koszary.
    block: SMITHING_TABLE
    radius: 12

# Koszary (budynki Ludnosc z funkcją „koszary”: koszary, koszary2 i zgłoszone przez graczy wlasny_koszary).
# Bez Ludnosc (albo ze starszą wersją) koszary nic nie dają, reszta działa jak dotąd.
barracks:
  limit-per-bed: 1             # każda prycza w czynnych koszarach = +tyle do limitu wojska kraju (0 = wyłączone)
  limit-bonus-max: 60          # najwyżej tyle limitu z prycz na kraj (ponad limits.country-*; zawsze ≤ limits.global-max)
  max-beds-per-building: 12    # tyle prycz liczy się z jednego budynku (koszary2 mają 12; hala pełna łóżek nie da więcej)
  max-damage-percent: 50       # koszary uszkodzone bardziej niż tyle % są nieczynne (100 = uszkodzenia bez znaczenia)
  recruit-spawn: true          # rekruci stawiają się w najbliższych czynnych koszarach
  recruit-follow-distance: 40  # koszary bliżej niż tyle bloków: rekruci idą do rekrutującego; dalej: zostają jako
                               # załoga koszar (zbiera ich /armia zamna na miejscu); -1 = zawsze idą do rekrutującego
  heal-radius: 24              # żołnierze kraju w tym promieniu od czynnych koszar leczą się szybciej (0 = wyłączone)
  heal-per-minute: 4.0         # dodatkowe HP na minutę (ponad combat.regen-per-minute), tylko poza walką
  heal-interval-seconds: 10
  heal-particles: true         # serduszko nad leczonym żołnierzem

upkeep:
  trigger: interval        # interval | treasury-tick (po dziennym ticku skarbca Kraje)
  interval-minutes: 1440
  max-catch-up: 3
  morale-gain-paid: 10
  morale-loss-unpaid: 34   # 3 dni bez żołdu → dezercja
  desert-below: 1
  deserter-to-population: true   # dezerter zostaje wieśniakiem na terenie kraju (Ludnosc go przyjmie)

combat:
  detect-radius: 14
  leash-extra: 12          # jak daleko poza posterunek wolno gonić
  attack-countryless-players: false
  monsters-on-own-land: true
  monsters-anywhere: false
  only-enemies-can-hurt: true    # gracze/żołnierze krajów nie w wojnie nie zranią żołnierzy
  countryless-can-hurt: false
  follow-distance: 3.0
  follow-teleport-distance: 40   # dociąganie oddziału teleportem
  chase-speed: 1.25
  regen-per-minute: 1.0
  guard-radius: 8
  guard-radius-max: 32
  squad-gather-radius: 32
  patrol-max-points: 10

