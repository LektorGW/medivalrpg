  help-armia:
    title: "Armia"
    categories:
      wojsko: "Wojsko"
      dowodzenie: "Dowodzenie"
      informacje: "Informacje"
      admin: "Admin"
    entries:
      rekrutuj:
        short: "zrekrutuj żołnierzy"
        description: "<gray>Rekrutuje żołnierzy za pieniądze ze skarbca kraju. Każdy rekrut to obywatel (Ludnosc). Trzeba stać na terenie kraju (i mieć koszary, jeśli serwer tego wymaga). Rekruci stawiają się w najbliższych koszarach; każda prycza w koszarach to +1 do limitu wojska, a żołnierze przy koszarach szybciej się leczą."
        rank: "<white>Doradca+"
      rozpusc:
        short: "rozpuść oddział"
        description: "<gray>Żołnierze twojego oddziału wracają do ludności (stają się wieśniakami)."
        rank: "<white>Doradca+"
      bulawa:
        short: "buława dowódcy"
        description: "<gray>PPM na blok — idźcie tam, PPM na cel — atak, Shift+PPM — za mną / stój."
        rank: "<white>Doradca+"
      przezbroj:
        short: "przezbrój na broń epoki"
        description: "<gray>Stare jednostki dostają odpowiednik twojej epoki (Postep), np. piechota → pikinier → piechota liniowa → żołnierz. Płatne ze skarbca."
        rank: "<white>Doradca+"
      najmij:
        short: "wynajmij najemników"
        description: "<gray>Najemnicy od ręki: bez obywateli i koszar, ale ×2,5 drożej i ×2 żołd. Kontrakt na kilka dni; bez żołdu odchodzą od razu."
        rank: "<white>Doradca+"
      najemnicy:
        short: "lista kontraktów"
        description: "<gray>Twoi najemnicy, czas do końca kontraktu i koszt przedłużenia."
        rank: "<white>Obywatel"
      przedluz:
        short: "przedłuż kontrakty"
        description: "<gray>Przedłuża kontrakt jednego najemnika (id z listy) albo wszystkich."
        rank: "<white>Doradca+"
      zwolnij-najemnikow:
        short: "zwolnij najemników"
        description: "<gray>Wszyscy najemnicy odchodzą (bez zwrotu pieniędzy)."
        rank: "<white>Doradca+"
      zamna:
        short: "oddział za mną"
        description: "<gray>Twoi żołnierze w pobliżu dołączają do oddziału i idą za tobą."
        rank: "<white>Doradca+"
      stoj:
        short: "oddział stoi"
        description: "<gray>Oddział zatrzymuje się i pilnuje miejsca."
        rank: "<white>Doradca+"
      wroc:
        short: "wracajcie na posterunki"
        description: "<gray>Oddział wraca na swoje posterunki lub trasy patrolu."
        rank: "<white>Doradca+"
      straz:
        short: "pilnujcie tego miejsca"
        description: "<gray>Oddział zostaje strażą w tym miejscu w podanym promieniu."
        rank: "<white>Doradca+"
      patrol:
        short: "trasa patrolu"
        description: "<gray><white>dodaj</white> — punkt w miejscu, gdzie stoisz; <white>start</white> — oddział patroluje trasę; <white>wyczysc</white> — nowa trasa."
        rank: "<white>Doradca+"
      atakuj:
        short: "atakujcie cel"
        description: "<gray>Oddział atakuje to, na co patrzysz (tylko wrogów w wojnie i potwory)."
        rank: "<white>Doradca+"
      ostrzal:
        short: "salwa machin w blok"
        description: "<gray>Zbierz machiny przez /armia zamna i spójrz na blok. Jedna salwa w aktywnie obleganym chunku wroga w wojnie. Katapulta: 40 bl., 8 s, 5 md; armata: 24 bl., 5 s, 10 md. Koszt ze skarbca."
        rank: "<white>Doradca+"
      taranuj:
        short: "taran na bramę lub mur"
        description: "<gray>Zbierz tarany przez /armia zamna i spójrz na bramę lub dół muru w aktywnie obleganym chunku wroga w wojnie. Taran podjeżdża i uderza co 3 s, aż przebije przejście (do 3 bloków w głąb). Drewno 2 uderzenia, kamień 4, umocnienia 10. Kontenery i ziemie chronione nietknięte. Odporny na strzały, wrażliwy na ogień. Stój/wróć przerywa."
        rank: "<white>Doradca+"
      amunicja:
        short: "wybierz pociski machin"
        description: "<gray>Ustawia i zapisuje amunicję machin oddziału. Katapulta: kamien (5 md). Armata: kula (10 md) lub kartacz (15 md, 5 małych kul, max 5 różnych wrogów w wojnie, zasięg 16 bl., nie niszczy bloków). Kartaczem atakuj przez /armia atakuj."
        rank: "<white>Doradca+"
      flota:
        short: "statki, transport i desanty"
        description: "<gray>/armia flota zbuduj transportowiec|karawela — spójrz na otwartą wodę. Transportowiec: epoka 1, 3000 md, 4 graczy razem z kapitanem +16 NPC. Karawela: epoka 2, 6000 md, 6 graczy +32 NPC. wejdz|zejdz, zaladuj (oddział przez /armia zamna), desant (spójrz na brzeg), salwa (karawela, proch, statek wroga w wojnie, 30 md/10 s), lista, usun potwierdz (pusty statek, Władca)."
        rank: "<white>Pasażer: Obywatel+, kapitan/dowodzenie: Doradca+, usuwanie: Władca"
      trybut:
        short: "odpowiedz na żądanie trybutu"
        description: "<gray>Kraj NPC zażądał od was dziennego trybutu: przyjmij (płacicie codziennie ze skarbca przez kilka dni) albo odrzuć (władca to zapamięta). Klikalne też w wiadomości na czacie."
        rank: "<white>Władca"
      info:
        short: "armia kraju"
        description: "<gray>Liczba żołnierzy, limity, żołd i morale."
        rank: "<white>każdy"
      lista:
        short: "lista żołnierzy"
        description: "<gray>Wszyscy żołnierze twojego kraju z trybem, pozycją, życiem i morale."
        rank: "<white>Obywatel+"
      pomoc:
        short: "ta pomoc"
        description: "<gray>Strona lub nazwa działu."
        rank: "<white>każdy"
      przeladuj:
        short: "przeładuj config"
        description: "<gray>Wczytuje config.yml ponownie."
        rank: "<red>admin"
      npckraj:
        short: "kraje NPC"
        description: "<gray>Komendy administratora krajów NPC."
        rank: "<red>admin"

  help-nk:
    title: "Kraje NPC"
    categories:
      kraje: "Kraje"
      ai: "AI"
      dyplomacja: "Dyplomacja"
      zasoby: "Zasoby"
    entries:
      stworz:
        short: "nowy kraj NPC tutaj"
        description: "<gray>Tworzy kraj NPC ze stolicą w twoim chunku i stawia władcę w twoim miejscu. Nazwy z polskimi literami w cudzysłowie."
        rank: "<red>admin"
      usun:
        short: "usuń kraj"
        description: "<gray>Usuwa kraj NPC z żołnierzami i władcą."
        rank: "<red>admin"
      wladca:
        short: "postaw władcę tutaj"
        description: "<gray>Stawia (lub przenosi) władcę NPC z imieniem i skinem (nick Mojang)."
        rank: "<red>admin"
      info:
        short: "stan kraju NPC"
        description: "<gray>Parametry, skarbiec, wojsko, relacje i ostatnie decyzje."
        rank: "<red>admin"
      lista:
        short: "wszystkie kraje NPC"
        description: "<gray>Lista krajów NPC ze stanem AI."
        rank: "<red>admin"
      wioska:
        short: "wioska → państwo NPC"
        description: "<gray>Stojąc w wiosce: podgląd (chunki, łóżka, wieśniacy), potem potwierdz — państwo ze stolicą przy dzwonie, zajętą wioską i przejętymi wieśniakami. Bez nazwy/koloru/władcy losuje polskie."
        rank: "<red>admin"
      tp:
        short: "teleport do stolicy"
        description: "<gray>Przenosi cię do stolicy państwa NPC, obok władcy, na bezpieczny blok."
        rank: "<red>admin"
      scenariusz:
        short: "scenariusze startowe"
        description: "<gray>lista — pliki z plugins/Armia/scenarios; pokaz ID — państwa i miejsca; zaladuj ID potwierdz — tworzy brakujące państwa (stolice przy wioskach, skarbiec, wojsko, osadnicy, relacje)."
        rank: "<red>admin"
      ustaw:
        short: "zmień parametr AI"
        description: "<gray>agresja, ekspansja, dyplomacja, bogactwo (0–100), max-chunki, max-zolnierze, aktywna (tak/nie)."
        rank: "<red>admin"
      pauza:
        short: "wstrzymaj AI"
        description: "<gray>Wstrzymuje AI kraju albo wszystkich."
        rank: "<red>admin"
      wznow:
        short: "wznów AI"
        description: "<gray>Wznawia AI kraju albo wszystkich."
        rank: "<red>admin"
      tick:
        short: "wymuś decyzje"
        description: "<gray>Natychmiastowy tick AI z wypisaniem decyzji."
        rank: "<red>admin"
      log:
        short: "log decyzji"
        description: "<gray>Ostatnie decyzje AI (też w logs/ai-decisions.log)."
        rank: "<red>admin"
      desant:
        short: "wyprawa morska (desant)"
        description: "<gray>Kraj NPC w wojnie płynie na wroga (także tysiące bloków przez morze): rejs liczony w tle, lądowanie przy graczach na brzegu wroga, potem oblężenie desantowe Kraje. Bez celu — cel oblężeń z panelu albo pierwszy wróg. status — postęp; anuluj — flota zawraca; teraz — pomija resztę rejsu."
        rank: "<red>admin"
      wojny:
        short: "wojny NPC i ofensywy w tle"
        description: "<gray>Wojny z udziałem państw NPC: zdobycze, ofensywy w tle z postępem i siłami, zmęczenie wojną, hegemon, ostatnie wydarzenia. Z nazwą kraju — tylko jego wojny."
        rank: "<red>admin"
      wojna:
        short: "ustaw wojnę"
        description: "<gray>Natychmiastowa wojna między krajami."
        rank: "<red>admin"
      pokoj:
        short: "ustaw pokój"
        description: "<gray>Natychmiastowy pokój (relacja neutralna)."
        rank: "<red>admin"
      sojusz:
        short: "ustaw sojusz"
        description: "<gray>Natychmiastowy sojusz."
        rank: "<red>admin"
      skarbiec:
        short: "pieniądze kraju"
        description: "<gray>Dodaje lub zabiera pieniądze ze skarbca (np. 10zł)."
        rank: "<red>admin"
      armia:
        short: "dodaj żołnierzy"
        description: "<gray>Darmowi żołnierze kraju jako straż w twoim miejscu."
        rank: "<red>admin"
      armia-rozpusc:
        short: "usuń całe wojsko"
        description: "<gray>Usuwa wszystkich żołnierzy kraju."
        rank: "<red>admin"
