      arrow-multiplier: 0.25   # obrażenia od strzał, bełtów i rzucanych pocisków (pociski machin liczą się w pełni)
      fire-multiplier: 2.5     # obrażenia od ognia i lawy; płonąca strzała lub zaklęcie Zaklęty ogień podpala taran
      head-reach: 7.0          # odległość obsługi od środka uderzanego bloku (głowica modelu ~6,5 bloku przed obsługą)
      blocks-per-strike: 4     # najwięcej bloków zniszczonych jednym uderzeniem (1–4)
      # Ułamek wytrzymałości bloku zabierany jednym uderzeniem (1 = jedno uderzenie). Uderzenie trafia płaszczyznę
      # 3 szer. × 3 wys. (od ziemi). Drewno: bloki na siekierę i miękkie (twardość < 1); umocnienia: lista niżej
      # oraz twardość ≥ 3 (łupek głębinowy, żelazo, obsydian); reszta to kamień.
      strength:
        wood: 0.5              # 2 uderzenia
        stone: 0.25            # 4 uderzenia
        fortification: 0.1     # 10 uderzeń
      fortification-blocks: [IRON_DOOR, IRON_BARS, IRON_TRAPDOOR, OBSIDIAN, CRYING_OBSIDIAN, IRON_BLOCK, ANVIL, CHIPPED_ANVIL, DAMAGED_ANVIL]
