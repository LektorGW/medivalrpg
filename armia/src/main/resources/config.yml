    era: 1
    name: "<#a0522d>Taran"
    description: "<gray>Kryty taran na kołach: wybija bramy i mury obleganego chunka; strzały mu niestraszne, ogień — bardzo"
    cost: 800
    wage: 35
    health: 60          # wysokie wobec strzał (×0,25 obrażeń), niskie wobec ognia (×2,5)
