  help-categories:
    informacje: "Informacje"
    badania: "Badania"
    admin: "<red>Admin"
  help-entries:
    status:
      short: "stan twojego kraju"
      description: "Epoka, punkty badań, pasek postępu, czego brakuje do następnej epoki i klikalne dostępne odkrycia."
      rank: "każdy"
    drzewko:
      short: "drzewko odkryć (GUI)"
      description: "Okno z epokami w rzędach: zdobyte (świecą), dostępne i zablokowane odkrycia. Kliknięcie dostępnego odkrycia = /postep odkryj."
      rank: "każdy"
    odkrycia:
      short: "dostępne odkrycia"
      description: "Lista odkryć, które twój kraj może teraz badać, z kosztami i dymkami."
      rank: "członek kraju"
    epoki:
      short: "epoki i wymagania"
      description: "Średniowiecze → Renesans → Epoka przemysłowa → Nowoczesność: progi ludności i osady, minimalny czas, wymagane odkrycia."
      rank: "każdy"
    ranking:
      short: "ranking krajów"
      description: "Kraje według epoki i postępu. Kliknij kraj, by zobaczyć szczegóły."
      rank: "każdy"
    kraj:
      short: "postęp innego kraju"
      description: "Epoka, postęp i braki dowolnego kraju (graczy albo NPC)."
      rank: "każdy"
    pomoc:
      short: "ta pomoc"
      description: "Interaktywna pomoc: najedź na komendę, kliknij, aby ją wpisać."
      rank: "każdy"
    odkryj:
      short: "odkryj / ustaw cel badań"
      description: "Gdy masz dość punktów — odkrycie od razu. Inaczej ustawia cel badań (także przez wymagane odkrycia); odkrycie nastąpi samo przy dziennym naliczeniu."
      rank: "Doradca+"
    cel:
      short: "obecny cel badań"
      description: "Pokazuje cel badań, koszt ścieżki i szacowany czas. <white>/postep cel wyczysc</white> anuluje cel."
      rank: "członek kraju (anulowanie: Doradca+)"
    inwestuj:
      short: "pieniądze ze skarbca → punkty"
      description: "Zamienia pieniądze ze skarbca kraju na punkty badań od razu. Malejące przychody: każda kolejna moneta danego dnia daje mniej, aż do dziennego sufitu."
      rank: "Doradca+"
    awansuj:
      short: "ogłoś nową epokę"
      description: "Gdy serwer wymaga potwierdzenia Władcy (awans.potwierdzenie-wladcy), ogłasza wejście w nową epokę po spełnieniu warunków."
      rank: "Władca"
    admin-ustaw:
      short: "ustaw epokę kraju"
      description: "Ustawia epokę (1–4 albo nazwa); dodaje wymagane odkrycia wcześniejszych epok, liczy czas od nowa, wywołuje EraAdvanceEvent."
      rank: "admin"
    admin-punkty:
      short: "dodaj/odejmij punkty"
      description: "Zmienia pulę punktów badań kraju, np. +500 albo -100."
      rank: "admin"
    admin-odkryj:
      short: "nadaj odkrycie"
      description: "Nadaje odkrycie za darmo (razem z brakującymi wymaganiami), niezależnie od epoki."
      rank: "admin"
    admin-zabierz:
      short: "zabierz odkrycie"
      description: "Zabiera odkrycie i wszystkie, które od niego zależą."
      rank: "admin"
    admin-tick:
      short: "naliczenie teraz"
      description: "Wykonuje dzienne naliczenie punktów (z inwestycjami NPC i awansami) teraz; harmonogram się nie zmienia."
      rank: "admin"
    admin-info:
      short: "stan pluginu"
      description: "Liczba krajów i odkryć, czas ostatniego i następnego naliczenia, integracje, ranking."
      rank: "admin"
    admin-przeladuj:
      short: "przeładuj config i drzewko"
      description: "Wczytuje ponownie config.yml i drzewko.yml (z walidacją: wymagania, cykle)."
      rank: "admin"
