# Postep — epoki i postęp państw (MEDIVALRPG)
# © 2026 Maciej Kaczmarczyk — lektoro.pl
#
# Każde państwo (graczy i NPC) rozwija się osobno: punkty badań → odkrycia (drzewko.yml) → kolejna epoka.
# Pieniądze w miedziakach (1 sr = 10 md, 1 zł = 100 md).

tick:
  # Dzienne naliczenie punktów badań (czas serwera). Po restarcie zaległe dni są nadrabiane.
  godzina: "06:00"
  # Strefa czasowa, np. Europe/Warsaw; pusta = strefa serwera.
  strefa: ""
  max-nadrabianie: 7
  # Co ile sekund przeliczać stan krajów (warunki awansu, mapa, tablista, postep.json).
  odswiezanie-sekundy: 60

awans:
  # 1 = tylko średniowiecze, 2 = średniowiecze i renesans. Przemysł i nowoczesność są wyłączone.
  # Istniejące kraje z późniejszej epoki wracają do limitu, zachowując historię i punkty.
  maksymalna-epoka: 2
  # false = kraj awansuje sam, gdy spełni warunki; true = kraj GRACZY czeka na /postep awansuj Władcy (NPC zawsze sami).
  potwierdzenie-wladcy: false
  ogloszenie: true
  title: true
  # wszyscy | kraj — kto widzi title i słyszy dźwięk
  title-dla: wszyscy
  dzwiek: "ui.toast.challenge_complete"
  dzwiek-glosnosc: 1.0
  dzwiek-ton: 1.0

progi:
  # Brak Ludnosc (nieznana ludność / poziom osady) → progi uznane za spełnione.
  pomijaj-nieznane: true
  # Do progu ludności każdy gracz-członek liczy się jak N mieszkańców.
  gracz-jak-mieszkancy: 5
  # Nazwy poziomów osady (Ludnosc: 1 = Osada … 5 = Stolica; 6 = Metropolia, gdy Ludnosc ją doda).
  nazwy-poziomow: [Osada, Wieś, Miasteczko, Miasto, Stolica, Metropolia]
  # Wagi paska postępu (odkrycia / czas w epoce / progi).
  wagi:
    odkrycia: 0.6
    czas: 0.25
    progi: 0.15
  teksty:
    odkrycie: "odkrycie: {name}"
    czas: "czas w epoce: jeszcze {left}"
    ludnosc: "ludność ≥ {need} (jest {have})"
    poziom: "poziom osady ≥ {need} (jest {have})"

# Epoki w kolejności. min-dni = minimalny czas W TEJ epoce przed następną;
# min-ludnosc / min-poziom = progi WEJŚCIA do tej epoki; mnoznik-punktow = mnożnik dziennych punktów w tej epoce;
# inwestycja-pkt-za-zlota = ile punktów daje pierwsza 1 zł zainwestowana danego dnia; inwestycja-max-dziennie = sufit punktów
# z inwestycji na dzień (malejące przychody: F(T) = max × (1 − e^(−T × stawka / max))).
epoki:
  1:
    nazwa: Średniowiecze
    biernik: Średniowiecze
    lata: "V–XV w."
    kolor: "#B08D57"
    ikona: "⚔"
    ikona-gui: SHIELD
    opis: Grody, zamki, cechy i klasztory.
    min-dni: 21
    min-ludnosc: 0
    min-poziom: 0
    mnoznik-punktow: 1.0
    inwestycja-pkt-za-zlota: 4
    inwestycja-max-dziennie: 20
  2:
    nazwa: Renesans
    biernik: Renesans
    lata: "XV–XVII w."
    kolor: "#C9A227"
    ikona: "⚜"
    ikona-gui: SPYGLASS
    opis: Druk, proch, wielkie odkrycia geograficzne i bankierzy.
    min-dni: 21
    min-ludnosc: 25
    min-poziom: 2
    mnoznik-punktow: 1.25
    inwestycja-pkt-za-zlota: 5
    inwestycja-max-dziennie: 35
  3:
    nazwa: Epoka przemysłowa
    biernik: epokę przemysłową
    lata: "XIX w."
    kolor: "#8E9AAF"
    ikona: "⚙"
    ikona-gui: FURNACE
    opis: Para, stal, kolej i elektryczność.
    min-dni: 21
    min-ludnosc: 60
    min-poziom: 3
    mnoznik-punktow: 1.5
    inwestycja-pkt-za-zlota: 6
    inwestycja-max-dziennie: 55
  4:
    nazwa: Nowoczesność
    biernik: Nowoczesność
    lata: "2026"
    kolor: "#3FA7D6"
    ikona: "⚡"
    ikona-gui: REDSTONE_LAMP
    opis: Beton, samochody, lotnictwo, komputery i internet.
    min-dni: 0
    min-ludnosc: 100
    min-poziom: 4
    mnoznik-punktow: 1.75
    inwestycja-pkt-za-zlota: 7
    inwestycja-max-dziennie: 80

# Dzienne punkty badań:
#   (baza + na-mieszkanca × ludność NPC + na-gracza × gracze + budynki) × (1 + modyfikatory%) × mnożnik epoki
# Modyfikatory: pokój (brak wojen), sojusze, wojny (kara), wasal (kara), odkrycia z efektem "badania".
punkty:
  baza: 3
  na-mieszkanca: 0.15
  max-mieszkancow: 250
  na-gracza: 2
  max-graczy: 10
  pokoj: 10
  na-sojusz: 5
  max-sojusze: 15
  na-wojne: 15
  max-wojny: 45
  wasal: 10
  min-mnoznik: 0.25
  mnoznik-npc: 1.0
  # Ile budynków jednego typu się liczy.
  max-budynkow-typu: 3
  # Typ budynku z Ludnosc → punkty/dzień. Dopasowanie: najdłuższy klucz zawarty w id typu (bez polskich znaków),
  # więc "uniwersytet_renesansowy" liczy się jak "uniwersytet"; typy, które dopiero powstaną, działają od razu.
  budynki:
    biblioteka: 4
    szkola: 3
    akademia: 6
    uniwersytet: 10
    kosciol: 1
    katedra: 3
    klasztor: 2
    ratusz: 2
    port: 3
    przystan: 2
    targ: 2
    palac: 2
    zamek: 1
    drukarnia: 5
    obserwatorium: 6
    bank: 2
    laboratorium: 12
    fabryka: 3
    dworzec: 3
    szpital: 3
    biurowiec: 4
    parlament: 4
    galeria: 2
    stadion: 1

inwestycje:
  # Minimalna ranga do /postep inwestuj: OBYWATEL | DORADCA | WLADCA
  ranga: DORADCA
  min-kwota: 10

odkrywanie:
  # Minimalna ranga do /postep odkryj i /postep cel wyczysc.
  ranga: DORADCA
  # true = kraje graczy bez celu badań wybierają cel same (jak NPC, osobowość neutralna).
  gracze-auto-cel: false
  # Kto słyszy o nowym odkryciu: kraj | wszyscy | brak
  ogloszenie: kraj

npc:
  # Kraje NPC same wybierają odkrycia wg osobowości (Armia: agresja → wojsko, bogactwo → gospodarka,
  # ekspansja → budownictwo, dyplomacja → dyplomacja/nauka) i inwestują część dochodu.
  auto-wybor: true
  auto-inwestycje: true
  # % dochodu (Armia: przychody z 24 h; bez Armii: podatek NPC z Ludnosc) przy osobowości neutralnej;
  # rośnie z bogactwem i dyplomacją, w wojnie × mnoznik-wojna. Armia może ustawić stały udział przez PostepApi.
  udzial-bazowy: 12
  udzial-max: 35
  mnoznik-wojna: 0.4
  rezerwa: 500
  max-ze-skarbca: 0.2
  # Nie inwestuj ponad ten ułamek dziennego sufitu punktów z inwestycji.
  do-limitu: 0.85

tablista:
  # Dopisuje ikonę epoki do nazwy w tabliście (nazwę ustawia Kraje). Nowe Kraje mają własne <era>/<era_icon> w
  # tablist.format – gdy format Kraje ich używa, Postep sam przestaje dopisywać ikonę (bez podwójnej ikony).
  # Przy rozbudowanej tabliście Kraje (tablist.style: extended) sprawdzany jest tablist.extended.name-format.
  # Z takim Kraje możesz ustawić false (wyłącza dopisywanie całkowicie).
  dopisz-ikone: true
  # <name> = nazwa z Kraje, <badge_icon> = kolorowa ikona, <badge> = ikona + nazwa epoki, <era> = nazwa epoki
  format: "<name> <badge_icon>"
  co-ile-sekund: 5

mapa:
  # Warstwa squaremap z ikoną epoki przy stolicy każdego kraju (popup: epoka, postęp, punkty, odkrycia).
  warstwa: true
  nazwa-warstwy: "Epoki"
  ukryta-domyslnie: false
  priorytet: 12
  z-index: 260
  rozmiar-ikony: 18
  # Przesunięcie ikony względem środka chunka stolicy (żeby nie zasłaniała ikony stolicy z Kraje).
  przesuniecie-x: 0
  przesuniecie-z: -12
  # postep.json dla panelu mapy i panelu www (domyślnie do katalogu web squaremap).
  eksport-json: true
  # Pusta = <squaremap>/web/postep.json (bez squaremap: plugins/Postep/postep.json).
  sciezka-json: ""

messages:
  prefix: "<dark_gray>[<gold>Postęp</gold>]</dark_gray> "

  # ---- awans i odkrycia
  awans-czat: "<prefix><era_color><bold>✦</bold> <country> wkracza w <era_acc>! <icon> <bold>✦</bold></era_color>"
  awans-title: "<era_color>✦ <country_name> wkracza w <era_acc>! ✦</era_color>"
  awans-subtitle: "<gray><icon> <era> <dark_gray>(<years>)</dark_gray>"
  awans-gotowy-wladca: "<prefix><gold>Twój kraj spełnia wszystkie warunki, by wkroczyć w <era_color><era_acc></era_color>!</gold> <click:run_command:'/postep awansuj'><hover:show_text:'<gray>Kliknij, aby ogłosić nową epokę'><green><bold>[Wkrocz w nową epokę]</bold></green></hover></click>"
  awans-gotowy: "<prefix><gold>Twój kraj jest gotowy, by wkroczyć w <era_color><era_acc></era_color>.</gold> <gray>Władca musi to ogłosić: <white>/postep awansuj</white>."
  odkrycie-kraj: "<prefix><green>Nowe odkrycie: <gold><bold><discovery></bold></gold>!</green> <gray><effect>"
  odkrycie-wszyscy: "<prefix><country> <gray>dokonuje odkrycia: <gold><discovery></gold>."
  npc-log-inwestycja: "Postęp: zainwestowano <amount> w badania (+<points> pkt)"
  npc-log-cel: "Postęp: rozpoczęto badania — <discovery>"
  npc-log-odkrycie: "Postęp: odkryto <discovery>"
  npc-log-epoka: "Postęp: kraj wkroczył w epokę <era>"

  # ---- błędy
  error-internal: "<prefix><red>Wystąpił błąd — szczegóły w konsoli."
  error-player-only: "<prefix><red>Tę komendę może wykonać tylko gracz."
  error-no-country: "<prefix><red>Nie należysz do żadnego kraju."
  error-rank: "<prefix><red>Potrzebujesz rangi co najmniej <white><rank></white>."
  error-unknown-country: "<prefix><red>Nie ma kraju <white><name></white>."

