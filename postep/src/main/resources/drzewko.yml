# Drzewko odkryć — Postep (MEDIVALRPG)
# © 2026 Maciej Kaczmarczyk — lektoro.pl
#
# Każde odkrycie:
#   nazwa               polska nazwa
#   epoka               1 Średniowiecze, 2 Renesans, 3 Epoka przemysłowa, 4 Nowoczesność
#   koszt               punkty badań
#   wymaga              lista id innych odkryć (z tej samej albo wcześniejszej epoki; bez cykli)
#   wymagane-do-epoki   true = potrzebne, by wejść w następną epokę
#   kategoria           gospodarka | nauka | wojsko | budownictwo | dyplomacja (NPC wybierają wg osobowości)
#   ikona               materiał w GUI drzewka
#   opis, efekt         teksty dla graczy
#   efekty              liczby w procentach; czytają je inne pluginy przez PostepApi.effect(kraj, klucz):
#                       podatki, jedzenie, sila-armii, tempo-budowy, ludnosc (wzrost), badania (punkty badań — liczy Postep)
# Konkretne skutki (nowe budynki, jednostki) inne pluginy sprawdzają przez PostepApi.hasDiscovery(kraj, id).
# W GUI mieści się 8 odkryć na epokę.

odkrycia:
  # ---------------------------------------------------------------- Średniowiecze
  kolo_wodne:
    nazwa: Koło wodne
    epoka: 1
    koszt: 80
    wymaga: []
    wymagane-do-epoki: true
    kategoria: gospodarka
    ikona: WATER_BUCKET
    opis: Młyny wodne mielą zboże i napędzają miechy kuźni.
    efekt: "+5% jedzenia, +3% tempa budowy; Ludnosc: młyn wodny."
    efekty: {jedzenie: 5, tempo-budowy: 3}
  plug:
    nazwa: Pług ciężki
