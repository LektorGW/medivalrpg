  help-zlecenia:
    title: "Zlecenia i reputacja"
    categories:
      zlecenia: "Zlecenia"
      reputacja: "Reputacja"
      admin: "Admin"
    entries:
      lista:
        short: "zlecenia w toku i tablica kraju, na którym stoisz"
        description: "Pokazuje twoje zlecenia (z przyciskami Oddaj/Porzuć). Na ziemi kraju NPC — jego dzienną tablicę z przyciskami Przyjmij/Odrzuć; gdzie indziej — najbliższe kraje NPC."
        rank: "każdy"
      kraj:
        short: "tablica zleceń wybranego kraju NPC"
        description: "Podgląd dziennej tablicy dowolnego kraju NPC. Przyjąć zlecenie możesz na ziemi tego kraju albo przy jego władcy."
        rank: "każdy"
      przyjmij:
        short: "przyjmij zlecenie"
        description: "Nagroda jest od razu odkładana ze skarbca władcy do depozytu i czeka na ciebie. Każde zlecenie możesz wziąć raz dziennie. Najwięcej zleceń naraz i dziennie ustala serwer."
        rank: "każdy"
      oddaj:
        short: "oddaj gotowe zlecenia"
        description: "Dostawy i surowce oddajesz w stolicy kraju (kilka chunków od niej) albo przy władcy — towar jest zabierany z ekwipunku. Ładunek oddajesz w stolicy kraju docelowego. Nagroda trafia na twoje konto w banku."
        rank: "każdy"
      porzuc:
        short: "porzuć zlecenie"
        description: "Depozyt wraca do władcy, reputacja spada, a ten kraj przez chwilę nic ci nie zleci."
        rank: "każdy"
      odrzuc:
        short: "odrzuć proponowane zlecenie"
        description: "Zlecenie znika z twojej tablicy do jutra; reputacja spada nieznacznie."
        rank: "każdy"
      pomoc:
        short: "ta pomoc"
        description: "Interaktywna pomoc. Najedź na komendę, by zobaczyć opis; kliknij, by wpisać ją na czat."
        rank: "każdy"
      reputacja:
        short: "twoja reputacja u krajów (Wróg … Bohater)"
        description: "Reputacja −100…100 u każdego kraju: rośnie za wykonane zlecenia i zapłacony trybut, spada za porzucone i nieudane. Wpływa na dostępne zlecenia, wysokość nagród, dary i ton władcy."
        rank: "każdy"
      rozmowa:
        short: "poproś władcę o zlecenie w rozmowie"
        description: "Władca sam może zaproponować zlecenie (przyciski Przyjmij/Odrzuć) i odebrać towar, gdy powiesz, że go przyniosłeś. Jego ton zależy od twojej reputacji."
        rank: "każdy"
      odswiez:
        short: "nowe tablice zleceń (kraj albo wszystkie)"
        description: "Losuje nowe oferty od razu. Zlecenia w toku zostają."
        rank: "admin"
      przeladuj:
        short: "przeładuj config.yml"
        description: "Wczytuje config (także zlecenia i reputację) i kończy trwające rozmowy."
        rank: "admin"
      rep-pokaz:
        short: "reputacja gracza"
        description: "Wszystkie kraje gracza albo szczegóły u jednego."
        rank: "admin"
      rep-daj:
        short: "dodaj/odejmij reputację"
        description: "Zmienia reputację gracza u kraju o podaną liczbę (bez dziennego limitu)."
        rank: "admin"
      rep-ustaw:
        short: "ustaw reputację"
        description: "Ustawia wartość −100…100."
        rank: "admin"
      rep-resetuj:
        short: "wyczyść reputację"
        description: "U jednego kraju albo u wszystkich."
        rank: "admin"
