# Wladcy — rozmowy z władcami krajów NPC (Claude, Anthropic API).

# Klucz API Anthropic. Najbezpieczniej wpisać go TUTAJ (plik czyta tylko serwer).
# Pusty = zmienna środowiskowa ANTHROPIC_API_KEY. Bez klucza plugin działa, ale władcy są „nieosiągalni”.
# Można też z konsoli: /wladca klucz <klucz> (zapisuje tutaj; uwaga: komendy konsoli mogą trafić do logów).
api-key: ""

api:
  # claude-opus-5-5 (domyślnie, najlepsze odgrywanie ról) albo claude-haiku-5-5 (ok. 40× tańszy, słabszy w roli).
  model: claude-opus-5-5
  # Ile model myśli przed odpowiedzią: low | medium | high | xhigh | max. Na Opus 5.5 myślenia nie da się wyłączyć,
  # effort jest jedyną kontrolą (koszt i opóźnienie). Dla czatu: low.
  effort: low
  # Limit tokenów wyjścia na jedno wywołanie (myślenie + odpowiedź).
  max-tokens: 2048
  # Server-side fallbacks (fallbacks: "default", beta server-side-fallback-2026-07-01): gdy klasyfikator odmówi,
  # API samo ponawia na zalecanym modelu. Dla claude-haiku-5-5 nie jest wysyłane (Haiku nie ma tej funkcji).
  fallbacks: true
  timeout-seconds: 30
  # Ponowienia SDK przy 429/5xx (z odczekaniem). Mało = mniej spamu; władca „zamyśla się” zamiast czekać.
  max-retries: 1
  # Wątki wywołań API (nigdy główny wątek serwera).
  threads: 2
  # Ile rund narzędzi na jedną wiadomość gracza (ostatnia runda wymusza odpowiedź słowami).
  max-tool-rounds: 3

limits:
  per-player-per-day: 40
  cooldown-seconds: 4
  max-input-chars: 300
  # Po przekroczeniu władcy „odmawiają audiencji do jutra”. Liczone z response.usage i cennika poniżej.
  daily-budget-usd: 3.00
  # 0 = bez limitu miesięcznego.
  monthly-budget-usd: 0

conversation:
  # Gracz musi stać najwyżej tyle bloków od władcy, żeby zacząć.
  start-radius: 6
  # Odejście dalej kończy rozmowę.
  max-distance: 8
  # Cisza tak długo (sekundy) kończy rozmowę.
  idle-seconds: 180
  # Inni gracze w tym promieniu widzą rozmowę jako RP (0 = nikt).
  rp-radius: 8
  # Najwięcej wiadomości gracza w jednej audiencji.
  max-messages: 20
  reply-max-chars: 600

display:
  # Krótki tekst odpowiedzi nad głową władcy (TextDisplay, nietrwały).
  text-display: true
  seconds: 6
  max-chars: 90

memory:
  # Ile ostatnich wymian gracz × władca pamiętać między rozmowami.
  exchanges: 6
  notes: 5
  reply-chars: 300

diplomacy:
  # Kto może zawierać sojusz/pokój i płacić trybut w imieniu kraju: wladca | doradca.
  min-rank: wladca

tribute:
  # Najwyższy trybut, jakiego władca może zażądać (miedziaki; 5000 = 50 zł).
  max-amount: 5000
  expire-minutes: 5
  # Poprawa nastawienia władcy za każdą zapłaconą złotą koronę (max +50 za raz).
  sympathy-per-gold: 2
  refuse-sympathy: -10

gift:
  # Władca NPC może dziennie rozdać najwyżej tyle % swojego skarbca (wszystkim razem).
  max-treasury-percent-per-day: 5
  # ...i najwyżej tyle jednemu graczowi dziennie (miedziaki).
  max-per-player-per-day: 1000

style:
  # 0–100: swoboda mowy władców. 67–100: żywo, z humorem, emocjami i staropolskimi przekleństwami, ostro na
  # bezczelnych; dojrzałe tematy epoki (wojna, intrygi, przekupstwo, przemyt, zamtuzy jako tło, handel niewolnikami
  # w świecie gry) grane swobodnie. 34–66: żywo, rzadkie łagodne przekleństwa. 0–33: dworska powaga, ciemne tematy
  # tylko jako tło. Twarde granice (bez treści seksualnych wprost, nieletnich, nienawiści wobec realnych grup,
  # instrukcji szkody w realnym świecie, podszywania się pod realne osoby) obowiązują zawsze.
  freedom: 75

# Czy władca może wypowiedzieć wojnę w rozmowie (narzędzie wypowiedz_wojne; koszt płaci skarbiec NPC).
allow-war: true
war:
  # Max 1 wojna wypowiedziana w rozmowie na kraj NPC w tym czasie.
  cooldown-hours: 24
  # Przy niższej agresji kraju NPC (ustawienie Armii) gra odmawia, a władca się wycofuje.
  min-aggression: 40

# Zlecenia władców NPC (/zlecenia, także w rozmowie przez narzędzia zaproponuj_zlecenie / odbierz_zlecenie).
# Kwoty w miedziakach (1 sr = 10 md, 1 zł = 100 md). Tylko przedmioty średniowiecza i renesansu (epoka ≤ 2).
zlecenia:
  enabled: true
  # Ile ofert ma dzienna tablica każdego kraju NPC (nowa tablica o północy czasu serwera). Każdy gracz może
  # wziąć każdą ofertę raz dziennie — oferty nie są „zajmowane” przez innych.
  offers-per-day: 4
  # Wagi losowania typów (przy co najmniej 3 ofertach każdy dostępny typ trafia na tablicę co najmniej raz).
  weights: {dostawa: 40, surowce: 35, transport: 25}
  # Jedna oferta dziennie jest „zaszczytna” ★: nagroda ×1,5 i +2 reputacji, wymaga reputacji Znajomy+.
  premium-multiplier: 1.5
  premium-reputation-bonus: 2
  limits:
    max-active: 2
    # Ukończone (i porzucone/nieudane, przy limicie kraju) zlecenia na dzień — anty-farma.
    max-completed-per-day: 6
    max-per-country-per-day: 3
  cooldowns:
    # Odstęp między przyjęciem kolejnych zleceń.
    accept-seconds: 10
    # Po porzuceniu albo niezdążeniu ten kraj nic graczowi nie zleca przez tyle minut.
    after-fail-minutes: 30
  # false: zlecenie przyjmiesz tylko na ziemi kraju albo przy jego władcy (true = skądkolwiek).
  accept-anywhere: false
  # Oddanie: w promieniu tylu chunków od chunka stolicy albo przy władcy.
  capital-radius-chunks: 2
  reward:
    # Nagroda idzie ze skarbca kraju NPC: przy przyjęciu trafia do depozytu (konto wladcy:zlecenie-…), przy oddaniu
    # na konto gracza, przy porażce wraca do skarbca. Zamknięta pula: create-money jest ignorowane (zawsze false).
    create-money: false
    # Rezerwa skarbca kraju NPC, której zlecenia nie ruszają: tyle dni żołdu armii i utrzymania ziemi, nie mniej niż reserve-min (md).
    reserve-days-of-wages: 2
    reserve-min: 500
    min: 20
    max: 2000
    # Jedna nagroda najwyżej tyle % skarbca; wszystkie nagrody kraju dziennie najwyżej tyle %.
    max-treasury-percent-per-quest: 3
    max-treasury-percent-per-day: 10
    # Bogactwo władcy (Armia, 0–100) zmienia nagrody o ±20%.
    wealth-effect: 0.2
  dostawa:
    time-limit-minutes: 120
    reputation: 4
    # Stała premia za zlecenie + cena za towar (price md za każde „per” sztuk; skup u kupca płaci mniej).
    bonus: 30
    pool:
      - {material: WHEAT, name: "pszenica", min: 32, max: 64, price: 10, per: 16}
      - {material: BREAD, name: "chleb", min: 16, max: 32, price: 20, per: 8}
      - {material: LEATHER, name: "skóra", min: 8, max: 24, price: 15, per: 4}
      - {material: WHITE_WOOL, name: "biała wełna", min: 16, max: 32, price: 12, per: 8}
      - {material: FEATHER, name: "pióra", min: 16, max: 32, price: 6, per: 8}
      - {material: STRING, name: "nici", min: 16, max: 32, price: 8, per: 8}
      - {material: PAPER, name: "papier", min: 16, max: 32, price: 10, per: 8}
      - {material: BOOK, name: "księgi", min: 4, max: 8, price: 12, per: 1}
      - {material: CANDLE, name: "świece", min: 8, max: 16, price: 4, per: 1}
      - {material: ARROW, name: "strzały", min: 32, max: 64, price: 8, per: 16}
      - {material: HONEY_BOTTLE, name: "miód w butelkach", min: 4, max: 12, price: 6, per: 1}
      - {material: COOKED_BEEF, name: "pieczona wołowina", min: 16, max: 32, price: 12, per: 4}
  surowce:
    time-limit-minutes: 180
    reputation: 5
    bonus: 40
    # Nagroda ×, gdy kraj naprawdę tego potrzebuje (dane z Ludnosc). Bez Ludnosc surowiec jest losowy.
    need-multiplier: 1.3
    resources:
      drewno:
        name: "drewno"
        # Kraj „potrzebuje”, gdy w magazynie Ludnosc ma mniej niż tyle.
        threshold: 300
        pool:
          - {material: OAK_LOG, name: "kłody dębowe", min: 32, max: 64, price: 12, per: 16}
          - {material: SPRUCE_LOG, name: "kłody świerkowe", min: 32, max: 64, price: 12, per: 16}
          - {material: BIRCH_LOG, name: "kłody brzozowe", min: 32, max: 64, price: 12, per: 16}
      kamien:
        name: "kamień"
        threshold: 400
        pool:
          - {material: COBBLESTONE, name: "bruk", min: 64, max: 128, price: 10, per: 64}
          - {material: STONE_BRICKS, name: "kamienne cegły", min: 32, max: 64, price: 10, per: 16}
      rudy:
        name: "kruszce"
        threshold: 120
        pool:
          - {material: IRON_INGOT, name: "sztabki żelaza", min: 8, max: 24, price: 10, per: 1}
          - {material: COAL, name: "węgiel", min: 16, max: 48, price: 12, per: 8}
      ryby:
        name: "ryby"
        threshold: 80
        pool:
          - {material: COD, name: "dorsze", min: 12, max: 24, price: 6, per: 4}
          - {material: SALMON, name: "łososie", min: 8, max: 20, price: 7, per: 4}
      # Żywność: brakuje, gdy obywatele głodują, bilans jedzenia jest ujemny albo spichlerz < 25%.
      zywnosc:
        name: "żywność"
        pool:
          - {material: WHEAT, name: "pszenica", min: 48, max: 96, price: 10, per: 16}
          - {material: BREAD, name: "chleb", min: 24, max: 48, price: 20, per: 8}
          - {material: CARROT, name: "marchew", min: 32, max: 64, price: 8, per: 16}
          - {material: POTATO, name: "ziemniaki", min: 32, max: 64, price: 8, per: 16}
  transport:
    # Zapieczętowany ładunek do stolicy innego kraju (nie wroga) drogą lądową. Nie da się go postawić ani spalić;
    # zgubiony = zlecenie przepada po czasie. Czas: base + per 100 bloków odległości stolic.
    reputation: 6
    base-minutes: 20
    minutes-per-100-blocks: 4
    min-distance: 150
    max-distance: 3000
    base-reward: 60
    reward-per-100-blocks: 25
    cargo-material: BARREL
    goods: ["sukno flandryjskie", "przyprawy", "beczka wina", "sól kamienna", "listy i pieczęcie", "sztaby srebra", "miód pitny", "futra"]

# Reputacja gracza u każdego kraju: −100…100. Progi: Wróg ≤ −60, Nieufny −59…−20, Obcy −19…19, Znajomy 20…49,
# Przyjaciel 50…79, Bohater ≥ 80. Wróg nie dostaje zleceń, Nieufny tylko dostawy, zaszczytne od Znajomego.
reputacja:
  refuse: -1
  abandon: -3
  fail: -4
  # Trybut zapłacony / odmówiony w rozmowie z władcą.
  tribute-paid: 3
  tribute-refused: -2
  # Najwięcej punktów zysku na dzień u jednego kraju (straty bez limitu).
  daily-gain-cap: 15
  # Mnożnik nagród za zlecenia wg progu.
  reward-multiplier: {wrog: 0, nieufny: 0.8, obcy: 1.0, znajomy: 1.1, przyjaciel: 1.25, bohater: 1.5}
  # Mnożnik dziennego limitu darów władcy (podaruj, gift.max-per-player-per-day) dla gracza wg progu.
  gift-multiplier: {wrog: 0, nieufny: 0.5, obcy: 1.0, znajomy: 1.2, przyjaciel: 1.5, bohater: 2.0}

# Cennik w USD za milion tokenów (sprawdzaj aktualny na stronie Anthropic). Klucz = id modelu (albo jego początek).
pricing:
  claude-opus-5-5: {input: 4.00, output: 20.00, cache-read: 0.20, cache-write: 5.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache-read: 0.01, cache-write: 0.125}
  # Modele, na które może trafić fallback po odmowie klasyfikatora:
  claude-opus-5: {input: 5.00, output: 25.00, cache-read: 0.50, cache-write: 6.25}
  claude-opus-4-8: {input: 5.00, output: 25.00, cache-read: 0.50, cache-write: 6.25}
  default: {input: 5.00, output: 25.00, cache-read: 0.50, cache-write: 6.25}

