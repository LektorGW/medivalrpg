# Strażnik — logowanie graczy MEDIVALRPG (serwer w trybie offline). Po zmianach: /straznik przeladuj.

logowanie:
  # Czas na /login albo /register (sekundy); po nim gracz jest wyrzucany.
  limit-czasu-sekundy: 90
  # Co ile sekund przypominać komendę (czat + tytuł).
  przypomnienie-co-sekund: 10
  # Złe hasła w jednym połączeniu, po których gracz jest wyrzucany.
  proby-na-polaczenie: 3
  blokada:
    # Tyle nieudanych prób (na nick ALBO na adres IP) w oknie czasu blokuje logowanie.
    po-nieudanych: 5
    okno-minut: 15
    czas-minut: 15

sesja:
  # Ten sam gracz z tego samego IP w ciągu N minut od wyjścia nie musi wpisywać /login. Restart serwera kończy sesje.
  wlaczona: true
  minuty: 10

konta-na-ip:
  # Ile kont można zarejestrować z jednego adresu (0 = bez limitu). Liczą się adres rejestracji i ostatni adres.
  limit: 3
  wyjatki:
    - 127.0.0.1

haslo:
  min-dlugosc: 6
  max-dlugosc: 64
  # Hasło nie może zawierać nicku.
  zakaz-nicku: true
  # Parametry nowych hashy (Argon2id). Hasła z nLogin (Argon2id m=32 MiB, t=5) są przehaszowane przy pierwszym logowaniu.
  argon2:
    pamiec-kib: 65536
    iteracje: 3
    rownoleglosc: 1
    # Ile haszowań naraz (każde zajmuje pamiec-kib pamięci).
    watki: 2

nick:
  # Dozwolone nicki (jak w nLogin).
  wzorzec: '[a-zA-Z0-9_]{3,16}'
  # Konto zarejestrowane jako "Gracz" nie wpuszcza nicku "gracz" ani "GRACZ" (w trybie offline to inny gracz z innym UUID).
  ochrona-wielkosci-liter: true
  # Nie wpuszczaj drugiego połączenia na nick, który jest już zalogowany z innego adresu IP.
  blokuj-podwojne-wejscie: true

limbo:
  # Przed zalogowaniem ekwipunek jest zapisywany (plugins/Straznik/limbo/) i chowany, a gracz stoi w miejscu limbo.
  # Po zalogowaniu wraca dokładnie tam, gdzie się wylogował, z całym ekwipunkiem.
  ukryj-ekwipunek: true
  ukryj-pozycje: true
  # Miejsce oczekiwania: 'swiat;x;y;z[;yaw;pitch]'. Puste = spawn głównego świata.
  lokalizacja: ''
  # Niezalogowani są niewidoczni dla innych i nie widzą innych graczy ani czatu.
  ukryj-graczy: true
  ukryj-czat: true
  slepota: false

import:
  nlogin:
    # Przy pierwszym starcie (jednorazowo, znacznik w bazie) importuje konta z nLogin. Plik nie jest zmieniany.
    przy-starcie: true
    plik: 'plugins/nLogin/nlogin.db'

admin:
  # /straznik haslo, import i eksport tylko z konsoli (hasło wpisane na czacie widzą pluginy czatu).
  hasla-tylko-z-konsoli: true

log:
  # Ukrywa w konsoli i logs/latest.log linie "... issued server command: /login ..." (i inne komendy z hasłem).
  ukryj-komendy-w-konsoli: true

wyglad:
  bossbar: true
  tytuly: true
  # Okno logowania/rejestracji zaraz po wejściu (pola hasła, przycisk „Wyjdź”). Komendy czatu działają zawsze.
  # Uwaga: okno Minecrafta nie ma pola maskowanego — hasło jest widoczne na ekranie gracza (nie trafia do logów).
  okno: true

