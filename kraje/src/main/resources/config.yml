# ============================================================
#  Kraje — system krajów dla MEDIVALRPG
#  (c) 2026 Maciej Kaczmarczyk — lektoro.pl
#
#  Teksty używają formatu MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  Po zmianach: /kraj admin reload
# ============================================================

country:
  name-min-length: 3
  name-max-length: 24
  description-max-length: 120
  # Minimalna odległość (w chunkach) od granic innego kraju przy zakładaniu nowego kraju.
  found-min-distance-chunks: 3
  # Światy, w których nie można zakładać krajów ani zajmować terenu, np. [world_nether, world_the_end].
  blocked-worlds: []
  # Ważność zaproszeń do kraju.
  invite-expiry-seconds: 300
  # Ważność propozycji sojuszu i pokoju.
  proposal-expiry-seconds: 300
  # Czas na potwierdzenie /kraj rozwiaz potwierdz i /kraj przekaz <gracz> potwierdz.
  confirm-expiry-seconds: 30
  # Paleta kolorów losowanych dla nowych krajów (nieużyte kolory mają pierwszeństwo).
  default-colors:
    - "#E53935"
    - "#1E88E5"
    - "#43A047"
    - "#FDD835"
    - "#8E24AA"
    - "#F57C00"
    - "#26A69A"
    - "#F06292"
    - "#795548"
    - "#3949AB"
    - "#C0CA33"
    - "#00ACC1"

claims:
  # Limit chunków = base + per-member × gracze-członkowie + per-npc-citizen × obywatele NPC (Ludnosc, w dół),
  # ale nie więcej niż max (0 = bez twardego limitu). Kraje NPC nie mają graczy: base + ludność.
  base: 16
  per-member: 8
  per-npc-citizen: 0.25
  max: 300
  # Planista Ludności (budowa i przebudowa miasta) może dla kraju NPC zająć tyle chunków ponad limit
  # (-1 = bez limitu). Kraje graczy zawsze mają zwykły limit.
  npc-planner-bonus: 64

spawn:
  # /kraj spawn — teleport do punktu spawnu stolicy.
  enabled: true
  # Odliczanie przed teleportem (ruch anuluje). Admini teleportują się od razu.
  warmup-seconds: 5

protection:
  enabled: true
  # true = obcy (nie-członkowie) NIE mogą tego robić na terenie kraju.
  block-break: true
  block-place: true
  containers: true          # skrzynie, beczki, piece, lejki, shulkery, półki, pulpity, szafy grające...
  doors: true               # drzwi i klapy
  fence-gates: true         # furtki
  buttons: true             # przyciski i dźwignie
  pressure-plates: true     # płyty naciskowe
  buckets: true             # wylewanie i nabieranie wiader
  fire: true                # rozpalanie ognia, podpalanie TNT
  animals: true             # bicie, strzyżenie, smycze, łapanie do wiadra
  decorations: true         # ramy, obrazy, stojaki na zbroję, kryształy, łodzie i wagoniki
  other-interactions: true  # przekaźniki, komparatory, bloki nutowe, ciasta, doniczki, tabliczki, kowadła, łóżka, kotły, ogniska...
  # Sojusznicy mogą używać drzwi, klap i furtek.
  allies-use-doors: true
  # --- obejścia ---
  explosions: false               # false = wybuchy (TNT, creepery...) nie niszczą terenu krajów
  # Wyjątek: zweryfikowane TNT własnego kraju niszczy własny teren oraz aktywnie oblegany teren wroga.
  # Nie odblokowuje creeperów, obcych krajów neutralnych, kontenerów ani chronionych obszarów.
  player-tnt: true
  fire-spread-from-outside: false # false = ogień nie wchodzi do kraju z zewnątrz
  pistons-across-border: false    # false = tłoki nie przesuwają bloków przez granicę
  liquids-across-border: false    # false = woda i lawa nie wpływają do cudzego kraju
  hoppers-across-border: false    # false = lejki nie wyciągają przedmiotów z kraju przez granicę
  dispensers-across-border: false # false = dozowniki nie działają w cudzy kraj
  # Odstęp między komunikatami o braku uprawnień (ms).
  deny-message-cooldown-ms: 1500

border:
  # Komunikat przy przekraczaniu granicy (sprawdzane tylko przy zmianie chunka).
  enabled: true
  display: TITLE   # TITLE albo ACTIONBAR
  title-fade-in-ticks: 5
  title-stay-ticks: 30
  title-fade-out-ticks: 10
  # Dźwięk przy wejściu na teren kraju (klucze jak w /playsound, pusty = bez dźwięku).
  # "enemy" gra przy wejściu na teren wroga (wojna) albo do oblężonego chunka.
  # Ten sam dźwięk gra najwyżej raz na cooldown-seconds (chodzenie po granicy nie spamuje).
  sound:
    enter: "block.note_block.chime"
    enter-volume: 0.35
    enter-pitch: 1.2
    enemy: "event.raid.horn"
    enemy-volume: 0.15
    enemy-pitch: 1.0
    cooldown-seconds: 6

map:
  # Integracja ze squaremap (jeśli zainstalowany).
  enabled: true
  layer-name: "Kraje"
  layer-default-hidden: false
  layer-priority: 5
  layer-z-index: 5
  fill-opacity: 0.55
  stroke-weight: 4
  stroke-opacity: 1.0
  show-capitals: true
  # Odświeżenie mapy po zmianie (debounce, w tickach; 40 = 2 s).
  refresh-debounce-ticks: 40
  # HTML. Placeholdery: {name} {npc} {color} {description} {ruler} {advisors} {members} {chunks} {blocks}
  # {area} {capital} {founded} {allies} {wars} {population} {housing} {soldiers}
  # {overlord} {until} (suweren i koniec wasalstwa) {vassals}
  # {era} (ikona i nazwa epoki w kolorze), {era_icon} (sama ikona), {progress} (postęp do następnej epoki, np. 52%) —
  # tylko z pluginem Postep (bez niego: puste / —). {name} to nazwa z tytułem epoki (era-titles).
  # {union} (kraj-partner unii personalnej) {monarch} (wspólny władca) {embassies} (→ ambasady za granicą, ← ambasady u nas)
  # {extra} (tylko popup) = linie popup-npc / popup-era / popup-population / popup-army / popup-vassal / popup-vassals /
  # popup-union / popup-embassies / popup-siege, gdy są dane.
  # Szablon bez {npc} dostaje dopisek NPC zaraz po nazwie; popup bez {extra} — linie przed ostatnim </div>.
  hover-tooltip: "<span style=\"font-size:15px;font-weight:bold;color:{color}\">{name}</span><br>Władca: {ruler} • {area}"
  popup: >-
    <div style="min-width:180px">
    <span style="font-size:15px;font-weight:bold;color:{color}">{era_icon} {name}</span><br>
    <i>{description}</i><br>
    <b>Władca:</b> {ruler}<br>
    <b>Doradcy:</b> {advisors}<br>
    <b>Obywatele:</b> {members}<br>
    <b>Powierzchnia:</b> {area}<br>
    <b>Stolica:</b> {capital}<br>
    <b>Sojusze:</b> {allies}<br>
    <b>Wojny:</b> {wars}<br>
    <b>Założony:</b> {founded}<br>
    {extra}
    </div>
  npc-suffix: " (NPC)"
  popup-npc: "<i>Kraj NPC — rządzi nim SI</i><br>"
  popup-era: "<b>Epoka:</b> {era} • postęp: {progress}<br>"
  popup-population: "<b>Ludność:</b> {population} (mieszkania: {housing})<br>"
  popup-army: "<b>Żołnierze:</b> {soldiers}<br>"
  popup-vassal: "<b>Wasal:</b> {overlord} (do {until})<br>"
  popup-vassals: "<b>Wasale:</b> {vassals}<br>"
  popup-union: "<b>Unia personalna:</b> z {union} • wspólny władca: {monarch}<br>"
  popup-embassies: "<b>Ambasady:</b> {embassies}<br>"
  popup-siege: "<b style=\"color:#C0392B\">⚔ Oblężenie</b> przy {x}, {z}<br>"
  # Osobna warstwa z oblężeniami (czerwona ramka chunka + ikona ⚔). Placeholdery: {attacker} {defender} {progress} {time} {x} {z}
  siege-layer-name: "Oblężenia"
  siege-tooltip: "<b>⚔ Oblężenie</b><br>{attacker} oblega {defender}<br>Postęp: {progress}% • zostało {time}"
  # Plik kraje.json w katalogu web squaremapa (dla panelu bocznego strony), zapisywany przy każdym odświeżeniu mapy.
  export-json: true

# Adres mapy w przeglądarce (np. https://mapa.example.org). Pusty = nie pokazuj linku.
map-url: ""

# ============================================================
#  Ekonomia — działa tylko z pluginem Skarbiec (bez niego: koszty 0, brak podatków i skarbca).
#  Kwoty w miedziakach: 1 sr = 10 md, 1 zł = 100 md.
# ============================================================
economy:
  enabled: true
  # Założenie kraju (płaci gracz: konto bankowe, a gdy brak — monety z ekwipunku).
  found-cost: 500
  # Zajęcie chunka ze skarbca kraju: claim-cost-base + claim-cost-per-chunk × obecna liczba chunków.
  claim-cost-base: 50
  claim-cost-per-chunk: 5
  # Dzienne utrzymanie: upkeep-per-chunk × (chunki − upkeep-free-chunks).
  upkeep-per-chunk: 2
  upkeep-free-chunks: 1
  # Brak pieniędzy na utrzymanie = dzień bankructwa. Po grace-days takich dniach z rzędu kraj codziennie traci
  # bankruptcy-chunks-per-day chunków najdalszych od stolicy (nigdy stolicy, teren zostaje spójny).
  grace-days: 3
  bankruptcy-chunks-per-day: 2
  # Godzina dziennego rozliczenia (czas serwera). Rozliczenia przegapione podczas wyłączenia serwera są
  # nadrabiane po starcie (najwyżej max-catch-up-days ostatnich).
  daily-tick-time: "18:00"
  max-catch-up-days: 7
  # Ile ostatnich operacji pokazuje /kraj skarbiec.
  treasury-log-size: 10
  tax:
    # Najwyższy podatek dzienny od gracza, jaki może ustawić Władca (/kraj podatek).
    max: 100
    exempt-ruler: true
    # Po tylu dniach zaległości dłużnika można wyrzucić z adnotacją „za podatki” (dług przepada).
    kick-after-days: 3

war:
  # Koszt wypowiedzenia wojny (ze skarbca; bez Skarbca 0).
  declare-cost: 1000
  # Pokój można zawrzeć dopiero po tylu minutach wojny.
  min-duration-minutes: 120
  # Po zawarciu pokoju ten sam kraj może znów wypowiedzieć wojnę po tylu minutach.
  redeclare-cooldown-minutes: 720

pvp:
  # vanilla  = Kraje nie blokuje walki między graczami (domyślnie, zwykłe PvP wszędzie),
  # war-only = gracze różnych krajów walczą tylko, gdy ich kraje są w wojnie.
  mode: vanilla
  # false = członkowie tego samego kraju i sojusznicy nie mogą się ranić (w obu trybach).
  friendly-fire: true
  # war-only: czy gracze bez kraju mogą walczyć (atakować i być atakowani).
  without-country: false
  # war-only: true = w dziczy (poza krajami) walka zawsze dozwolona.
  wilderness-free: false

siege:
  enabled: true
  # Desant wymaga wojny, nadbrzeżnego chunka i własnego transportu Armia z ludźmi/wojskiem.
  landing:
    enabled: true
    # Dopłata ponad zwykły koszt oblężenia, w miedziakach.
    extra-cost: 1000
    # Liczba odłączonych przyczółków; po połączeniu ze stolicą zwalnia się miejsce.
    max-bridgeheads: 3
  # Koszt rozpoczęcia oblężenia (ze skarbca atakującego).
  cost: 500
  # Kto może zacząć oblężenie: CITIZEN, ADVISOR albo RULER.
  min-rank: ADVISOR
  max-duration-minutes: 30
  # Czas zdobycia przy przewadze 1 (np. 1 gracz bez obrońców). Większa przewaga = szybciej, do max-speed-multiplier.
  capture-seconds: 300
  max-speed-multiplier: 3.0
  # Oblegany chunk musi przylegać do terenu atakującego.
  require-adjacent: true
  # false = stolicę można oblegać tylko, gdy to ostatni chunk kraju (zdobycie ostatniego chunka = upadek kraju).
  capital-anytime: false
  # Sojusznicy pomagają (liczą się do siły i mogą budować w oblężonym chunku).
  allies-help: true
  # Pasek oblężenia widzą uczestnicy w tym promieniu (chunki) i każdy w oblężonym chunku.
  bossbar-radius-chunks: 6
  map-refresh-seconds: 15
  # Co atakujący mogą robić w oblężonym chunku (nazwy jak w ochronie: BLOCK_BREAK, BLOCK_PLACE, DOORS,
  # FENCE_GATES, BUTTONS, PRESSURE_PLATES, CONTAINERS, BUCKETS, FIRE, ANIMALS, DECORATIONS, OTHER).
  build:
    allowed-actions: [BLOCK_BREAK, BLOCK_PLACE, DOORS, FENCE_GATES, BUTTONS, PRESSURE_PLATES]
    # Bloki, których nie wolno niszczyć ani stawiać (nazwy bloków albo #tagi).
    excluded-blocks: ["#shulker_boxes", "#beds", ENDER_CHEST, BEACON, SPAWNER, TRIAL_SPAWNER, VAULT, LECTERN, JUKEBOX, CHISELED_BOOKSHELF, DECORATED_POT]
    # true = żadnych kontenerów (skrzynie, beczki, piece, lejki...).
    exclude-containers: true
  # Oblężenia „w tle” państw NPC (Armia, ai.conquest): bitwa liczona abstrakcyjnie, gdy w pobliżu nie ma graczy.
  # Te same zasady zdobycia co zwykłe oblężenie (wojna, spójność, stolica dopiero jako ostatni chunk, łupy, upadek).
  abstract:
    enabled: true
    # Wyprawa lądowa na odległego wroga zakłada przyczółek (limit jak desanty: landing.max-bridgeheads).
    expeditions: true
    # Dopłata za wyprawę ponad koszt oblężenia (md).
    expedition-extra-cost: 500
    # false = ziemi krajów graczy nie da się zdobyć w tle (tylko fizycznie, przy graczach). Wymaga też Armia
    # ai.conquest.abstract-vs-players: true.
    allow-player-countries: false
    # Odmowa, gdy gracz jest w tym promieniu (chunki) od celu — wtedy walka fizyczna.
    player-block-radius-chunks: 8

npc:
  # Kraje NPC (Armia): czy gracze mogą do nich dołączać (/kraj dolacz bez zaproszenia).
  players-can-join: false

# ============================================================
#  Przywracanie terenu: /kraj admin przywroc (wymaga WorldEdit)
# ============================================================
# Chunki są generowane od nowa z ziarna świata (oryginalny teren), porcjami na głównym wątku.
# WorldEdit generuje każdą porcję synchronicznie w tymczasowym świecie: serwer stoi w tym czasie (pomiar: ok. 2 s
# stałego kosztu na porcję + ok. 0,5 s na chunk, czyli porcja 4 chunków ≈ 4 s przycinki). Duże kraje przywracaj
# poza godzinami gry.
restore:
  # Chunki w jednej porcji (1–16). Większa porcja = szybciej w sumie, ale dłuższa jednorazowa przycinka.
  chunks-per-batch: 4
  # Przerwa między porcjami (ticki, 20 = 1 s) — serwer i gracze odpoczywają między regeneracjami.
  pause-ticks: 20
  # Szacowany czas jednego chunka (ms) do podglądu, zanim plugin zmierzy prawdziwy (potem liczy z pomiaru).
  estimated-ms-per-chunk: 1000
  # /kraj admin usun <kraj> przywroc: ile ticków po usunięciu kraju zaczyna się regeneracja
  # (czas na sprzątanie Ludnosc/Armia po CountryDisbandEvent).
  delete-delay-ticks: 60
  # Co ile procent komunikat o postępie.
  progress-step-percent: 10

# ============================================================
#  Podbój: łupy i obywatele upadłego kraju
# ============================================================
conquest:
  # Łupy (tylko ze Skarbcem; transfer między skarbcami z wpisem w historii obu krajów).
  # Przy każdym zdobytym chunku zwycięzca zabiera taki ułamek AKTUALNEGO skarbca obrońcy (0.05 = 5 %, w dół do miedziaka).
  loot-per-chunk: 0.05
  # Upadek kraju (zdobycie ostatniego chunka): po łupie za chunk zwycięzca zabiera jeszcze taki ułamek tego, co zostało.
  loot-on-fall: 0.75
  # Reszta skarbca upadłego kraju: destroy = przepada, members = po równo na konta bankowe byłych członków-graczy.
  fall-remainder: destroy
  # Byli obywatele-gracze upadłego kraju dostają zaproszenie do kraju zwycięzcy (zapisywane, działa też dla graczy
  # offline — dostaną je po wejściu). Do zwycięzcy NPC tylko przy npc.players-can-join: true.
  citizen-invites: true
  citizen-invite-hours: 24

disband:
  # Skarbiec kraju rozwiązanego bez wojny (/kraj rozwiaz, /kraj admin usun, API) — tylko ze Skarbcem:
  # ruler = na konto bankowe władcy, members = po równo na konta członków-graczy, destroy = przepada.
  # Kraj NPC (brak gracza) — zawsze przepada.
  treasury: ruler

# ============================================================
#  Kapitulacja i wasalstwo
# ============================================================
vassal:
  enabled: true
  # Dzienny trybut wasala = tribute-share × dzienny przychód z podatków (gracze + obywatele NPC z Ludnosc),
  # ale nie mniej niż tribute-min (miedziaki). Pobierany przy dziennym rozliczeniu; brak pieniędzy = dług.
  tribute-share: 0.25
  tribute-min: 20
  # Długość wasalstwa w dniach: domyślna (/kraj kapitulacja <wróg> bez dni) i dozwolony zakres.
  default-days: 7
  min-days: 1
  max-days: 30
  # Ważność oferty kapitulacji.
  offer-expiry-seconds: 300
  # Wykup (/kraj wykup) = buyout-multiplier × (dzienny trybut × pozostałe dni) + dług.
  buyout-multiplier: 1.5
  # Po tylu dniach długu suweren może wypowiedzieć wasalowi wojnę bez kosztu i bez przerwy po pokoju.
  debt-war-days: 3
  # Ograniczenia wasala.
  forbid-war-on-overlord: true
  forbid-war-on-overlord-allies: true
  forbid-alliance-with-overlord-enemies: true
  # true = suweren może zaatakować własnego wasala tylko za zaległy trybut (debt-war-days).
  overlord-war-only-for-debt: true
  # Wasal dostaje powiadomienie, gdy jego suweren wchodzi w wojnę; auto-join = automatycznie dołącza do tej wojny.
  notify-overlord-wars: true
  auto-join-overlord-wars: false

# ============================================================
#  Unia personalna — dwa suwerenne kraje z jednym wspólnym władcą
# ============================================================
# Każdy kraj zachowuje swój teren, skarbiec, obywateli i prawa. Kraje unii są sprzymierzone i nie mogą ze sobą walczyć.
# Wspólnym władcą zostaje władca kraju, który zaproponował unię; dotychczasowy władca partnera zostaje Doradcą (namiestnikiem).
union:
  enabled: true
  # Unia gracza z krajem NPC (kraj NPC zostaje pod zarządem SI, wspólny władca jest tam tylko tytularny).
  allow-npc: true
  # true = Kraje od razu odrzuca unię w imieniu kraju NPC; false = odpowiada SI kraju NPC (Armia, UnionProposalEvent):
  # tylko sojusznik o wysokiej opinii; monarcha jest tytularny — kraj NPC zachowuje skarbiec, ziemię, wojsko i zarząd SI.
  npc-auto-refuse: false
  proposal-expiry-seconds: 300
  # Koszt zawarcia (md, ze skarbca kraju wspólnego władcy, przy przyjęciu).
  form-cost: 2000
  # Unię można zerwać komendą dopiero po tylu godzinach; zrywający płaci break-cost (md) ze swojego skarbca.
  min-duration-hours: 72
  break-cost: 1000
  # Przerwa przed ponowną unią tych samych krajów (pamięć serwera; restart ją kasuje).
  reform-cooldown-hours: 48
  # Namiestnik (dawny władca partnera) może zerwać unię (secesja) — tak samo po min-duration-hours i za break-cost.
  regent-can-secede: true
  # Wojna wypowiedziana jednemu krajowi unii wciąga partnera jako obrońcę (o ile nie ma z agresorem sojuszu/wasalstwa).
  defend-partner: true
  # Wojna wypowiedziana PRZEZ kraj unii wciąga też partnera (atak).
  join-offensive-wars: false
  # Po końcu unii kraje zostają w sojuszu (false = relacja neutralna).
  keep-alliance-after: true
  # Hak handlowy dla innych pluginów (KrajeApi#getTradeBonus): premia między krajami unii (0.10 = +10%).
  trade-bonus: 0.10

# ============================================================
#  Ambasady graczy — jeden chunk na ziemi innego kraju
# ============================================================
# Chunk zostaje terenem gospodarza (mapa, limit), ale budować mogą na nim tylko członkowie kraju-gościa.
# Gospodarz nie może go porzucić; ambasada zamyka się przy wojnie, utracie chunka, rozwiązaniu kraju albo wydaleniu.
embassy:
  enabled: true
  # Relacje, w których wolno otworzyć ambasadę (NEUTRAL, ALLIANCE; WAR nigdy).
  allowed-relations: [NEUTRAL, ALLIANCE]
  # Limity: ambasady jednego kraju za granicą / ambasady goszczone przez jeden kraj (0 = bez limitu).
  max-per-country: 3
  max-hosted: 5
  # Czy chunk stolicy gospodarza może być ambasadą.
  allow-capital: false
  # Opłata (md) ze skarbca gościa do skarbca gospodarza przy otwarciu.
  open-cost: 300
  request-expiry-seconds: 300
  # Wydalenie (/kraj ambasada wydal): ambasada zamyka się po tylu godzinach (0 = od razu).
  expel-notice-hours: 24
  # Ranga potrzebna do otwierania/zamykania ambasad (RULER, ADVISOR, CITIZEN) i do teleportu.
  min-rank: RULER
  tp-min-rank: CITIZEN
  # true = Kraje decyduje sam (przyjmuje przy relacjach z npc-accept-relations). false = odpowiada SI kraju NPC (Armia,
  # EmbassyRequestEvent) po ok. 1 s według osobowości, opinii i nastawienia; bez Armii prośba wygasa po request-expiry-seconds.
  npc-auto-decide: false
  npc-accept-relations: [ALLIANCE]
  # Hak handlowy (KrajeApi#getTradeBonus): premia, gdy istnieje ambasada w którąkolwiek stronę.
  trade-bonus: 0.05
  # Wspólne projekty innych pluginów (np. droga do innego kraju, KrajeApi#canStartJointProject):
  # unia zawsze; poza tym min. jakość relacji (NEUTRAL, VASSALAGE, ALLIANCE) + ambasada.
  joint-projects:
    min-relation: NEUTRAL
    # true = budujący musi mieć własną ambasadę u celu; false = wystarczy ambasada w którąkolwiek stronę.
    require-own-embassy: false

# Tytuły zależne od epoki (plugin Postep): w wyświetlaniu (tablista, komunikaty, /kraj info, mapa, czat) początek
# nazwy kraju jest zamieniany według epoki, np. w Nowoczesności "Królestwo_Mazowsza" → "Rzeczpospolita_Mazowsza".
# Prawdziwa nazwa (komendy, podpowiedzi, API, pliki) się nie zmienia. Zamiany są kumulowane: kraj w epoce 4 próbuje
# listy 4, potem 3, 2, 1; wygrywa pierwszy pasujący początek (bez rozróżniania wielkości liter, po nim koniec, spacja
# albo _). Epoki: 1 Średniowiecze, 2 Renesans, 3 Epoka przemysłowa, 4 Nowoczesność. Bez Postep nic się nie zmienia.
era-titles:
  enabled: true
  # true = tylko kraje NPC (gracze sami wybrali nazwy swoich krajów)
  npc-only: true
  replacements:
    "3":
      Cesarstwo: "Imperium"
    "4":
      Królestwo: "Rzeczpospolita"
      Księstwo: "Republika"
      Wielkie Księstwo: "Republika"
      Hrabstwo: "Republika"
      Margrabstwo: "Republika"
      Cesarstwo: "Federacja"
      Imperium: "Federacja"
      Kaganat: "Republika"
      Chanat: "Republika"

tablist:
  enabled: true
  # Styl tablisty:
  #   extended – rozbudowana (domyślnie): nagłówek i stopka z list linii w sekcji "extended" poniżej, AFK, epoka,
  #              saldo, pora roku, nowości i wskazówki. Stary config bez tego klucza też dostaje ten styl.
  #   classic  – dawny wygląd: klucze format / no-country-format / header / footer / footer-map-line / refresh-ticks.
  style: extended
  # Grupowanie po kraju i randze (Player#setPlayerListOrder). Dotyczy obu stylów.
  sort: true

  # ---- styl classic (dawny) ----
  # Nazwa gracza w tabie. Placeholdery: <country> <color>...</color> <player> <rank> <rank_icon> <afk>
  # oraz z pluginem Postep: <era_icon> (kolorowa ikona epoki kraju ze spacją, np. "⚜ ") i <era> (plakietka, np. "⚜ Renesans").
  # Bez Postep oba są puste. Gdy format aktywnego stylu zawiera <era> albo <era_icon>, Postep sam przestaje dopisywać ikonę.
  format: "<rank_icon><era_icon><color>[<country>]</color> <white><player>"
  # Gracz bez kraju. Pusty tekst = sam nick bez tagu.
  no-country-format: "<gray>[Dzicz]</gray> <white><player>"
  # Placeholdery nagłówka i stopki: <online> <max> <player> <country> <map_url> <map_link>
  header: "<gold><bold>MEDIVALRPG</bold></gold><newline><gray>Kraje świata</gray>"
  footer: "<gray>Graczy: <white><online>/<max></white> • Twój kraj: <country></gray>"
  # Dopisywane do stopki, tylko gdy ustawiono map-url.
  footer-map-line: "<newline><gray>Mapa: <aqua><underlined><map_link></underlined></aqua></gray>"
  # Odświeżanie licznika graczy (ticki; 100 = 5 s). Zmiany krajów odświeżają tab od razu.
  refresh-ticks: 100

  # ---- styl extended (rozbudowany) ----
  extended:
    # Co ile ticków przeliczać tablistę (20 = 1 s; min. 20). Pakiety idą tylko, gdy treść gracza się zmieniła.
    refresh-ticks: 40
    # Ile sekund trzymać w pamięci dane z innych pluginów (saldo, epoka, pora roku, nazwa kraju).
    cache-seconds: 5
    # Nazwa gracza na liście. Placeholdery: <afk> <rank_icon> <rank> <era_icon> <era> <color>...</color> <country> <player>
    name-format: "<afk><rank_icon><era_icon><color>[<country>]</color> <white><player>"
    no-country-name-format: "<afk><gray>[Dzicz]</gray> <white><player>"
    # Znacznik AFK (wstawiany w <afk>) i czas bez ruchu/obrotu/czatu/komendy/interakcji. 0 = bez wykrywania AFK.
    afk-tag: "<gray>[AFK]</gray> "
    afk-seconds: 300
    # Linie nagłówka i stopki (MiniMessage). Placeholdery:
    #   <player> <online> <max> <afk_count> <ping> <tps> <date> <game_time> <game_day>
    #   <season> <season_icon> <season_day> <season_days>   (pora roku z pluginu Ludnosc)
    #   <country> <rank> <rank_icon> <era> <era_icon>       (kraj gracza; epoka z pluginu Postep)
    #   <balance>                                           (saldo konta gracza w Skarbcu)
    #   <news>                                              (tytuł ostatniej nowości z pluginu Nowosci)
    #   <tip>                                               (rotująca wskazówka z listy "tips")
    #   <map_link> <map_url> <panel_link> <panel_url>
    # Linia, której dane są niedostępne (np. brak Ludnosc → brak pory roku), znika. Fragment w [[ ... ]] jest
    # opcjonalny: znika sam, a reszta linii zostaje. Pusta linia "" zostaje (odstęp).
    header:
      - ""
      - "<gradient:#F2D16B:#B8860B><bold>⚜ MEDIVALRPG ⚜</bold></gradient>"
      - "<gray>Graczy: <white><online></white><dark_gray>/</dark_gray><white><max></white>[[ <dark_gray>(AFK: <afk_count>)</dark_gray>]] <dark_gray>•</dark_gray> Ping: <ping> <dark_gray>•</dark_gray> TPS: <tps></gray>"
      - "<gray><date>[[ <dark_gray>•</dark_gray> <season_icon> <white><season></white> <dark_gray>(dzień <season_day>/<season_days>)</dark_gray>]]</gray>"
      - "[[<gray>Panel: <aqua><panel_link></aqua></gray>]][[ <dark_gray>•</dark_gray> <gray>Mapa: <aqua><map_link></aqua></gray>]]"
      - ""
    footer:
      - ""
      - "<gray>Kraj: <country>[[ <dark_gray>•</dark_gray> <rank_icon><white><rank></white>]][[ <dark_gray>•</dark_gray> Epoka: <era>]]</gray>"
      - "<gray>Saldo: <gold><balance></gold></gray>"
      - "<dark_gray>Nowość:</dark_gray> <white><news></white> <dark_gray>(/nowosci)</dark_gray>"
      - "<yellow>✦</yellow> <gray><tip></gray>"
      - ""
    # Link do panelu WWW (pusty = linia/fragment znika). Link do mapy to map-url (wyżej).
    panel-url: "https://panel.example.workers.dev/"
    # Data w nagłówku (<date>): strefa czasowa i wzorzec Javy (DateTimeFormatter, polskie nazwy miesięcy).
    time-zone: "Europe/Warsaw"
    date-format: "d MMMM yyyy"
    # Ikony pór roku (<season_icon>), klucze jak w pluginie Ludnosc.
    season-icons:
      wiosna: "<green>✿</green>"
      lato: "<yellow>☀</yellow>"
      jesien: "<gold>❦</gold>"
      zima: "<aqua>❄</aqua>"
    # Ostatnia nowość z pluginu Nowosci (<news>) i jej maksymalna długość w znakach.
    news: true
    news-max-length: 48
    # Wskazówki (<tip>) zmieniają się co tip-seconds; wszyscy gracze widzą tę samą. Pusta lista = linia znika.
    tip-seconds: 60
    tips:
      - "Wpisz <white>/menu</white>, aby zobaczyć wszystkie funkcje serwera."
      - "Załóż kraj albo dołącz do istniejącego: <white>/kraj</white>."
      - "Rozmawiaj tylko z rodakami na czacie kraju: <white>/kc</white>."
      - "Sojusznicy mają własny czat: <white>/ks</white>."
      - "Mapa świata z granicami krajów: <white>/mapa</white>."
      - "Co nowego na serwerze? <white>/nowosci</white>."
      - "Postęp kraju do kolejnej epoki sprawdzisz w <white>/postep</white>."

chat:
  enabled: true
  # Czat ogólny. Placeholdery: <country_tag> <player> <message> <rank_icon> <rank>
  # Treść wiadomości gracza NIE jest parsowana jako MiniMessage.
  format: "<rank_icon><country_tag> <player><gray>:</gray> <white><message>"
  # Tag kraju (z hoverem i kliknięciem). Placeholdery: <country> <color>...</color>
  country-tag: "<color>[<country>]</color>"
  no-country-tag: "<gray>[Dzicz]</gray>"
  # Hover na tagu. Placeholdery: <country> <color> <ruler> <members> <area>
  tag-hover: "<color><bold><country></bold></color><newline><gray>Władca: <white><ruler></white><newline>Obywatele: <white><members></white><newline>Powierzchnia: <white><area></white><newline><dark_gray>Kliknij, aby zobaczyć informacje</dark_gray></gray>"
  tag-click-command: "/kraj info <country>"
  # Czat krajowy (/kc, /kraj czat). Placeholdery: <country> <color> <player> <message> <rank_icon> <rank>
  country-format: "<color>[Kraj]</color> <rank_icon><white><player></white><gray>:</gray> <green><message>"
  # Czat sojuszu (/ks).
  ally-format: "<dark_aqua>[Sojusz]</dark_aqua> <color>[<country>]</color> <rank_icon><white><player></white><gray>:</gray> <aqua><message>"
  # Prefiks kopii dla adminów z /kraj admin spy i konsoli.
  spy-prefix: "<dark_gray>[Podgląd]</dark_gray> "
  log-to-console: true

# Ikony rang (czat i tablista). Pusty tekst = bez ikony.
rank-icons:
  RULER: "<gold>♛</gold> "
  ADVISOR: "<yellow>✦</yellow> "
  CITIZEN: ""

# Chorągwie krajów: własny obrazek flagi wgrywany w panelu WWW, moderowany przez administrację, pokazywany jako
# animowany model BetterModel nad stolicą i przy ambasadach (oraz przez most dla Armii: statki, dowódcy).
flags:
  enabled: true
  # Najniższa ranga, która wgrywa, wycofuje, przywraca flagę i stawia chorągiew stolicy: ADVISOR albo RULER.
  upload-rank: ADVISOR
  # UUID moderatorów (zatwierdzają flagi w panelu i w grze); admini panelu i uprawnienie kraje.flagi.moderuj też.
  moderators:
    - ff923cf7-f43c-37b8-85a3-77cbac357c9c
  upload-cooldown-seconds: 60
  history-size: 20
  image:
    max-kb: 160
    max-source-pixels: 4194304
    max-source-side: 4096
    min-width: 16
    min-height: 10
    # Tekstura w grze ma 64×40 pikseli; kolory ogranicza kwantyzacja (median cut).
    max-colors: 32
  pack:
    # Zatwierdzone flagi trafiają do paczki zasobów zbiorczo: najwyżej jedna przebudowa na tyle minut.
    min-interval-minutes: 15
    debounce-seconds: 60
    force-min-interval-seconds: 60
    # Po przebudowie nowe modele pokazują się z opóźnieniem (gracze pobierają paczkę od Interakcji).
    switch-delay-seconds: 20
    model-prefix: kraje_flaga_
    default-model: kraje_flaga_domyslna
  banners:
    capital: true
    embassy: true
    view-distance: 96
  # Ikona flagi w popupie kraju na mapie squaremap (plik w web/kraje-flagi/).
  map-icons: true
  # Sztandary w grze z zatwierdzonej flagi (albo z domyślnej w kolorze kraju). Zamawia ranga upload-rank.
  # Opłata: materiały z ekwipunku gracza + kwota ze skarbca kraju; kwota przechodzi do world:payments
  # (zamknięta pula — nic nie powstaje ani nie znika). Limit liczony na kraj i dzień (strefa time-zone).
  standards:
    enabled: true
    time-zone: Europe/Warsaw
    # A: zwykły sztandar vanilla z przybliżonym wzorem flagi (kolor tła + do 6 wzorów z krosna), /kraj flaga sztandar.
    banner:
      enabled: true
      treasury-cost: 100        # md (1 zł)
      materials: ["WOOL:6", "STICK:1"]   # WOOL = wełna w dowolnym kolorze
      daily-limit: 8
    # B: przedmiot „Sztandar kraju” z dokładnym obrazkiem flagi (model z paczki zasobów), /kraj flaga przedmiot.
    item:
      enabled: true
      treasury-cost: 500        # md (5 zł)
      materials: ["WOOL:6", "STICK:2"]
      daily-limit: 4
    placed:
      # Postawione przedmioty B (wyświetlacz + niewidzialny uchwyt, bez kolizji) na chunk.
      max-per-chunk: 4

messages:
  prefix: "<gold>[Kraje]</gold> "
  # --- chorągwie krajów (<text> = treść po polsku z pluginu) ---
  flag-notice: "<prefix><gold>⚑</gold> <yellow><text>"
  flag-ok: "<prefix><green><text>"
  flag-error: "<prefix><red><text>"
  flag-line: "<prefix><gray><text>"
  wilderness-name: "<dark_green>Dzicz</dark_green>"

  # --- ogólne ---
  players-only: "<prefix><red>Tę komendę może wykonać tylko gracz."
  no-permission: "<prefix><red>Nie masz uprawnień."
  unknown-subcommand: "<prefix><red>Nieznana komenda <white><sub></white>. Wpisz <yellow>/kraj pomoc</yellow>."
  not-in-country: "<prefix><red>Nie należysz do żadnego kraju."
  already-in-country: "<prefix><red>Należysz już do kraju. Najpierw go opuść."
  rank-required: "<prefix><red>Potrzebujesz rangi <white><rank></white>, aby to zrobić."
  country-not-found: "<prefix><red>Nie ma kraju o nazwie <white><name></white>."
  member-not-found: "<prefix><red>Gracz <white><player></white> nie jest członkiem twojego kraju."
  player-not-found: "<prefix><red>Nie znaleziono gracza <white><player></white>."
  cannot-target-self: "<prefix><red>Nie możesz tego zrobić samemu sobie."
  cannot-target-own-country: "<prefix><red>To twój własny kraj."
  no-pending-confirmation: "<prefix><red>Brak oczekującego potwierdzenia albo minął czas. Wpisz komendę ponownie."
  world-blocked: "<prefix><red>W tym świecie nie można zakładać krajów ani zajmować terenu."
  protection-denied: "<red>Ten teren należy do kraju <color><country></color>."

  # --- pomoc (/kraj, /kraj pomoc [strona]) ---
  # Jedna strona = jeden dział. Linia: składnia + krótki opis; najechanie pokazuje pełny opis i wymaganą rangę,
  # kliknięcie wpisuje komendę do czatu. Brakujące klucze biorą się z domyślnego configu w jarze.
  # help-header: <category> <page> <pages>; help-line: <syntax> <short>; help-hover: <syntax> <description> <rank>
  help-header: "<gold><bold>Kraje</bold></gold> <gray>— pomoc:</gray> <white><category></white> <dark_gray>(strona <page>/<pages>)</dark_gray>"
  help-line: "<yellow><syntax></yellow> <dark_gray>—</dark_gray> <gray><short></gray>"
  help-hover: "<yellow><syntax></yellow><newline><white><description></white><newline><newline><gray>Wymaga: <gold><rank></gold></gray><newline><dark_gray>Kliknij, aby wpisać komendę.</dark_gray>"
  # help-nav: <prev> <next>
  help-nav: "<prev> <dark_gray>|</dark_gray> <next>"
  help-prev: "<yellow>« poprzednia</yellow>"
  help-prev-disabled: "<dark_gray>« poprzednia</dark_gray>"
  help-next: "<yellow>następna »</yellow>"
  help-next-disabled: "<dark_gray>następna »</dark_gray>"
  # Hover na przyciskach i działach. Placeholdery: <category> <page>
  help-page-hover: "<gray>Strona <page>: <white><category></white>"
  # help-tabs: <tabs> (lista działów, kliknięcie przechodzi do strony; domyślny czat ma 320 px szerokości)
  help-tabs: "<tabs>"
  help-tab: "<gray><category></gray>"
  help-tab-current: "<gold><category></gold>"
  help-tab-separator: "<dark_gray> · </dark_gray>"
  help-categories:
    teren: "Teren"
    ludzie: "Ludzie"
    wyglad: "Wygląd"
    dyplomacja: "Dyplomacja"
    skarbiec: "Skarbiec"
    informacje: "Informacje"
    czat: "Czat"
    admin: "Admin"
  # short: krótki opis w linii, description: pełny opis (hover), rank: kto może użyć (hover, „Wymaga: ...”).
  help-entries:
    zaloz:
      short: "załóż kraj"
      description: "Zakłada nowy kraj. Chunk, na którym stoisz, zostaje stolicą i punktem spawnu. Nazwa: 3–24 znaki (litery, cyfry, _ i -), bez spacji. Trzeba zachować odstęp od granic innych krajów. Ze Skarbcem kosztuje (domyślnie 5 zł, z konta albo z monet)."
      rank: "gracz bez kraju"
    zajmij:
      short: "zajmij chunk, na którym stoisz"
      description: "Dołącza bieżący chunk do terytorium kraju. Musi przylegać bokiem do waszego terenu. Limit terenu rośnie z liczbą członków (i obywateli NPC). Ze Skarbcem opłata ze skarbca kraju rośnie z wielkością kraju."
      rank: "Doradca+"
    porzuc:
      short: "oddaj chunk, na którym stoisz"
      description: "Usuwa bieżący chunk z terytorium kraju. Nie można porzucić stolicy ani przeciąć terytorium na dwie części."
      rank: "Doradca+"
    stolica:
      short: "przenieś stolicę tutaj"
      description: "Przenosi stolicę i punkt spawnu kraju na chunk, na którym stoisz (musi należeć do twojego kraju)."
      rank: "Władca"
    spawn:
      short: "teleport do stolicy"
      description: "Teleportuje cię do spawnu stolicy po krótkim odliczaniu. Ruch anuluje teleport."
      rank: "członek kraju"
    zapros:
      short: "zaproś gracza do kraju"
      description: "Wysyła graczowi bez kraju zaproszenie z klikalnym przyciskiem [Dołącz]. Zaproszenie wygasa po kilku minutach."
      rank: "Doradca+"
    dolacz:
      short: "dołącz do kraju z zaproszenia"
      description: "Dołącza do kraju, z którego masz ważne zaproszenie — także zaproszenie od zwycięzcy, gdy twój kraj upadł (ważne 24 h, czeka na ciebie również po wyjściu z gry)."
      rank: "gracz bez kraju"
    odrzuc:
      short: "odrzuć zaproszenie do kraju"
      description: "Odrzuca zaproszenie do wskazanego kraju (zwykłe albo po upadku twojego kraju). Jego władze dostaną informację."
      rank: "gracz bez kraju"
    opusc:
      short: "opuść swój kraj"
      description: "Opuszczasz kraj. Władca musi najpierw przekazać władzę albo rozwiązać kraj."
      rank: "członek kraju"
    wyrzuc:
      short: "wyrzuć członka"
      description: "Wyrzuca członka kraju o niższej randze niż twoja."
      rank: "Doradca+"
    awansuj:
      short: "nadaj rangę Doradcy"
      description: "Nadaje Obywatelowi rangę Doradcy (zajmowanie terenu, zaproszenia, wyrzucanie, opis)."
      rank: "Władca"
    degraduj:
      short: "odbierz rangę Doradcy"
      description: "Odbiera Doradcy rangę, zostaje Obywatelem."
      rank: "Władca"
    przekaz:
      short: "przekaż władzę"
      description: "Przekazuje władzę nad krajem innemu członkowi. Wymaga potwierdzenia: kliknij [Potwierdź] albo dopisz „potwierdz”. Dawny władca zostaje Doradcą."
      rank: "Władca"
    rozwiaz:
      short: "rozwiąż kraj"
      description: "Rozwiązuje kraj na zawsze: teren wraca do dziczy, członkowie tracą kraj, a skarbiec trafia do władcy (albo według configu: do członków lub przepada). Wymaga potwierdzenia (/kraj rozwiaz potwierdz)."
      rank: "Władca"
    kolor:
      short: "zmień kolor kraju"
      description: "Ustawia kolor kraju na mapie, w tabliście i na czacie. Podaj #RRGGBB (np. #E53935) albo nazwę: czerwony, niebieski, zloty..."
      rank: "Władca"
    opis:
      short: "ustaw opis kraju"
      description: "Ustawia opis widoczny w /kraj info i na mapie WWW. „/kraj opis -” czyści opis."
      rank: "Doradca+"
    flaga:
      short: "chorągiew kraju — stan i pomoc"
      description: "Pokazuje flagę kraju (domyślna w kolorze kraju albo własna), flagę czekającą na zatwierdzenie i powód ostatniego odrzucenia. Własny obrazek (PNG/JPG) wgrywa się w panelu WWW (/panel → Chorągiew kraju); trafia do gry dopiero po akceptacji administracji i przebudowie paczki zasobów."
      rank: "członek (zarządzanie: Doradca+)"
    flaga-postaw:
      short: "postaw chorągiew stolicy tutaj"
      description: "Przenosi animowaną chorągiew stolicy w miejsce, w którym stoisz (na ziemi własnego kraju). /kraj flaga auto przywraca miejsce automatyczne: przy dzwonie wioski, przy punkcie spawnu albo w środku stolicy."
      rank: "Doradca+"
    flaga-domyslna:
      short: "wróć do domyślnej flagi"
      description: "Przywraca domyślną chorągiew w kolorze kraju (od razu w grze). Wcześniej zatwierdzone flagi zostają w historii."
      rank: "Doradca+"
    flaga-sztandar:
      short: "sztandar z wzorem flagi (barwniki)"
      description: "Wydaje zwykły sztandar z wzorem możliwie bliskim flagi kraju (kolor tła i do 6 wzorów z krosna, dobranych automatycznie z zatwierdzonego obrazka; bez obrazka — z koloru kraju). Można go postawić, przybić do tarczy i dać wojsku. Opłata: materiały z ekwipunku i kwota ze skarbca kraju; dzienny limit na kraj. /kraj flaga sztandar podglad pokazuje wzór bez wydawania."
      rank: "Doradca+"
    flaga-przedmiot:
      short: "przedmiot „Sztandar kraju” z obrazkiem"
      description: "Wydaje przedmiot „Sztandar kraju” z dokładnym zatwierdzonym obrazkiem flagi (model z paczki zasobów). Trzymasz go w ręce, PPM na bloku stawia go jako dekorację (nie blokuje przejścia, zostaje po restarcie), Shift + PPM zabiera. Opłata: materiały i kwota ze skarbca kraju; dzienny limit na kraj."
      rank: "Doradca+"
    flaga-historia:
      short: "historia flag i przywracanie"
      description: "Lista wgranych, zatwierdzonych, odrzuconych i przywróconych flag. Kliknięcie [Przywróć] wraca do wcześniej zatwierdzonej flagi bez ponownej moderacji (/kraj flaga przywroc <id>)."
      rank: "Doradca+"
    sojusz:
      short: "zaproponuj lub przyjmij sojusz"
      description: "Wysyła propozycję sojuszu. Gdy druga strona wpisze to samo, sojusz zostaje zawarty. Nie można sprzymierzyć się z wrogiem."
      rank: "Władca"
    wojna:
      short: "wypowiedz wojnę"
      description: "Wypowiada wojnę (zrywa ewentualny sojusz). Ogłoszenie widzi cały serwer. Ze Skarbcem kosztuje (skarbiec kraju). Po pokoju ponowna wojna z tym samym krajem dopiero po przerwie."
      rank: "Władca"
    pokoj:
      short: "zaproponuj lub przyjmij pokój"
      description: "Wysyła propozycję pokoju krajowi, z którym toczycie wojnę. Pokój zapada, gdy obie strony go zaproponują (kraj NPC odpowiada sam). Wojna musi trwać minimalny czas (domyślnie 2 h)."
      rank: "Władca"
    zerwij:
      short: "zerwij sojusz"
      description: "Zrywa sojusz, relacja wraca do neutralnej."
      rank: "Władca"
    kapitulacja:
      short: "skapituluj przed wrogiem"
      description: "W czasie wojny oferuje wrogowi kapitulację: po przyjęciu wojna od razu się kończy, a wasz kraj zostaje jego wasalem na podaną liczbę dni (domyślnie 7). Wasal płaci codziennie trybut (25% podatków, min. 20 md), nie może walczyć z suwerenem ani jego sojusznikami i nie może sprzymierzyć się z jego wrogami."
      rank: "Władca"
    kapitulacja-przyjmij:
      short: "przyjmij kapitulację (albo: odrzuc)"
      description: "Przyjmuje ofertę kapitulacji wroga — zostaje on waszym wasalem i płaci trybut. „/kraj kapitulacja odrzuc <kraj>” odrzuca ofertę (wojna trwa dalej). Przyciski są też w samej wiadomości z ofertą."
      rank: "Władca"
    wasale:
      short: "suweren i wasale"
      description: "Pokazuje suwerena twojego kraju (do kiedy, trybut, dług, koszt wykupu) i listę waszych wasali. Z nazwą: dowolny kraj."
      rank: "każdy"
    wykup:
      short: "wykup się z wasalstwa"
      description: "Kończy wasalstwo przed czasem: skarbiec płaci suwerenowi mnożnik × pozostały trybut (dzienny trybut × pozostałe dni) plus dług. Wymaga potwierdzenia i Skarbca."
      rank: "Władca (wasal)"
    zwolnij:
      short: "zwolnij wasala"
      description: "Zwalnia wasala przed czasem (jego dług przepada)."
      rank: "Władca (suweren)"
    unia-zaproponuj:
      short: "zaproponuj unię personalną"
      description: "Proponuje unię personalną: zostajesz wspólnym władcą obu krajów, a dotychczasowy władca drugiego kraju jego namiestnikiem (Doradcą). Każdy kraj zachowuje teren, skarbiec, obywateli i prawa; kraje są sprzymierzone. Wasal nie może zawrzeć unii. Zerwanie: <yellow>/kraj unia zerwij</yellow> (po minimalnym czasie, płatne). Rządzenie drugim krajem: <yellow>/kraj unia rzadz</yellow>."
      rank: "Władca"
    unia-przyjmij:
      short: "przyjmij unię (albo: odrzuc)"
      description: "Przyjmuje propozycję unii personalnej — władca tamtego kraju zostanie także waszym władcą, a ty namiestnikiem. Odrzucenie: <yellow>/kraj unia odrzuc \\<kraj></yellow>."
      rank: "Władca"
    unia-info:
      short: "unia personalna kraju"
      description: "Pokazuje unię: kraje, wspólnego władcę, namiestnika i od kiedy można ją zerwać. Także <yellow>/kraj unia zerwij</yellow> (wspólny władca albo namiestnik) i <yellow>/kraj unia rzadz</yellow> (wspólny władca przełącza, którym krajem rządzi komendami)."
      rank: "każdy"
    ambasada-otworz:
      short: "poproś o ambasadę tutaj"
      description: "Stań na ziemi innego kraju (pokój albo sojusz) i poproś o ambasadę na tym chunku. Władca gospodarza musi się zgodzić; opłata trafia do jego skarbca. Na chunku ambasady budują tylko twoi rodacy. Zamknięcie: <yellow>/kraj ambasada zamknij \\<kraj></yellow>."
      rank: "Władca"
    ambasada-lista:
      short: "ambasady kraju"
      description: "Ambasady twojego kraju za granicą i ambasady u was, z przyciskami teleportu i wydalenia. Gospodarz wydala ambasadę komendą <yellow>/kraj ambasada wydal \\<kraj></yellow> (z okresem wypowiedzenia); wojna zamyka ambasady od razu."
      rank: "każdy"
    ambasada-tp:
      short: "teleport do ambasady"
      description: "Teleport do punktu dyplomaty w waszej ambasadzie w danym kraju (odliczanie jak przy /kraj spawn)."
      rank: "członek"
    oblezenie:
      short: "oblegaj chunk wroga"
      description: "Rozpoczyna oblężenie chunka, na którym stoisz: kraj wroga (wojna), chunk przylega do waszego terenu. Postęp rośnie, gdy w chunku jest więcej atakujących (gracze i żołnierze) niż obrońców, maleje przy przewadze obrońców. Zdobyty chunk przechodzi do was. Jedno oblężenie na kraj, max 30 min, kosztuje (Skarbiec)."
      rank: "Doradca+"
    desant:
      short: "zdobądź przyczółek morski"
      description: "Stań na nadbrzeżnym chunku wroga podczas wojny po przybyciu własnym statkiem. Rozpoczyna płatne oblężenie bez wymogu wspólnej granicy. Wygrana daje trwały przyczółek, z którego można dalej zajmować ziemię. Limit i dopłata są w konfiguracji. Obowiązują normalna obrona, ochrona stolicy i jedno oblężenie na kraj."
      rank: "Doradca+"
    oblezenia:
      short: "trwające oblężenia"
      description: "Lista wszystkich trwających oblężeń z postępem i pozostałym czasem."
      rank: "każdy"
    skarbiec:
      short: "stan skarbca kraju"
      description: "Stan skarbca, podatek, dzienne utrzymanie, koszt następnego chunka i ostatnie operacje. Wymaga pluginu Skarbiec."
      rank: "członek kraju"
    wplac:
      short: "wpłać do skarbca"
      description: "Wpłaca kwotę do skarbca kraju: z konta bankowego, a gdy go brak — z monet w ekwipunku. Dopisz „konto” albo „monety”, aby wybrać źródło. Kwota: 150 (miedziaki), 3zl, 2sr."
      rank: "członek kraju"
    wyplac:
      short: "wypłać ze skarbca"
      description: "Przelewa kwotę ze skarbca kraju na twoje konto bankowe."
      rank: "Władca"
    podatek:
      short: "podatek od obywateli"
      description: "Bez kwoty: obecny podatek i dłużnicy. Z kwotą: ustawia dzienny podatek od każdego obywatela-gracza, pobierany z konta bankowego o stałej godzinie (0 = brak). Kto nie zapłaci, ma dług; po kilku dniach zaległości można go wyrzucić."
      rank: "Władca (ustawianie)"
    info:
      short: "informacje o kraju"
      description: "Władca, doradcy, obywatele, powierzchnia i limit terenu, stolica, sojusze, wojny, data założenia, a jeśli są: skarbiec i podatki, ludność, żołnierze i oblężenia. Bez nazwy: twój kraj albo kraj, na którego terenie stoisz."
      rank: "każdy"
    lista:
      short: "ranking krajów"
      description: "Lista krajów od największego terytorium, po 10 na stronę."
      rank: "każdy"
    mapa:
      short: "mapa okolicy w czacie"
      description: "Mapa 11×11 chunków wokół ciebie w kolorach krajów. Najedź na kratkę, aby zobaczyć, do kogo należy."
      rank: "każdy"
    mapa-www:
      short: "link do mapy świata"
      description: "Wysyła klikalny link do mapy świata w przeglądarce (alias /mapaswiata)."
      rank: "każdy"
    pomoc:
      short: "ta pomoc"
      description: "Pokazuje listę komend. Podaj numer strony albo nazwę działu, np. /kraj pomoc dyplomacja."
      rank: "każdy"
    czat:
      short: "przełącz czat krajowy"
      description: "Włącza lub wyłącza tryb czatu krajowego: twoje wiadomości widzą tylko członkowie kraju."
      rank: "członek kraju"
    kc:
      short: "wiadomość do swojego kraju"
      description: "Wysyła jedną wiadomość na czacie krajowym, bez przełączania trybu."
      rank: "członek kraju"
    ks:
      short: "wiadomość do sojuszu"
      description: "Wysyła wiadomość do własnego kraju i wszystkich sojuszników."
      rank: "członek kraju"
    admin-usun:
      short: "usuń kraj"
      description: "Usuwa wskazany kraj i powiadamia jego członków."
      rank: "admin (kraje.admin)"
    admin-usun-przywroc:
      short: "usuń kraj i przywróć teren"
      description: "Usuwa kraj (jak /kraj admin usun — Ludnosc i Armia sprzątają swoje dane), a po chwili generuje od nowa z ziarna świata wszystkie jego chunki: oryginalny teren wraca, WSZYSTKO zbudowane tam (budynki, skrzynie z zawartością, byty) przepada. Najpierw podgląd i [Przywróć teren]. Spawn (ziemia neutralna) nigdy nie jest regenerowany. Wymaga WorldEdit."
      rank: "admin (kraje.admin)"
    admin-wladca:
      short: "ustaw władcę"
      description: "Ustawia władcę kraju. Gracz nie może należeć do innego kraju; jeśli nie jest członkiem, zostaje dodany."
      rank: "admin (kraje.admin)"
    admin-zajmij:
      short: "zajmij chunk dla kraju"
      description: "Zajmuje bieżący chunk dla dowolnego kraju (także NPC) bez limitu, kosztu, przylegania i blokady światów."
      rank: "admin (kraje.admin)"
    admin-zajmij-promien:
      short: "zajmij kwadrat chunków"
      description: "Zajmuje wszystkie wolne chunki w kwadracie o promieniu n (0–16, czyli do 33×33) wokół ciebie. Cudze kraje i ziemia neutralna są pomijane. Powyżej 16 chunków: podgląd (liczby, powody pominięć, cząsteczki na granicach) i [Wykonaj]; wykonanie porcjami po 32 chunki na tick."
      rank: "admin (kraje.admin)"
    admin-zajmij-zaznaczenie:
      short: "zajmij zaznaczenie WorldEdit"
      description: "Zajmuje wolne chunki dotknięte twoim zaznaczeniem WorldEdit (//wand, //pos1, //pos2) w bieżącym świecie, maks. 4096 chunków. Pomija cudze kraje i ziemię neutralną. Wymaga WorldEdit."
      rank: "admin (kraje.admin)"
    admin-porzuc-obszar:
      short: "porzuć teren kraju"
      description: "Zwalnia chunki wskazanego kraju: bieżący, w kwadracie o promieniu n albo z zaznaczenia WorldEdit. Stolica nigdy nie jest porzucana. Gdy teren rozpadłby się na części — ostrzeżenie i wymagane potwierdzenie."
      rank: "admin (kraje.admin)"
    admin-przylacz:
      short: "poszerz kraj o pierścień"
      description: "Poszerza kraj o 1 (albo podaną liczbę, maks. 16) pierścień wolnych chunków wokół obecnej granicy, razem z narożnikami. Cudze kraje i ziemia neutralna są pomijane. Działa w twoim świecie (albo w świecie stolicy) i z konsoli."
      rank: "admin (kraje.admin)"
    admin-przywroc:
      short: "przywróć oryginalny teren kraju"
      description: "Generuje od nowa z ziarna świata chunki kraju — wszystkie albo tylko w kwadracie o promieniu n wokół ciebie / w zaznaczeniu WorldEdit (tylko chunki tego kraju). Kraj zostaje. Wszystko w tych chunkach przepada: budynki graczy, skrzynie, NPC, manekiny, stojaki, zwierzęta. Podgląd (liczba chunków, szacowany czas, obrys cząsteczkami) i [Przywróć teren]; potem porcjami w tle z postępem co 10 %. Gracze w regenerowanym chunku trafiają na powierzchnię. Spawn nigdy. Wymaga WorldEdit."
      rank: "admin (kraje.admin)"
    admin-przywroc-teren:
      short: "przywróć dzicz (promien n / zaznaczenie)"
      description: "Jak przywroc dla kraju, ale dla dziczy: chunki bez kraju w kwadracie o promieniu n wokół ciebie albo w zaznaczeniu WorldEdit. Chunki krajów i spawn są pomijane."
      rank: "admin (kraje.admin)"
    admin-przywroc-stop:
      short: "zatrzymaj przywracanie terenu"
      description: "Bezpiecznie zatrzymuje trwające przywracanie po bieżącej porcji. Już zregenerowane chunki zostają przywrócone, reszta bez zmian."
      rank: "admin (kraje.admin)"
    admin-tp:
      short: "teleport do stolicy kraju"
      description: "Natychmiast (bez odliczania) teleportuje cię do punktu spawnu stolicy dowolnego kraju — gracza albo NPC. Gdy punkt jest niebezpieczny (lawa, woda, brak podłoża, zasypany), wybiera najbliższy bezpieczny blok w promieniu 8."
      rank: "admin (kraje.admin)"
    admin-porzuc:
      short: "zwolnij bieżący chunk"
      description: "Zwalnia bieżący chunk dowolnego kraju (bez sprawdzania spójności; stolicy nie można)."
      rank: "admin (kraje.admin)"
    admin-bypass:
      short: "omijanie ochrony terenu"
      description: "Przełącza omijanie ochrony terenu krajów."
      rank: "admin (kraje.admin)"
    admin-spy:
      short: "podgląd czatów krajowych"
      description: "Przełącza podgląd czatów krajowych i sojuszniczych."
      rank: "admin (kraje.admin)"
    admin-reload:
      short: "przeładuj config"
      description: "Przeładowuje config, komunikaty, warstwę mapy i tablistę. Dane krajów zostają w pamięci."
      rank: "admin (kraje.admin)"
    admin-tick:
      short: "dzienne rozliczenie teraz"
      description: "Natychmiast wykonuje dzienne rozliczenie wszystkich krajów (podatki, utrzymanie, bankructwa). Nie przesuwa godziny zwykłego rozliczenia."
      rank: "admin (kraje.admin)"
    admin-oblezenie:
      short: "zakończ oblężenie tutaj"
      description: "Kończy bez zdobycia oblężenie chunka, na którym stoisz."
      rank: "admin (kraje.admin)"
    admin-flaga:
      short: "moderacja flag krajów"
      description: "Kolejka flag do zatwierdzenia (/kraj flaga admin kolejka), zatwierdzenie (zatwierdz <kraj>), odrzucenie z powodem (odrzuc <kraj> <powód>), stan paczki (status) i przebudowa paczki zasobów (przebuduj). Sztandar albo przedmiot dowolnego kraju bez opłaty: sztandar <kraj>, przedmiot <kraj>. Podgląd obrazków: panel WWW → Moderacja chorągwi."
      rank: "moderator flag (kraje.flagi.moderuj)"

  # --- podpowiedzi komend (dymek przy sugestii w kliencie, jedna linia) ---
  # suggest-country: <country> <color> <ruler> <members> <area>
  suggest-country: "<color><country></color> <dark_gray>•</dark_gray> <gray>władca <white><ruler></white> <dark_gray>•</dark_gray> <gray><area>"
  # suggest-country-tp (/kraj admin tp): <country> <color> <ruler> <npc> (= npc-suffix albo pusto) <area>
  suggest-country-tp: "<color><country></color><npc> <dark_gray>•</dark_gray> <gray>władca <white><ruler></white> <dark_gray>•</dark_gray> <gray><area>"
  suggest-player-free: "<green>bez kraju"
  # suggest-player-citizen: <country> <color> <rank>
  suggest-player-citizen: "<gray><rank> <color><country></color>"
  # suggest-member-*: <rank>
  suggest-member-online: "<gray><rank> <dark_gray>•</dark_gray> <green>online"
  suggest-member-offline: "<gray><rank> <dark_gray>•</dark_gray> <dark_gray>offline"
  # suggest-color: <name> <color> <hex>; suggest-color-hex: <color> <hex>
  suggest-color: "<color>■■■ <name></color> <dark_gray>(<hex>)"
  suggest-color-hex: "<color>■■■ <hex></color> <gray>(albo dowolny #RRGGBB)"
  suggest-description-clear: "<gray>wyczyść opis kraju"
  suggest-list-page: "<gray>strona <page> z <pages>"
  suggest-help-page: "<gray>strona <page>: <white><category>"
  suggest-amount: "<gold><amount>"
  suggest-source-account: "<gray>z konta bankowego"
  suggest-source-coins: "<gray>z monet w ekwipunku"
  suggest-tax-none: "<gray>bez podatku"
  # suggest-days*: <days>
  suggest-days: "<gray><days> dni wasalstwa"
  suggest-days-default: "<gray><days> dni wasalstwa <dark_gray>(domyślnie)"
  # suggest-area-*: /kraj admin zajmij|porzuc|przylacz
  suggest-area-radius: "<gray>kwadrat chunków wokół ciebie <dark_gray>(promien 0–16)"
  suggest-area-radius-release: "<gray>porzuć kwadrat chunków wokół ciebie"
  suggest-area-selection: "<gray>chunki z zaznaczenia WorldEdit"
  suggest-area-selection-release: "<gray>porzuć chunki z zaznaczenia WorldEdit"
  # suggest-area-radius-value: <radius> <side> <chunks>
  suggest-area-radius-value: "<gray><side>×<side> <dark_gray>•</dark_gray> <white><chunks>"
  # suggest-area-rings: <rings>
  suggest-area-rings: "<gray><rings> × pierścień wokół granicy"
  suggest-area-confirm: "<gray>wykonaj (po podglądzie)"
  # suggest-restore-* / suggest-delete-restore: /kraj admin przywroc, /kraj admin usun <kraj> przywroc
  suggest-restore-radius: "<gray>tylko chunki kraju w kwadracie wokół ciebie"
  suggest-restore-selection: "<gray>tylko chunki kraju z zaznaczenia WorldEdit"
  suggest-restore-wild-radius: "<gray>dzicz w kwadracie chunków wokół ciebie"
  suggest-restore-wild-selection: "<gray>dzicz z zaznaczenia WorldEdit"
  suggest-restore-confirm: "<gray>cały teren kraju (po podglądzie)"
  suggest-delete-restore: "<gray>usuń kraj i przywróć oryginalny teren (WorldEdit)"

  # --- zakładanie i teren ---
  usage-zaloz: "<prefix><red>Użycie: <yellow>/kraj zaloz \\<nazwa></yellow>"
  name-length: "<prefix><red>Nazwa musi mieć od <min> do <max> znaków."
  name-invalid: "<prefix><red>Nazwa może zawierać tylko litery, cyfry, _ i - (bez spacji i kolorów)."
  name-taken: "<prefix><red>Kraj o nazwie <white><name></white> już istnieje."
  chunk-claimed: "<prefix><red>Ten chunk należy do kraju <color><country></color>."
  too-close: "<prefix><red>Jesteś za blisko granic innego kraju (wymagany odstęp: <distance> ch.)."
  # Obszar chroniony (np. spawn serwera + bufor chunków): nie można tu zakładać krajów ani zajmować terenu. <area> = id obszaru
  protected-area: "<prefix><red>To ziemia neutralna (<white><area></white>). Nie można jej zająć."
  founded: "<prefix><green>Założono kraj <color><bold><country></bold></color>! Ten chunk jest twoją stolicą."
  founded-broadcast: "<prefix><gray><white><player></white> założył nowy kraj: <color><bold><country></bold></color>!"
  chunk-already-own: "<prefix><yellow>Ten chunk już należy do twojego kraju."
  # Limit terenu. Placeholdery: <count> <limit> <base> <per_member> <members> <population> <cap>
  claim-limit-full: "<prefix><red>Osiągnięto limit terenu: <white><count>/<limit></white> chunków.</red><newline><gray>Limit = <white><base></white> bazowo + <white><per_member></white> × <white><members></white> graczy + <white><population></white> z ludności<cap>. Więcej obywateli = większy limit."
  claim-limit-cap: " (najwyżej <max>)"
  claim-limit-cap-hit: " — <yellow>osiągnięto twardy limit <max></yellow>"
  claim-paid: "<prefix><gray>Opłata ze skarbca: <gold><cost></gold> (zostało <gold><balance></gold>, następny chunk: <gold><next></gold>)."
  unclaim-sieged: "<prefix><red>Nie można porzucić chunka, który jest oblegany."
  capital-sieged: "<prefix><red>Nie można przenieść stolicy na oblegany chunk."
  founded-paid: "<prefix><gray>Opłata za założenie: <gold><cost></gold>."
  claim-not-adjacent: "<prefix><red>Chunk musi przylegać bokiem do terytorium twojego kraju."
  claimed: "<prefix><green>Zajęto chunk dla <color><country></color>. Teren: <white><count>/<limit></white> (<area>)."
  chunk-not-own: "<prefix><red>Ten chunk nie należy do twojego kraju."
  chunk-not-claimed: "<prefix><red>Ten chunk nie należy do żadnego kraju."
  cannot-unclaim-capital: "<prefix><red>Nie można porzucić stolicy. Najpierw przenieś ją: <yellow>/kraj stolica</yellow>."
  unclaim-disconnects: "<prefix><red>Porzucenie tego chunka rozdzieliłoby terytorium kraju."
  unclaimed: "<prefix><yellow>Porzucono chunk. Teren: <white><count>/<limit></white>."
  capital-moved: "<prefix><green>Stolica <color><country></color> przeniesiona na <white><x>, <z></white>. Spawn ustawiony tutaj."

  # --- spawn ---
  spawn-disabled: "<prefix><red>Teleport do stolicy jest wyłączony."
