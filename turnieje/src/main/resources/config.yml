  help-tabs: " <tabs>"
  help-tab: "<gray><category>"
  help-tab-current: "<gold><u><category></u>"
  help-tab-separator: "<dark_gray> | "
  help:
    title: "Turnieje"
    categories:
      gracz: "Turnieje"
      pojedynki: "Pojedynki"
      wladca: "Dla władców"
      admin: "Administracja"
    entries:
      zapisz:
        short: "zapis na otwarty turniej"
        description: "Zapisuje cię na turniej z otwartymi zapisami. Wpisowe (jeśli jest) pobierane jest z konta bankowego i powiększa pulę nagród."
        rank: "każdy"
      wypisz:
        short: "wypisanie / wycofanie się"
        description: "Przed startem: wypisanie ze zwrotem wpisowego. W trakcie turnieju: wycofanie się (przegrana) i powrót ekwipunku."
        rank: "każdy"
      info:
        short: "trwający turniej i najbliższy termin"
        description: "Arena, organizator, pula, zapisani, drabinka bieżącej rundy i termin cotygodniowego turnieju."
        rank: "każdy"
      ranking:
        short: "ranking zwycięstw i tytułów"
        description: "Kolejność: tytuły (wygrane turnieje), zwycięskie walki, mniej porażek."
        rank: "każdy"
      ogladaj:
        short: "widownia areny / powrót"
        description: "Przenosi na widownię areny, na której coś trwa. Ponowne użycie wraca na twoje poprzednie miejsce."
        rank: "każdy"
      pomoc:
        short: "ta pomoc"
        description: "Kliknij komendę, aby wpisać ją na czacie. Najedź, aby zobaczyć opis."
        rank: "każdy"
      wyzwij:
        short: "wyzwanie na pojedynek"
        description: "Wyzywa gracza na pojedynek 1 na 1 na wolnej arenie pojedynków. Bez nagród; liczy się do rankingu."
        rank: "każdy"
      przyjmij:
        short: "przyjęcie wyzwania"
        description: "Przyjmuje ostatnie wyzwanie na pojedynek."
        rank: "każdy"
      odrzuc:
        short: "odrzucenie wyzwania"
        description: "Odrzuca wyzwanie na pojedynek."
        rank: "każdy"
      zorganizuj:
        short: "turniej kraju z pulą ze skarbca"
        description: "Organizuje turniej na arenie twojego kraju (lub publicznej). Pula nagród jest pobierana ze skarbca kraju od razu i wraca, jeśli turniej zostanie odwołany. Przykład: /turniej zorganizuj arena1 20zl 1zl 10"
        rank: "Władca (konfigurowalne)"
      arena-rog:
        short: "róg areny bez WorldEdita"
        description: "Zapisuje róg 1 lub 2 w miejscu, w którym stoisz. Z WorldEditem wystarczy zaznaczenie."
        rank: "administracja"
      arena-stworz:
        short: "nowa arena"
        description: "Tworzy arenę z zaznaczenia WorldEdit albo z dwóch rogów. Typy: pojedynek, turniej (drabinka 1 na 1), melee (wszyscy na wszystkich)."
        rank: "administracja"
      arena-spawn:
        short: "punkt startowy (min. 2)"
        description: "Dodaje punkt startowy tam, gdzie stoisz (wewnątrz areny). Walki 1 na 1 używają dwóch pierwszych, bitwa — wszystkich po kolei."
        rank: "administracja"
      arena-widownia:
        short: "miejsce widowni i oczekujących"
        description: "Ustawia widownię: tu stoją widzowie i uczestnicy czekający na walkę. Najlepiej poza obszarem areny."
        rank: "administracja"
      arena-kraj:
        short: "właściciel areny"
        description: "Kraj-właściciel może organizować na niej turnieje. publiczna = bez właściciela."
        rank: "administracja"
      arena-konno:
        short: "turniej kopijniczy"
        description: "Na arenie typu turniej uczestnicy dostają konie z siodłem, a broń to kopia z joust.lance."
        rank: "administracja"
      arena-ekwipunek:
        short: "zestaw lub własny ekwipunek"
        description: "zestaw: ekwipunek przechowany i zwrócony, walka w zestawie z configu. wlasny: walka we własnym. domyslny: z configu."
        rank: "administracja"
      arena-lista:
        short: "lista aren"
        description: "Areny z typem, punktami startowymi, właścicielem i stanem."
        rank: "administracja"
      arena-usun:
        short: "usunięcie areny"
        description: "Usuwa arenę, na której nic nie trwa."
        rank: "administracja"
      start:
        short: "start teraz / nowy turniej"
        description: "Gdy trwają zapisy — zamyka je i startuje. W przeciwnym razie otwiera zapisy turnieju (nagroda jak w weekly) za podaną liczbę minut (domyślnie 5)."
        rank: "administracja"
      stop:
        short: "odwołanie ze zwrotem"
        description: "Odwołuje turniej (lub to, co trwa na arenie): zwrot wpisowego i puli, przywrócenie ekwipunku."
        rank: "administracja"
      reload:
        short: "wczytanie configu"
        description: "Wczytuje config.yml ponownie."
        rank: "administracja"
