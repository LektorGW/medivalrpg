# ============================================================
#  Turnieje — turnieje rycerskie, kopijnicze, bitwy i pojedynki
#  (c) 2026 Maciej Kaczmarczyk — lektoro.pl
#
#  Kwoty pieniędzy w configu są w miedziakach (1 sr = 10 md, 1 zł = 100 md).
#  W komendach można pisać np. 5zl, 2sr, 150 (Skarbiec).
#  /turniej reload wczytuje ten plik ponownie (trwające turnieje działają dalej).
# ============================================================

general:
  # zestaw = ekwipunek gracza jest przechowany i zwrócony po turnieju, do walki dostaje zestaw z sekcji kit
  # wlasny = walka we własnym ekwipunku; nic nie przepada (bez śmierci i dropów), ale zużyte strzały/trwałość to koszt
  # Każda arena może to nadpisać: /turniej arena ekwipunek <arena> <zestaw|wlasny|domyslny>
  default-gear: zestaw
  # Pozwala walczyć przeciwnikom z tej samej walki także tam, gdzie PvP jest wyłączone (np. war-only w Kraje, WorldGuard)
  force-pvp: true
  min-participants: 2
  max-participants: 32
  # Komendy dozwolone dla uczestników w trakcie turnieju (bez ukośnika); /turniej zawsze działa
  allowed-commands: [msg, tell, w, r, kc, ks, glos, login, l]
  # true = areny zawsze chronione (bez sesji też); false = tylko gdy na arenie coś trwa
  protect-arena-always: false
  # /turniej ogladaj
  spectate: true

match:
  # odliczanie 3…2…1 przed walką (bez obrażeń)
  countdown-seconds: 5
  # limit czasu walki 1 na 1; po nim wygrywa ten, kto zadał więcej obrażeń, potem kto ma więcej zdrowia
  time-limit-seconds: 180
  melee-time-limit-seconds: 300
  # przerwa między walkami
  intermission-seconds: 6
  # fajerwerki i ogłoszenie zwycięzcy, potem wszyscy wracają na swoje miejsca
  celebration-seconds: 10

joust:
  # Kopia na arenach "konno" (zbroja z sekcji kit, koń z siodłem od organizatora)
  lance: IRON_SPEAR
  fallback-lance: IRON_SWORD
  # bazowa prędkość konia (atrybut movement_speed, 0.05–0.5)
  horse-speed: 0.3

kit:
  helmet: IRON_HELMET
  chestplate: IRON_CHESTPLATE
  leggings: IRON_LEGGINGS
  boots: IRON_BOOTS
  offhand: SHIELD
  # "MATERIAL" albo "MATERIAL:ilość"
  items:
    - IRON_SWORD
    - BOW
    - "ARROW:16"
    - "BREAD:8"

signups:
  # ogłoszenia na czacie (minuty przed startem)
  announce-minutes: [30, 15, 10, 5, 3, 1]
  # tytuł na ekranie (minuty przed startem)
  title-minutes: [5, 1]
  # pasek bossa z odliczaniem dla wszystkich graczy (false = tylko zapisani)
  bossbar-for-all: true

weekly:
  enabled: true
  # dzień: poniedzialek … niedziela (albo MONDAY … SUNDAY)
  day: sobota
  time: "20:00"
  # strefa czasowa, np. Europe/Warsaw; puste = strefa serwera
  timezone: ""
  # id areny; puste = pierwsza gotowa arena typu turniej/melee
  arena: ""
  # zapisy otwierają się tyle minut przed startem
  signup-minutes: 30
  name: "Wielki Turniej Rycerski"
  # wpisowe w miedziakach (0 = bez); wpisowe powiększa pulę nagród
  entry-fee: 0
  prize:
    # serwer = konto puli serwera (server-account), kraj = skarbiec kraju (country), brak = bez pieniędzy,
    # mint = nowe pieniądze przy wypłacie — TYLKO gdy allow-mint: true
    source: serwer
    amount: 1000
    country: ""
    # konto Skarbca z pulą serwera; zasil je np. /skarbiec admin daj serwer:turnieje 50zl
    server-account: "serwer:turnieje"
    allow-mint: false

prize:
  # procent puli dla miejsc 1, 2, 3 (3. miejsce dzielą przegrani półfinałów); suma ≤ 100, reszta wraca do źródła
  split: [60, 30, 10]
  # co z udziałem miejsca, którego nikt nie zajął: zwrot (do źródła) | zwyciezca
  unclaimed: zwrot

organize:
  enabled: true
  # kto z kraju może zorganizować turniej: wladca | doradca | obywatel
  min-rank: wladca
  min-pool: 100
  max-pool: 100000
  max-entry-fee: 5000
  min-minutes: 2
  max-minutes: 60
  default-minutes: 10
  # przerwa między turniejami jednego kraju
  cooldown-minutes: 120
  # true = kraj może organizować także na arenach publicznych (bez właściciela)
  allow-public-arenas: true

duel:
  enabled: true
  request-seconds: 60
  count-in-stats: true

trophy:
  enabled: true
  material: GOLDEN_SWORD
  name: "<gold><bold>Złoty Miecz Turniejowy</bold></gold>"
  lore:
    - "<gray>Zwycięzca: <yellow><player></yellow>"
    - "<gray><title>"
    - "<dark_gray>Arena <arena>, <date>"

fireworks:
  count: 6

