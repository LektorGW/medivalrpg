books:
  poradnik:
    title: Poradnik MEDIVALRPG
    author: MEDIVALRPG
    intro:
    - <gold><bold>MEDIVALRPG</bold></gold>
    - <dark_gray>Poradnik gracza</dark_gray>
    - ''
    - Witaj, <dark_aqua><player></dark_aqua>! Każdy rozdział to osobna książka – kliknij
      jego nazwę.
    - 'Rozdział od razu: <dark_aqua>/menu poradnik kraj</dark_aqua>'
    toc-title: <bold>Rozdziały</bold>
    chapters:
    - samouczek
    - start
    - kraj
    - ekonomia
    - firmy
    - ludnosc
    - wlasne-budynki
    - zaklady
    - armia
    - dyplomacja
    - postep
    - kolej
    - handel
    - turnieje
    - postac
    - admin
  poradnik-samouczek:
    title: 'Poradnik: Samouczek'
    name: '<dark_green>Samouczek</dark_green>'
    description: Od czego zacząć – 10 kroków
    author: MEDIVALRPG
    intro:
    - 'Dziesięć kroków od pierwszej monety do własnego kraju. To samo z odhaczaniem postępu: <click:run_command:''/menu samouczek''><dark_aqua>/menu samouczek</dark_aqua></click>.'
    toc-title: '<bold>Kroki</bold>'
    sections:
      krok-pieniadze:
        title: '<dark_green>1. Pierwsze pieniądze</dark_green>'
        requires-plugin: Skarbiec
        text:
        - 'Monety: miedziak (md), srebrnik (sr), złota korona (zł). 1 zł = 10 sr = 100 md.'
        - ''
        - 'Kupcy NPC na spawnie (<dark_aqua>/spawn</dark_aqua>) skupują plony, drewno, kamień, węgiel i kruszce – kliknij kupca PPM. Co dziś skupują: <dark_aqua>/skarbiec kupcy</dark_aqua>.'
        - ''
        - 'Bankier obok trzyma monety na koncie. <dark_aqua>/saldo</dark_aqua> – konto, <dark_aqua>/monety</dark_aqua> – monety przy sobie.'
      krok-kraj:
        title: '<dark_green>2. Kraj</dark_green>'
        requires-plugin: Kraje
        text:
        - 'Kraj to ziemia, obywatele i skarbiec. Bez kraju nie zbudujesz osady.'
        - ''
        - 'Dołączenie: Doradca kraju zaprasza cię, ty wpisujesz <dark_aqua>/kraj dolacz kraj</dark_aqua>. Kraje: <dark_aqua>/kraj lista</dark_aqua>.'
        - ''
        - 'Własny kraj: stań tam, gdzie ma być stolica, i wpisz <dark_aqua>/kraj zaloz nazwa</dark_aqua>. Koszt: <cfg:Kraje:economy.found-cost:500> md z konta albo monet.'
      krok-ziemia:
        title: '<dark_green>3. Ziemia</dark_green>'
        requires-plugin: Kraje
        text:
        - 'Kraj rośnie chunk po chunku (16×16). Stań na polu przy granicy: <dark_aqua>/kraj zajmij</dark_aqua> (Doradca+).'
        - ''
        - 'Płaci skarbiec kraju, nie ty. Zasil go: <dark_aqua>/kraj wplac kwota</dark_aqua>. Stan: <dark_aqua>/kraj skarbiec</dark_aqua>.'
        - ''
        - 'Budynki stawia się tylko na swojej ziemi. Granice: <dark_aqua>/kraj mapa</dark_aqua>.'
      krok-mieszkania:
        title: '<dark_green>4. Mieszkania</dark_green>'
        requires-plugin: Ludnosc
        text:
        - 'Obywatele NPC mieszkają w łóżkach. Bez wolnych łóżek ludność nie rośnie, a to obywatele płacą podatki do skarbca.'
        - ''
        - 'Zacznij od chaty: <dark_aqua>/ludnosc buduj chata</dark_aqua> (Doradca+). Stan osady: <dark_aqua>/ludnosc info</dark_aqua>.'
      krok-jedzenie:
        title: '<dark_green>5. Jedzenie</dark_green>'
        requires-plugin: Ludnosc
        text:
        - 'Ludność rośnie tylko przy zapasie jedzenia; głód ją zmniejsza.'
        - ''
        - '<dark_aqua>/ludnosc buduj pole</dark_aqua> – rolnicy zbierają plony. <dark_aqua>/ludnosc buduj spichlerz</dark_aqua> – tu trafia jedzenie.'
        - ''
        - 'Jedzenie możesz też sam włożyć do skrzyni spichlerza. Zapas: <dark_aqua>/ludnosc spichlerz</dark_aqua>. Zimą pola nie rodzą – zrób zapasy.'
      krok-budowa:
        title: '<dark_green>6. Podgląd budowy</dark_green>'
        requires-plugin: Ludnosc
        text:
        - '<dark_aqua>/ludnosc buduj typ</dark_aqua> pokazuje obrys w miejscu, na które patrzysz: zielony – można, czerwony – przeszkoda (powód na czacie), żółta linia – drzwi.'
        - ''
        - '<dark_aqua>/ludnosc buduj obroc</dark_aqua> – obrót, <dark_aqua>wariant</dark_aqua> – inny wygląd, <dark_aqua>potwierdz</dark_aqua> – zlecenie (płaci skarbiec), <dark_aqua>anuluj</dark_aqua> – porzucenie podglądu.'
        - ''
        - 'Budują budowniczowie NPC, to trwa. Postęp i braki: <dark_aqua>/ludnosc budowy</dark_aqua>. Przyciski: <click:run_command:''/menu osada-budowa''><dark_aqua>plan budowy</dark_aqua></click>.'
      krok-produkcja:
        title: '<dark_green>7. Produkcja</dark_green>'
        requires-plugin: Ludnosc
        text:
        - 'Tartak, kopalnia i kamieniołom dają drewno, rudy i kamień do swoich skrzyń. Tragarze znoszą urobek do magazynu, a budowy biorą stamtąd materiały – liczy się każda skrzynia i beczka magazynu. Bez zakładów budowy kupują materiał za monety.'
        - ''
        - 'Większe budynki wymagają większej osady (ludność, poziom). Co budynek daje, czego potrzebuje i ile kosztuje: <click:run_command:''/ludnosc typy''><dark_aqua>/ludnosc typy</dark_aqua></click>.'
      krok-wlasne:
        title: '<dark_green>8. Własne budynki</dark_green>'
        requires-plugin: Ludnosc
        requires-command: ludnosc budynek
        text:
        - 'Budynek postawiony ręcznie też może pracować dla kraju (mieszkanie, spichlerz, magazyn, koszary…).'
        - ''
        - '<dark_aqua>/ludnosc kopia pos1</dark_aqua> i <dark_aqua>pos2</dark_aqua> w rogach, potem <dark_aqua>/ludnosc budynek zglos typ</dark_aqua> (Doradca+).'
        - ''
        - 'Więcej: <click:run_command:''/menu poradnik wlasne-budynki''><dark_aqua>rozdział Własne budynki</dark_aqua></click>.'
      krok-armia:
        title: '<dark_green>9. Armia i koszary</dark_green>'
        requires-plugin: Armia
        text:
        - 'Żołnierze NPC bronią kraju i walczą w wojnach. Rekrut to obywatel, żołd płaci skarbiec.'
        - ''
        - 'Koszary (<dark_aqua>/ludnosc buduj koszary</dark_aqua>): każda prycza to +1 do limitu żołnierzy kraju. Rekruci stają przy koszarach, a żołnierze w ich pobliżu leczą rany.'
        - ''
        - '<dark_aqua>/armia rekrutuj typ</dark_aqua> (Doradca+), rozkazy: <dark_aqua>/armia pomoc</dark_aqua>.'
      krok-pomoc:
        title: '<dark_green>10. Pomoc</dark_green>'
        text:
        - '<click:run_command:''/pomoc''><dark_aqua>/pomoc</dark_aqua></click> – kategorie, komendy i wyszukiwarka.'
        - '<dark_aqua>/menu poradnik</dark_aqua> – pozostałe rozdziały.'
        - '<dark_aqua>/mapa</dark_aqua> – mapa świata w przeglądarce.'
        - '<dark_aqua>/panel</dark_aqua> – twój kraj w przeglądarce.'
        - '<dark_aqua>/discord</dark_aqua> – Discord serwera: pytania i ogłoszenia.'
  poradnik-start:
    title: 'Poradnik: Start'
    name: <dark_green>Start</dark_green>
    description: Konto, menu, spawn, domy, mapa
    author: MEDIVALRPG
    intro:
    - 'Pierwsze kroki na serwerze: konto, menu, teleporty i przydatne strony.'
    toc-title: <bold>Tematy</bold>
    sections:
      start:
        title: <dark_green>Konto i logowanie</dark_green>
        text:
        - 'Przy pierwszym wejściu załóż konto:'
        - <dark_aqua>/register hasło hasło</dark_aqua>
        - ''
        - 'Przy kolejnych wejściach:'
        - <dark_aqua>/login hasło</dark_aqua>
        - ''
        - Po zalogowaniu wracasz tam, gdzie się wylogowałeś. Nie podawaj nikomu hasła.
      konto-straznik:
        title: <dark_green>Hasło i wylogowanie</dark_green>
        requires-plugin: Straznik
        text:
        - 'Po wejściu otwiera się okno logowania. Na wpisanie hasła masz 90 s. Hasło:
          co najmniej 6 znaków, bez spacji i bez nicku.'
        - ''
        - <dark_aqua>/zmienhaslo stare nowe</dark_aqua> – zmiana hasła (kończy też
          sesje w panelu WWW).
        - <dark_aqua>/wyloguj</dark_aqua> – wyjście z serwera; kolejne wejście wymaga
          hasła.
      menu:
        title: <dark_green>Menu i pomoc</dark_green>
        text:
        - 'Kompas <gold>Przewodnik</gold> (9. slot paska) otwiera menu: weź go do
          ręki i kliknij PPM. Zgubiony: <dark_aqua>/przewodnik daj</dark_aqua>.'
        - ''
        - 'Menu otworzysz też komendą <dark_aqua>/menu</dark_aqua> albo <dark_aqua>/m</dark_aqua>.
          Jest w nim wszystko: postać, kraj, osada, armia, pieniądze, mapa i ustawienia.'
        - ''
        - 'Centrum pomocy z kategoriami: <click:run_command:''/pomoc''><dark_aqua>/pomoc</dark_aqua></click>.
          Szukanie: <dark_aqua>/pomoc szukaj słowo</dark_aqua>.'
      teleporty:
        title: <dark_green>Spawn i domy</dark_green>
        text:
        - <dark_aqua>/spawn</dark_aqua> (<dark_aqua>/sp</dark_aqua>) – teleport na
          spawn po <cfg:Menu:spawn.warmup-seconds:5> s. Ruch albo obrażenia go anulują;
          kolejny po <cfg:Menu:spawn.cooldown-seconds:30> s.
        - ''
        - 'Gdy po wejściu trafisz na spawn, możesz raz wrócić do ostatniej pozycji:
          <dark_aqua>/powrot</dark_aqua>.'
        - ''
        - '<bold>Domy</bold> (limit: <cfg:Menu:homes.max:1>)'
        - <dark_aqua>/ustawdom [nazwa]</dark_aqua> – zapis domu tu
        - <dark_aqua>/dom [nazwa]</dark_aqua> – teleport
        - <dark_aqua>/domy</dark_aqua> – lista, <dark_aqua>/usundom nazwa</dark_aqua>
        - ''
        - Dom ustawisz na ziemi swojego kraju albo w dziczy. Po walce z graczem (<cfg:Menu:teleport.combat-tag-seconds:10>
          s) i podczas oblężenia teleport jest zablokowany.
      glos:
        title: <dark_green>Czat głosowy</dark_green>
        requires-plugin: Glos
        text:
        - 'Rozmawiasz w przeglądarce, bez modów: <dark_aqua>/glos</dark_aqua>, kliknij
          link (ważny 15 min) i zezwól na mikrofon. Słyszysz graczy w pobliżu.'
        - ''
        - 'Zasięg: <dark_aqua>/glos szept</dark_aqua> (<cfg:Glos:ranges.whisper:6>
          bl.), <dark_aqua>normalnie</dark_aqua> (<cfg:Glos:ranges.normal:24> bl.),
          <dark_aqua>krzyk</dark_aqua> (<cfg:Glos:ranges.shout:48> bl.). Kucanie daje
          szept.'
        - ''
        - '<dark_aqua>/glos pasek</dark_aqua>, <dark_aqua>/glos wskaznik</dark_aqua>
          – wskaźniki; koniec: <dark_aqua>/glos rozlacz</dark_aqua>.'
      mapa:
        title: <dark_green>Mapa świata</dark_green>
        text:
        - 'Mapa z granicami krajów działa w przeglądarce:'
        - <map_link>
        - ''
        - Link dostaniesz też komendą <dark_aqua>/mapa</dark_aqua> albo z menu.
      panel:
        title: <dark_green>Panel WWW</dark_green>
        requires-plugin: Panel
        text:
        - 'Krajem zarządzasz też w przeglądarce, również z telefonu: <dark_aqua>panel.example.workers.dev</dark_aqua>'
        - ''
        - '<dark_aqua>/panel</dark_aqua> daje jednorazowy link logowania (ważny 10
          min). Nie podawaj go innym. Wylogowanie wszędzie: <dark_aqua>/panel wyloguj</dark_aqua>.'
        - ''
        - 'Władca i doradcy widzą w panelu <dark_aqua>Gospodarkę kraju</dark_aqua>:
          produkcję, skrzynie, spichlerz, budowy i braki z podpowiedziami.'
      nowosci:
        title: <dark_green>Nowości</dark_green>
        requires-plugin: Nowosci
        text:
        - 'Wszystkie zmiany na serwerze: <dark_aqua>/nowosci</dark_aqua> (książka)
          albo <dark_aqua>/nowosci czat</dark_aqua>.'
        - ''
        - 'Nie pokazuj obecnych po zalogowaniu: <dark_aqua>/nowosci przeczytane</dark_aqua>.'
  poradnik-kraj:
    title: 'Poradnik: Kraj'
    name: <dark_green>Kraj</dark_green>
    description: Założenie, ranki, ziemia, skarbiec
    author: MEDIVALRPG
    requires-plugin: Kraje
    intro:
    - 'Kraj to twój teren, obywatele i skarbiec. Pełna lista komend: <dark_aqua>/kraj
      pomoc</dark_aqua>.'
    toc-title: <bold>Tematy</bold>
    sections:
      kraje:
        title: <dark_green>Założenie i dołączenie</dark_green>
        requires-plugin: Kraje
        text:
        - '<dark_aqua>/kraj zaloz nazwa</dark_aqua> – chunk (16×16), na którym stoisz,
          zostaje stolicą. Koszt: <cfg:Kraje:economy.found-cost:500> md z twojego
          konta.'
        - ''
        - 'Nazwa: 3–24 znaki, bez spacji. Odstęp od innych krajów: <cfg:Kraje:country.found-min-distance-chunks:3>
          chunki.'
        - ''
        - 'Dołączenie: Doradca zaprasza <dark_aqua>/kraj zapros gracz</dark_aqua>,
          ty wpisujesz <dark_aqua>/kraj dolacz kraj</dark_aqua> (albo <dark_aqua>odrzuc</dark_aqua>).
          Wyjście: <dark_aqua>/kraj opusc</dark_aqua>.'
      rangi:
        title: <dark_green>Rangi</dark_green>
        requires-plugin: Kraje
        text:
        - <bold>Władca</bold> › <bold>Doradca</bold> › <bold>Obywatel</bold>.
        - ''
        - Doradca zajmuje teren, zaprasza i wyrzuca (<dark_aqua>/kraj wyrzuc gracz</dark_aqua>).
          Władca dodatkowo prowadzi dyplomację i ustala podatek.
        - ''
        - 'Władca: <dark_aqua>/kraj awansuj</dark_aqua> i <dark_aqua>/kraj degraduj
          gracz</dark_aqua> (Doradca), <dark_aqua>/kraj przekaz gracz</dark_aqua>
          (władza), <dark_aqua>/kraj rozwiaz</dark_aqua>.'
      teren:
        title: <dark_green>Ziemia i ochrona</dark_green>
        requires-plugin: Kraje
        text:
        - <dark_aqua>/kraj zajmij</dark_aqua> dołącza chunk, na którym stoisz; musi
          przylegać do kraju. Koszt rośnie z liczbą chunków i idzie ze skarbca. <dark_aqua>/kraj
          porzuc</dark_aqua> oddaje chunk.
        - ''
        - 'Limit: <cfg:Kraje:claims.base:16> + <cfg:Kraje:claims.per-member:8> za
          gracza + część ludności NPC. Podgląd: <dark_aqua>/kraj mapa</dark_aqua>.'
        - ''
        - Obcy nie budują, nie otwierają skrzyń ani drzwi. Wybuchy, ogień, woda i
          tłoki z zewnątrz nie niszczą terenu.
      stolica:
        title: <dark_green>Stolica</dark_green>
        requires-plugin: Kraje
        text:
        - <dark_aqua>/kraj spawn</dark_aqua> – teleport do stolicy (odliczanie, ruch
          anuluje).
        - ''
        - <dark_aqua>/kraj stolica</dark_aqua> (Władca) przenosi stolicę na twój chunk;
          nie na oblężonym.
      skarbiec-kraju:
        title: <dark_green>Skarbiec i podatek</dark_green>
        requires-plugin:
        - Kraje
        - Skarbiec
        text:
        - <dark_aqua>/kraj skarbiec</dark_aqua> – stan i ostatnie operacje
        - <dark_aqua>/kraj wplac kwota</dark_aqua> – wpłata (każdy obywatel)
        - <dark_aqua>/kraj wyplac kwota</dark_aqua> – wypłata (Władca)
        - ''
        - <dark_aqua>/kraj podatek kwota</dark_aqua> – dzienny podatek od graczy (do
          <cfg:Kraje:economy.tax.max:100> md). Kto nie ma pieniędzy, ma dług; po 3
          dniach można go wyrzucić.
        - ''
        - Codziennie o 18:00 kraj płaci <cfg:Kraje:economy.upkeep-per-chunk:2> md
          za chunk (stolica gratis). Bez pieniędzy przez 3 dni traci najdalsze chunki.
      wyglad-czat:
        title: <dark_green>Wygląd i czat</dark_green>
        requires-plugin: Kraje
        text:
        - <dark_aqua>/kraj kolor kolor</dark_aqua> (Władca), <dark_aqua>/kraj opis
          tekst</dark_aqua>, <dark_aqua>/kraj info [kraj]</dark_aqua>, <dark_aqua>/kraj
          lista</dark_aqua>.
        - ''
        - <dark_aqua>/kc tekst</dark_aqua> – czat kraju, <dark_aqua>/ks tekst</dark_aqua>
          – czat sojuszu, <dark_aqua>/kraj czat</dark_aqua> – stały tryb czatu kraju.
      choragiew:
        title: <dark_green>Chorągiew kraju</dark_green>
        requires-plugin: Kraje
        requires-command: kraj flaga
        text:
        - Nad stolicą i przy ambasadach powiewa chorągiew kraju. Bez własnego obrazka
          ma kolor kraju.
        - ''
        - Obrazek (PNG/JPG do 160 KB) wgrywa Władca albo Doradca w panelu WWW. Trafia
          do gry dopiero po akceptacji moderatora; zmiana paczki trwa do kilkunastu
          minut.
        - ''
        - <dark_aqua>/kraj flaga</dark_aqua> – stan i link do panelu
        - <dark_aqua>/kraj flaga postaw</dark_aqua> / <dark_aqua>auto</dark_aqua>
          – miejsce chorągwi
        - <dark_aqua>/kraj flaga historia</dark_aqua>, <dark_aqua>wycofaj</dark_aqua>,
          <dark_aqua>domyslna potwierdz</dark_aqua>
  poradnik-ekonomia:
    title: 'Poradnik: Ekonomia'
    name: <dark_green>Ekonomia i kupcy</dark_green>
    description: Monety, bank, sklepy, kupcy NPC
    author: MEDIVALRPG
    requires-plugin: Skarbiec
    intro:
    - 'Pieniądze, handel z graczami i kupcy NPC. Pełna pomoc: <dark_aqua>/skarbiec
      pomoc</dark_aqua>.'
    toc-title: <bold>Tematy</bold>
    sections:
      skarbiec:
        title: <dark_green>Monety i bank</dark_green>
        requires-plugin: Skarbiec
        text:
        - 'Miedziak (md), srebrnik (sr) i złota korona (zł): 1 zł = 10 sr = 100 md.
          Kwoty wpisujesz np. <dark_aqua>150</dark_aqua>, <dark_aqua>3zł</dark_aqua>,
          <dark_aqua>1zł 5sr</dark_aqua>.'
        - ''
        - <dark_aqua>/saldo</dark_aqua> – konto w banku
        - <dark_aqua>/monety</dark_aqua> – monety przy sobie
        - <dark_aqua>/zaplac gracz kwota</dark_aqua> – przelew
        - ''
        - Bankier NPC (PPM) przyjmuje i wypłaca monety.
      handel-graczy:
        title: <dark_green>Wymiana z graczem</dark_green>
        requires-plugin: Skarbiec
        text:
        - '<dark_aqua>/handel gracz</dark_aqua> otwiera okno wymiany z graczem obok:
          przedmioty i monety. Obie strony potwierdzają, wymiana następuje po 3 s.'
      sklepy:
        title: <dark_green>Sklep gracza</dark_green>
        requires-plugin: Skarbiec
        text:
        - 'Tabliczka na skrzyni: <dark_aqua>[Sklep]</dark_aqua> / <dark_aqua>Sprzedam</dark_aqua>
          lub <dark_aqua>Kupię</dark_aqua> / ilość / cena. Towar to pierwszy przedmiot
          w skrzyni.'
        - ''
        - Utarg trafia na twoje konto; w sklepie „Kupię” płacisz ze swojego konta.
          Skrzynię otwierasz tylko ty.
        - ''
        - 'Twoje sklepy: <dark_aqua>/skarbiec sklepy</dark_aqua>'
      kupcy:
        title: <dark_green>Kupcy NPC</dark_green>
        requires-plugin: Skarbiec
        text:
        - 'Kupcy: ogólny, kowal, spożywczy i budowlany. Skupują i sprzedają towary
          (PPM).'
        - ''
        - 'Nowa dostawa co 12 h: o 6:00 i 18:00. Towary oznaczone <gold>★</gold> kupiec
          szczególnie chce kupić.'
        - ''
        - Ceny zależą od zapasu i budżetu kupca; sprzedaje drożej, niż skupuje. Dzienny
          limit zarobku jest wspólny dla wszystkich kupców.
        - ''
        - <click:run_command:'/skarbiec kupcy'><dark_aqua>/skarbiec kupcy</dark_aqua></click>
          – oferta, poszukiwane i czas do dostawy
      pula:
        title: <dark_green>Zamknięta pula</dark_green>
        requires-plugin: Skarbiec
        text:
        - 'Na świecie jest stała suma pieniędzy: 1 000 000 zł. Nic nie powstaje z
          niczego – każda zapłata, podatek i nagroda to przelew między kontami.'
        - ''
        - Kupiec płaci z własnego budżetu, a władcy NPC ze skarbca kraju. Gdy budżet
          jest pusty, kupiec nie skupuje.
  poradnik-firmy:
    title: 'Poradnik: Firmy'
    name: <dark_green>Firmy</dark_green>
    description: Cechy, kompanie, manufaktury
    author: MEDIVALRPG
    requires-plugin: Firmy
    intro:
    - 'Firma to wspólne konto, udziały, pensje, sklepy i magazyn. Okno firmy: <dark_aqua>/firma</dark_aqua>.'
    toc-title: <bold>Tematy</bold>
    sections:
      firmy:
        title: <dark_green>Zakładanie</dark_green>
        requires-plugin: Firmy
        text:
        - 'Stań na ziemi kraju, który ma być siedzibą: <dark_aqua>/firma zaloz typ
          nazwa</dark_aqua>. Typy: cech, kompania, manufaktura (od Renesansu).'
        - ''
        - 'Koszt: 25 zł opłaty dla kraju i 25 zł kapitału. W kraju gracza zgodę daje
          Władca albo Doradca (do 72 h, odmowa zwraca pieniądze). Kraj NPC zgadza
          się od razu, jeśli masz u niego reputację co najmniej „Obcy”.'
        - ''
        - 'Nazwa: 3–24 znaki. Prowadzisz najwyżej 1 firmę, należysz do najwyżej 3.'
        - ''
        - <dark_aqua>/firma start</dark_aqua> albo <dark_aqua>/firma zaloz</dark_aqua>
          – lista warunków w miejscu, w którym stoisz.
      firma-zrzutka:
        title: <dark_green>Zrzutka</dark_green>
        requires-plugin: Firmy
        requires-command: firma zrzutka
        text:
        - 'Za mało pieniędzy? Załóżcie firmę razem: <dark_aqua>/firma zrzutka zaloz
          typ wkład nazwa</dark_aqua> (od 5 zł, na ziemi kraju siedziby).'
        - ''
        - <dark_aqua>/firma zrzutka dolacz zrzutka kwota</dark_aqua> – dołóż się, <dark_aqua>/firma
          zrzutka</dark_aqua> – lista, <dark_aqua>wycofaj</dark_aqua> – zwrot wkładu.
        - ''
        - Zakładający zostaje mistrzem, reszta wspólnikami według wkładu. Bez kompletu
          w 72 h każdy dostaje swój wkład z powrotem.
      firma-ludzie:
        title: <dark_green>Ludzie i udziały</dark_green>
        requires-plugin: Firmy
        text:
        - Mistrz prowadzi firmę, wspólnicy mają udziały, czeladnicy pracują.
        - ''
        - '<dark_aqua>/firma zapros gracz wspolnik|czeladnik</dark_aqua> (gracz: min.
          5 h gry, konto starsze niż 3 dni), przyjęcie: <dark_aqua>/firma przyjmij</dark_aqua>.'
        - ''
        - <dark_aqua>/firma udzialy gracz procent</dark_aqua> – przekazanie udziałów;
          druga strona musi przyjąć.
      firma-pieniadze:
        title: <dark_green>Pieniądze firmy</dark_green>
        requires-plugin: Firmy
        text:
        - <dark_aqua>/firma wplac kwota</dark_aqua> – wpłata z twojego konta.
        - <dark_aqua>/firma pensja gracz kwota</dark_aqua> – pensja do 50 zł dziennie,
          wypłacana o 12:00.
        - <dark_aqua>/firma dywidenda kwota</dark_aqua> – podział zysku według udziałów;
          duża czeka 24 h.
        - ''
        - Od każdego przychodu kraj siedziby pobiera podatek (domyślnie 5 %). 3 dni
          bez pensji = niewypłacalność, 7 dni = likwidacja.
      firma-sklep:
        title: <dark_green>Sklep, magazyn, księga</dark_green>
        requires-plugin: Firmy
        text:
        - Postaw zwykły [Sklep] na ziemi siedziby i patrząc na niego wpisz <dark_aqua>/firma
          sklep</dark_aqua> – utarg trafia na konto firmy.
        - ''
        - <dark_aqua>/firma magazyn</dark_aqua> (patrząc na skrzynię) – otwierają
          ją tylko ludzie firmy, dziennik pokazuje, kto co wyjął.
        - ''
        - <dark_aqua>/firma ksiega</dark_aqua>, <dark_aqua>/firma info [firma]</dark_aqua>,
          <dark_aqua>/firma ranking</dark_aqua>.
        - ''
        - 'Mistrz: <dark_aqua>/firma herb|kolor|siedziba|awans</dark_aqua>. Likwidacja:
          <dark_aqua>/firma likwiduj</dark_aqua> (ponad 50 % udziałów).'
      firma-kraj:
        title: <dark_green>Firmy w kraju</dark_green>
        requires-plugin:
        - Firmy
        - Kraje
        text:
        - 'Władca i Doradca: <dark_aqua>/firma kraj</dark_aqua> – wnioski o założenie
          firm i lista firm kraju.'
        - ''
        - 'Władca ustala podatek od przychodu firm: 0–20 %. W czasie wojny może zawiesić
          sklepy firm z kraju wroga.'
      firma-kontrakty:
        title: <dark_green>Kontrakty</dark_green>
        requires-plugin: Firmy
        requires-command: firma kontrakt
        text:
        - 'Zamawiający płaci od razu do depozytu, wykonawca może wpłacić wadium. Tablica:
          <dark_aqua>/firma kontrakt lista</dark_aqua>.'
        - ''
        - 'Towar: patrząc na skrzynię odbiorczą <dark_aqua>/firma kontrakt zamow ...</dark_aqua>.
          Usługa: <dark_aqua>/firma kontrakt usluga ...</dark_aqua>.'
        - ''
        - 'Przebieg: <dark_aqua>/firma kontrakt przyjmij|oddaj|potwierdz|odwolaj|spor
          id</dark_aqua>. Spór zamraża depozyt do decyzji administracji.'
      firma-hurt:
        title: <dark_green>Zlecenia hurtowe NPC</dark_green>
        requires-plugin: Firmy
        requires-command: firma hurt
        text:
        - <dark_aqua>/firma hurt</dark_aqua> – duże dostawy dla władców NPC (stawki ×5).
          Nagroda czeka w depozycie od przyjęcia, a po oddaniu towaru w stolicy trafia
          na konto firmy.
        - ''
        - '<dark_aqua>/firma zlecenia</dark_aqua> – tablica zleceń: najbliższe pierwsze,
          z miejscem dowozu; kliknięcie przyjmuje zlecenie.'
      firma-kredyty:
        title: <dark_green>Kredyty</dark_green>
        requires-plugin: Firmy
        requires-command: firma kredyt
        text:
        - '<dark_aqua>/firma kredyt</dark_aqua> – limit, oferty i spłata. Limit: najmniejsze
          z 2× salda, 50 % obrotu z 30 dni i 5000 zł.'
        - ''
        - Odsetki do 10 % za cały okres 7–30 dni, jeden kredyt naraz. Spłata idzie
          sama z przychodów.
        - ''
        - 'Pożyczka od gracza: <dark_aqua>/firma kredyt oferuj firma kwota procent
          dni</dark_aqua>. Wniosek do Skarbu Świata: <dark_aqua>/firma kredyt skarb
          ...</dark_aqua>.'
      firma-warsztaty:
        title: <dark_green>Warsztaty</dark_green>
        requires-plugin: Firmy
        requires-command: firma warsztat
        text:
        - 'Warsztat przerabia prawdziwe surowce ze skrzyni wejścia do skrzyni wyjścia.
          Stan: <dark_aqua>/firma warsztat</dark_aqua>.'
        - ''
        - 'Cech: 1 warsztat od pierwszej epoki (chleb, deski, wełna, węgiel drzewny,
          cegły, wędzone mięso). Manufaktura (Renesans): więcej warsztatów i przepisów.'
        - ''
        - 'Patrząc na stanowisko na ziemi siedziby: <dark_aqua>/firma warsztat zaloz
          przepis</dark_aqua>, potem <dark_aqua>/firma warsztat wejscie|wyjscie id</dark_aqua>
          przy skrzyniach.'
        - ''
        - Pełna skrzynia wyjścia albo brak surowca wstrzymuje pracę.
      firma-robotnicy:
        title: <dark_green>Robotnicy NPC</dark_green>
        requires-plugin: Firmy
        requires-command: firma robotnik
        text:
        - <dark_aqua>/firma robotnik zatrudnij|zwolnij warsztat</dark_aqua> – obywatel
          kraju siedziby pracuje w warsztacie (do 2 na warsztat).
        - ''
        - Pensja 3 zł dziennie trafia do obywateli kraju. Bez pieniędzy robotnik wraca
          do kraju.
  poradnik-ludnosc:
    title: 'Poradnik: Ludność'
    name: <dark_green>Ludność i budowy</dark_green>
    description: Obywatele, budowy, kopie, plan
    author: MEDIVALRPG
    requires-plugin: Ludnosc
    intro:
    - 'Obywatele NPC, budynki i rozwój osady. Pełna pomoc: <dark_aqua>/ludnosc pomoc</dark_aqua>.'
    toc-title: <bold>Tematy</bold>
    sections:
      osada:
        title: <dark_green>Obywatele i osada</dark_green>
        requires-plugin: Ludnosc
        text:
        - Wieśniacy na ziemi kraju są jego obywatelami. Mieszkają w budynkach (miejsca
          = łóżka), jedzą ze spichlerza i płacą podatek do skarbca.
        - ''
        - Ludność rośnie przy wolnych łóżkach i zapasie jedzenia; głód i brak łóżek
          ją zmniejszają.
        - ''
        - <dark_aqua>/ludnosc info</dark_aqua>, <dark_aqua>/ludnosc budynki</dark_aqua>,
          <dark_aqua>/ludnosc spichlerz</dark_aqua>
        - ''
        - 'Poziomy: Osada → Wieś → Miasteczko → Miasto → Stolica. Wyższy odblokowuje
          budynki i lepsze materiały.'
      budowa:
        title: <dark_green>Budowanie</dark_green>
        requires-plugin: Ludnosc
        text:
        - '<dark_aqua>/ludnosc buduj typ</dark_aqua> (Doradca+) pokazuje obrys: zielony
          = można, żółta linia = drzwi, czerwony = przeszkoda z powodem na czacie. Potem
          <dark_aqua>/ludnosc buduj obroc|potwierdz</dark_aqua>.'
        - ''
        - '<dark_aqua>/ludnosc buduj anuluj</dark_aqua> porzuca tylko podgląd. Plac budowy
          anulujesz <dark_aqua>/ludnosc buduj anuluj id</dark_aqua> (id z listy) albo
          <dark_aqua>anuluj potwierdz</dark_aqua> na placu – zwrot 100%, gdy prace się
          nie zaczęły.'
        - ''
        - '<dark_aqua>/ludnosc buduj wariant</dark_aqua> – inny wygląd, gracze samodzielnie
          wybierają budynek i miejsce. Lista: <dark_aqua>/ludnosc typy</dark_aqua>.'
        - ''
        - Koszt płaci skarbiec, a budowniczowie NPC stawiają budynek z prawdziwego
          drewna i kamienia z magazynów kraju.
      place-budowy:
        title: <dark_green>Place budowy</dark_green>
        requires-plugin: Ludnosc
        text:
        - <dark_aqua>/ludnosc budowy</dark_aqua> – etap, postęp, budowniczowie i czego
          brakuje.
        - <dark_aqua>/ludnosc gospodarka</dark_aqua> – skąd idzie materiał, tragarze
          w drodze, braki.
        - <dark_aqua>/ludnosc kolejka</dark_aqua> – kolejka budów (Doradca+).
        - ''
        - Tragarze noszą drewno i kamień z magazynów do skrzyni placu. Kraj bez tartaku
          albo kamieniołomu kupuje ten materiał za monety.
      kopie:
        title: <dark_green>Kopie budowli</dark_green>
        requires-plugin: Ludnosc
        text:
        - 'Własną budowlę zapiszesz jako szablon kraju. Zaznacz rogi: <dark_aqua>/ludnosc
          kopia pos1</dark_aqua> i <dark_aqua>pos2</dark_aqua> (całość na ziemi kraju).'
        - ''
        - <dark_aqua>/ludnosc kopia zapisz nazwa</dark_aqua> (Doradca+), <dark_aqua>/ludnosc
          kopia lista</dark_aqua>, <dark_aqua>/ludnosc kopia info|buduj|usun nazwa</dark_aqua>.
        - ''
        - 'Budowa kopii kosztuje 4 md za blok, co najmniej 500 md, ze skarbca kraju.
          Pomoc: <dark_aqua>/ludnosc kopia</dark_aqua>.'
      obywatele:
        title: <dark_green>Życie obywateli</dark_green>
        requires-plugin: Ludnosc
        text:
        - 'Każdy obywatel ma dom i łóżko, pracę, pensję, rodzinę i wiek. Spójrz na
          wieśniaka: <dark_aqua>/ludnosc obywatel</dark_aqua>.'
        - ''
        - <dark_aqua>/ludnosc obywatele</dark_aqua> – bezdomni, bezrobotni, oszczędności,
          rodziny.
        - ''
        - 'Tylko w krajach NPC obywatele sami budują chaty i ścinają naturalne drzewa.
          W krajach graczy chaty zamawia się ręcznie. Doradca+: <dark_aqua>/ludnosc
          obywatele chatki wl|wyl</dark_aqua>.'
      plan-miasta:
        title: <dark_green>Plan miasta</dark_green>
        requires-plugin: Ludnosc
        text:
        - <dark_aqua>/ludnosc plan</dark_aqua> – plan miasta, <dark_aqua>/ludnosc
          plan krolestwo</dark_aqua> – mapa osad i traktów.
        - ''
        - 'Automatyczna przebudowa miasta jest wyłączona w krajach graczy; miasto
          budujecie sami. Drogi w stylu epoki: <dark_aqua>/ludnosc przebuduj</dark_aqua>.'
        - ''
        - '<dark_aqua>/ludnosc modernizuj id|wszystko</dark_aqua>, <dark_aqua>/ludnosc
          napraw id|wszystko</dark_aqua>. Mury rosną z miastem: palisada, potem kamień.'
  poradnik-wlasne-budynki:
    title: 'Poradnik: Własne budynki'
    name: <dark_green>Własne budynki</dark_green>
    description: Zgłaszanie budynków postawionych ręcznie
    author: MEDIVALRPG
    requires-plugin: Ludnosc
    requires-command: ludnosc budynek
    intro:
    - 'Budynek postawiony ręcznie może pracować dla kraju jak budynek budowniczych.
      Okno: <click:run_command:''/menu osada-wlasne''><dark_aqua>Własne budynki</dark_aqua></click>.'
    toc-title: <bold>Tematy</bold>
    sections:
      zgloszenie:
        title: <dark_green>Jak zgłosić budynek</dark_green>
        requires-plugin: Ludnosc
        text:
        - 'Władca albo Doradca:'
        - 1. <dark_aqua>/ludnosc kopia pos1</dark_aqua> w dolnym narożniku,
        - 2. <dark_aqua>/ludnosc kopia pos2</dark_aqua> w przeciwległym górnym (z dachem),
        - 3. <dark_aqua>/ludnosc budynek zglos typ [nazwa]</dark_aqua>.
        - ''
        - 'Odmowa podaje powód z koordynatami (obca ziemia, kolizja, brak bloków).
          Typy i wymagania kraju: <dark_aqua>/ludnosc budynek typy</dark_aqua>.'
      typy:
        title: <dark_green>Typy i kluczowe bloki</dark_green>
        requires-plugin: Ludnosc
        text:
        - <dark_aqua>mieszkanie</dark_aqua> – całe łóżka (każde = 1 obywatel)
        - <dark_aqua>spichlerz</dark_aqua> – skrzynia lub beczka
        - <dark_aqua>magazyn</dark_aqua> – 2 skrzynie lub beczki
        - <dark_aqua>koszary</dark_aqua> – 2 łóżka (rekrutacja Armii)
        - <dark_aqua>kuznia</dark_aqua> – kowadło + piec
        - <dark_aqua>studnia</dark_aqua> – źródło wody
        - <dark_aqua>karczma</dark_aqua> – beczka + ognisko
        - <dark_aqua>kosciol</dark_aqua> – pulpit + świeca lub dzwon
        - <dark_aqua>ratusz</dark_aqua> – stół kartograficzny + pulpit
      zasady:
        title: <dark_green>Zasady</dark_green>
        requires-plugin: Ludnosc
        text:
        - Cały budynek na ziemi kraju, nie nachodzi na inne budynki ani place budowy.
        - ''
        - Limity (np. 2 kuźnie, 1 kościół) i wymagania epoki oraz poziomu osady jak
          przy zamawianiu. Budowniczowie go nie przebudują ani nie naprawią.
        - ''
        - Zniszczysz kluczowe bloki – funkcja wyłączy się do naprawy. <dark_aqua>/ludnosc
          budynek info</dark_aqua> – czy działa, <dark_aqua>/ludnosc budynek usun</dark_aqua>
          – wyrejestrowanie (bloki zostają).
  poradnik-zaklady:
    title: 'Poradnik: Zakłady'
    name: <dark_green>Zakłady i łańcuchy</dark_green>
    description: Praca, kopalnie, magazyny, huty
    author: MEDIVALRPG
    requires-plugin: Ludnosc
    intro:
    - 'Wioska wytwarza sama: drewno, kamień, szkło, cegły, wełnę i żelazo. Wszystko
      trafia do prawdziwych skrzyń.'
    toc-title: <bold>Tematy</bold>
    sections:
      praca-sezony:
        title: <dark_green>Praca i pory roku</dark_green>
        requires-plugin: Ludnosc
        text:
        - 'Dorośli obywatele pracują według zawodu i wolnych miejsc: <dark_aqua>/ludnosc
          praca</dark_aqua>. Rolnik zbiera, sieje i składa plon do skrzyni.'
        - ''
        - Pora roku trwa domyślnie 7 rzeczywistych dni. Zimą rolnicy nie pracują w
          polu – zrób zapasy jesienią. Nieurodzaj ogranicza plony.
        - ''
        - <dark_aqua>/ludnosc pora</dark_aqua> – pora i plony
        - <click:run_command:'/menu praca-sezony'><dark_aqua>Otwórz pracę i sezony</dark_aqua></click>
      pory-roku:
        title: <dark_green>Wygląd pór roku</dark_green>
        requires-plugin: Pory
        text:
        - 'Świat zmienia wygląd z porą roku: kolory trawy i liści, jesienią spadające
          liście, zimą śnieg. Działa bez modów.'
        - ''
        - <dark_aqua>/pory</dark_aqua> – jaka jest pora i ile dni zostało.
      kopalnie:
        title: <dark_green>Kopalnie</dark_green>
        requires-plugin: Ludnosc
        text:
        - Górnicy odkładają prawdziwy urobek do skrzyni. Pełna skrzynia wstrzymuje
          pracę przed następnym wydobyciem.
        - ''
        - Górnicy zużywają prawdziwe pochodnie – trzymaj je w magazynie.
        - ''
        - '<dark_aqua>/ludnosc kopalnia</dark_aqua> – stan; <dark_aqua>/ludnosc kopalnia
          rozbuduj [id]</dark_aqua> (Doradca+) – poziomy 1–5. Podziemia: <dark_aqua>/ludnosc
          podziemia</dark_aqua>.'
      magazyny:
        title: <dark_green>Magazyny</dark_green>
        requires-plugin: Ludnosc
        text:
        - Każde miejsce pracy potrzebuje skrzyni albo beczki na ziemi kraju. Bez niej
          praca stoi.
        - ''
        - <dark_aqua>/ludnosc magazyn</dark_aqua> – magazyny kraju, <dark_aqua>/ludnosc
          magazyn status</dark_aqua> – ID miejsc pracy i powody postoju.
        - 'Patrząc na skrzynię (Doradca+): <dark_aqua>/ludnosc magazyn powiaz [id]</dark_aqua>
          – skrzynia w budynku wiąże się z nim sama; albo <dark_aqua>/ludnosc magazyn domyslny</dark_aqua>.'
        - ''
        - Tragarze opróżniają pełne skrzynie do magazynu kraju i noszą plony do spichlerza.
      lancuchy:
        title: <dark_green>Łańcuchy produkcji</dark_green>
        requires-plugin: Ludnosc
        text:
        - '<bold>Huta szkła</bold>: piasek z brzegu → szkło i piaskowiec.'
        - '<bold>Cegielnia</bold>: glina z rzeki → cegły i terakota.'
        - '<bold>Owczarnia</bold>: owce → wełna; pszenica → bele siana.'
        - '<bold>Kuźnia</bold>: surowe żelazo → sztabki, kraty, latarnie; kłody i
          węgiel → pochodnie.'
        - ''
        - 'Budowa (Doradca+): <dark_aqua>/ludnosc buduj huta_szkla</dark_aqua>, <dark_aqua>cegielnia</dark_aqua>
          albo <dark_aqua>owczarnia</dark_aqua>.'
        - ''
        - Zakład kopie piasek i glinę tylko na ziemi kraju, w pobliżu. Pracuje, gdy
          w okolicy jest gracz.
        - ''
        - <dark_aqua>/ludnosc zaklady</dark_aqua> – stan, wydobycie dziś, paliwo,
          stado
      paliwo:
        title: <dark_green>Paliwo</dark_green>
        requires-plugin: Ludnosc
        text:
        - 'Piece huty i cegielni palą węgiel: 1 węgiel albo węgiel drzewny = 8 wytopów.
          Bez węgla piec wypala węgiel drzewny z kłód.'
        - ''
        - Węgiel dostają najpierw piece; kuźnia wtedy czeka. Tragarze dowożą węgiel
          albo kłody.
      zakup-monety:
        title: <dark_green>Kiedy budowa kupuje</dark_green>
        requires-plugin: Ludnosc
        text:
        - Materiał jest kupowany za monety, gdy kraj nie ma zakładu albo zakład stoi
          bez surowca lub paliwa dłużej niż 20 min.
        - ''
        - Gdy zakład działa, budowa czeka na tragarzy najwyżej 60 min, potem też kupuje.
        - ''
        - <dark_aqua>/ludnosc budowy</dark_aqua> pokazuje przy materiale „(magazyn)”
          albo „(monety)”.
  poradnik-armia:
    title: 'Poradnik: Armia i flota'
    name: <dark_green>Armia i flota</dark_green>
    description: Rekrutacja, rozkazy, machiny, statki
    author: MEDIVALRPG
    requires-plugin: Armia
    intro:
    - 'Żołnierze NPC kraju, najemnicy, machiny i statki. Pełna pomoc: <dark_aqua>/armia
      pomoc</dark_aqua>.'
    toc-title: <bold>Tematy</bold>
    sections:
      armia:
        title: <dark_green>Rekrutacja i rozkazy</dark_green>
        requires-plugin: Armia
        text:
        - '<dark_aqua>/armia rekrutuj typ [ilość]</dark_aqua> (Doradca+) – wymaga
          koszar, obywateli i pieniędzy w skarbcu. Lista: <dark_aqua>/armia lista</dark_aqua>,
          <dark_aqua>/armia info</dark_aqua>.'
        - ''
        - 'Rozkazy: <dark_aqua>/armia zamna|stoj|wroc</dark_aqua>, <dark_aqua>/armia
          atakuj</dark_aqua>, <dark_aqua>/armia straz [promień]</dark_aqua>, <dark_aqua>/armia
          patrol dodaj|start|wyczysc</dark_aqua>.'
        - ''
        - 'Buława <dark_aqua>/armia bulawa</dark_aqua>: PPM w blok – idźcie tam, PPM
          w cel – atak, Shift+PPM – za mną / stój.'
        - ''
        - Żołnierze dostają żołd ze skarbca i walczą tylko z wrogami w wojnie. Na
          całym serwerze może być najwyżej 1000 żołnierzy; każdy kraj ma też własny
          limit.
      najemnicy:
        title: <dark_green>Najemnicy</dark_green>
        requires-plugin: Armia
        text:
        - Wojsko od ręki, bez poboru i koszar, ale droższe i na kontrakt (72 h).
        - ''
        - <dark_aqua>/armia najmij typ [ilość]</dark_aqua>, <dark_aqua>/armia najemnicy</dark_aqua>,
          <dark_aqua>/armia przedluz [id|wszystkich]</dark_aqua>, <dark_aqua>/armia
          zwolnij-najemnikow</dark_aqua>.
        - ''
        - Bez żołdu najemnicy odchodzą.
      epoki-armii:
        title: <dark_green>Renesans i przezbrojenie</dark_green>
        requires-plugin: Armia
        text:
        - Renesans z odkryciem prochu odblokowuje pikiniera, muszkietera, arkebuzera
          i armatę. Każda epoka wzmacnia HP i obrażenia.
        - ''
        - <dark_aqua>/armia przezbroj [typ] [ilość]</dark_aqua> (Doradca+) – stare
          oddziały na nową broń za część ceny.
        - ''
        - 'Żądanie trybutu od innego kraju: <dark_aqua>/armia trybut przyjmij|odrzuc
          kraj</dark_aqua> (Władca). Rozpuszczenie oddziału: <dark_aqua>/armia rozpusc
          potwierdz</dark_aqua>.'
      machiny:
        title: <dark_green>Machiny oblężnicze</dark_green>
        requires-plugin: Armia
        text:
        - Katapulta (Średniowiecze) i armata (Renesans, proch) rekrutuje się jak żołnierzy.
        - ''
        - 'W trakcie oblężenia spójrz na blok w obleganym chunku: <dark_aqua>/armia
          ostrzal</dark_aqua> – salwa machin oddziału. Każdy pocisk kosztuje kilka
          md ze skarbca.'
        - ''
        - <dark_aqua>/armia amunicja kamien|kula|kartacz</dark_aqua> – katapulta strzela
          kamieniem, armata kulą albo kartaczem.
      taran:
        title: <dark_green>Taran</dark_green>
        requires-plugin: Armia
        requires-command: armia taranuj
        text:
        - 'Taran (Średniowiecze) rekrutujesz w koszarach: <dark_aqua>/armia rekrutuj
          taran</dark_aqua>.'
        - ''
        - 'W trakcie oblężenia spójrz na bramę albo mur w obleganym chunku wroga:
          <dark_aqua>/armia taranuj</dark_aqua> (Doradca+). Tarany oddziału podjeżdżają
          i uderzają co kilka sekund.'
        - ''
        - Drewno pada po 2 ciosach, kamień po 4, umocnienia po 10. Skrzynie i sąsiednie
          chunki są bezpieczne. Taran boi się ognia, strzały niewiele mu robią.
      flota:
        title: <dark_green>Flota i desanty</dark_green>
        requires-plugin: Armia
        text:
        - 'Spójrz na szeroką wodę: <dark_aqua>/armia flota zbuduj transportowiec</dark_aqua>
          (30 zł, 4 graczy + 16 żołnierzy) albo <dark_aqua>karawela</dark_aqua> (Renesans,
          60 zł, 6 + 32).'
        - ''
        - '<dark_aqua>/armia flota wejdz</dark_aqua> – na pokład; <dark_aqua>steruj</dark_aqua>
          – ster: W/S, A/D, Shift puszcza; <dark_aqua>zejdz</dark_aqua> – na brzeg.'
        - ''
        - 'Desant: zbierz oddział (<dark_aqua>/armia zamna</dark_aqua>), <dark_aqua>/armia
          flota zaladuj</dark_aqua>, przy brzegu <dark_aqua>/armia flota desant</dark_aqua>.
          Cudza ziemia tylko w wojnie; przyczółek: <dark_aqua>/kraj desant</dark_aqua>.'
        - ''
        - 'Karawela strzela do wrogich statków: <dark_aqua>/armia flota salwa</dark_aqua>.
          Statki: <dark_aqua>/armia flota lista</dark_aqua>.'
  poradnik-dyplomacja:
    title: 'Poradnik: Dyplomacja'
    name: <dark_green>Dyplomacja i podbój</dark_green>
    description: Sojusze, wojny, oblężenia, NPC
    author: MEDIVALRPG
    requires-plugin: Kraje
    intro:
    - Relacje między krajami, wojna i podbój. Komendy wpisuje Władca, oblężenia także
      Doradca.
    toc-title: <bold>Tematy</bold>
    sections:
      dyplomacja:
        title: <dark_green>Sojusz, pokój, wojna</dark_green>
        requires-plugin: Kraje
        text:
        - <dark_aqua>/kraj sojusz kraj</dark_aqua>, <dark_aqua>/kraj pokoj kraj</dark_aqua>
          – propozycja albo przyjęcie. <dark_aqua>/kraj zerwij kraj</dark_aqua> –
          koniec sojuszu.
        - ''
        - <dark_aqua>/kraj wojna kraj</dark_aqua> kosztuje <cfg:Kraje:war.declare-cost:1000>
          md. Pokój najwcześniej po 2 h wojny.
        - ''
        - 'Sojusznicy mogą otwierać wasze drzwi i furtki. Czat sojuszu: <dark_aqua>/ks
          tekst</dark_aqua>.'
      oblezenia:
        title: <dark_green>Oblężenia</dark_green>
        requires-plugin: Kraje
        text:
        - 'W wojnie stań na chunku wroga przy waszej granicy: <dark_aqua>/kraj oblezenie</dark_aqua>
          (<cfg:Kraje:siege.cost:500> md, do 30 min). Trwające: <dark_aqua>/kraj oblezenia</dark_aqua>.'
        - ''
        - 'Postęp zależy od przewagi sił w chunku: graczy, sojuszników i żołnierzy.
          Pełny pasek = chunk przechodzi do was.'
        - ''
        - Stolicę zdobywa się na końcu. Atakujący mogą w oblężonym chunku niszczyć
          i stawiać bloki (poza skrzyniami).
      wasale:
        title: <dark_green>Kapitulacja i wasale</dark_green>
        requires-plugin: Kraje
        text:
        - '<dark_aqua>/kraj kapitulacja wróg [dni]</dark_aqua> kończy wojnę – kraj
          zostaje wasalem i płaci trybut z podatków. Wróg: <dark_aqua>/kraj kapitulacja
          przyjmij|odrzuc kraj</dark_aqua>.'
        - ''
        - <dark_aqua>/kraj wasale</dark_aqua> – suweren i wasale
        - <dark_aqua>/kraj wykup</dark_aqua> – wykup z wasalstwa
        - <dark_aqua>/kraj zwolnij wasal</dark_aqua> – zwolnienie
      unia-ambasady:
        title: <dark_green>Unie i ambasady</dark_green>
        requires-plugin: Kraje
        text:
        - 'Unia personalna: dwa kraje z jednym władcą. <dark_aqua>/kraj unia zaproponuj|przyjmij|odrzuc
          kraj</dark_aqua>, wybór kraju: <dark_aqua>/kraj unia rzadz</dark_aqua>,
          stan: <dark_aqua>/kraj unia info</dark_aqua>.'
        - ''
        - Zerwanie (<dark_aqua>/kraj unia zerwij</dark_aqua>) wymaga osobnego potwierdzenia
          – sprawdź skutki.
        - ''
        - 'Ambasada to chunk gościa na ziemi gospodarza: <dark_aqua>/kraj ambasada
          otworz kraj</dark_aqua>, <dark_aqua>lista</dark_aqua>, <dark_aqua>tp kraj</dark_aqua>.'
        - ''
        - <click:run_command:'/menu unia'><dark_aqua>Otwórz unię</dark_aqua></click>
        - <click:run_command:'/menu ambasada'><dark_aqua>Otwórz ambasady</dark_aqua></click>
      wladcy:
        title: <dark_green>Państwa i władcy NPC</dark_green>
        requires-plugin: Wladcy
        text:
        - Państwa NPC mają władcę w stolicy; zwykła wioska też może stać się państwem.
        - ''
        - 'Kliknij władcę PPM: okno dyplomacji i przycisk <gold>Porozmawiaj</gold>.
          Albo stań do 6 bloków od niego: <dark_aqua>/wladca rozmowa</dark_aqua>,
          potem pisz na czacie.'
        - ''
        - 'Koniec: <dark_aqua>/wladca koniec</dark_aqua> albo odejdź. Żądanie trybutu
          przyjmujesz lub odrzucasz przyciskami na czacie.'
      wojny-npc:
        title: <dark_green>Wojny państw NPC</dark_green>
        requires-plugin: Kraje
        requires-command: nk wojny
        text:
        - Państwa NPC walczą też ze sobą z dala od graczy i zdobywają ziemie. Wyniki
          widać w ogłoszeniach na czacie i na granicach mapy.
        - ''
        - Gdy gracz jest blisko, zamiast tego toczy się zwykłe oblężenie. Ziemi krajów
          graczy nie zdobywa się w tle.
  poradnik-postep:
    title: 'Poradnik: Postęp i epoki'
    name: <dark_green>Postęp i epoki</dark_green>
    description: Badania, odkrycia, awans epoki
    author: MEDIVALRPG
    requires-plugin: Postep
    intro:
    - Badania i odkrycia prowadzą kraj ze Średniowiecza do Renesansu.
    toc-title: <bold>Tematy</bold>
    sections:
      epoki:
        title: <dark_green>Epoki</dark_green>
        requires-plugin: Postep
        text:
        - 'Kraje rozwijają się od Średniowiecza do Renesansu – to maksymalna epoka
          2. Kolej parowa jest wyjątkiem: dostępna od startu, bez odkrycia i awansu.'
        - ''
        - <dark_aqua>/postep</dark_aqua> – epoka, pasek postępu i czego brakuje
        - <dark_aqua>/postep epoki</dark_aqua> – wymagania epok
        - <dark_aqua>/postep ranking</dark_aqua>, <dark_aqua>/postep kraj kraj</dark_aqua>
      punkty-badan:
        title: <dark_green>Punkty badań</dark_green>
        requires-plugin: Postep
        text:
        - 'Raz dziennie kraj dostaje punkty: od ludności, graczy i budynków nauki
          (biblioteka, szkoła, akademia, uniwersytet).'
        - ''
        - Pokój +10 %, każdy sojusz +5 %, każda wojna −15 %, wasalstwo −10 %.
        - ''
        - <dark_aqua>/postep inwestuj kwota</dark_aqua> (Doradca+) – pieniądze ze
          skarbca od razu stają się punktami; każda kolejna moneta tego dnia daje
          mniej.
      odkrycia:
        title: <dark_green>Odkrycia</dark_green>
        requires-plugin: Postep
        text:
        - 'Średniowiecze: m.in. koło wodne, pług ciężki, kusza, cechy, gotyk. Renesans:
          druk, proch, kartografia, nawigacja, bankowość, manufaktury.'
        - ''
        - Odkrycia dają premie do podatków, jedzenia, siły armii i budowy, a proch
          odblokowuje broń palną.
        - ''
        - <dark_aqua>/postep drzewko</dark_aqua>, <dark_aqua>/postep odkrycia</dark_aqua>
        - <dark_aqua>/postep odkryj odkrycie</dark_aqua> (Doradca+) – odkrywa albo
          ustawia cel badań; <dark_aqua>/postep cel</dark_aqua>
      awans:
        title: <dark_green>Awans epoki</dark_green>
        requires-plugin: Postep
        text:
        - 'Potrzeba naraz: wszystkich wymaganych odkryć epoki, co najmniej 3 tygodni
          w obecnej epoce oraz progów ludności i poziomu osady.'
        - ''
        - 'Wtedy kraj awansuje sam albo Władca potwierdza: <dark_aqua>/postep awansuj</dark_aqua>.'
  poradnik-kolej:
    title: 'Poradnik: Kolej'
    name: <dark_green>Kolej</dark_green>
    description: Przejazdy, bilety, maszyniści
    author: MEDIVALRPG
    requires-plugin: Kolej
    intro:
    - 'Parowozy królewskiego przewoźnika. Pełna pomoc: <dark_aqua>/kolej pomoc</dark_aqua>.'
    toc-title: <bold>Tematy</bold>
    sections:
      kolej:
        title: <dark_green>Kolej parowa</dark_green>
        requires-plugin: Kolej
        text:
        - Kolej jest dostępna od startu, w każdej epoce. Pozostały rozwój kończy się
          na Renesansie.
        - ''
        - Główna linia z bazy królewskiej do spawnu jest w budowie. Robotnicy stawiają
          prawdziwe tory częściami.
        - ''
        - Brak odjazdów oznacza, że linia jeszcze nie działa.
        - <click:run_command:'/menu kolej'><dark_aqua>Otwórz Kolej</dark_aqua></click>
      przejazd:
        title: <dark_green>Przejazd i bilet</dark_green>
        requires-plugin: Kolej
        text:
        - 'Po uruchomieniu linii: <dark_aqua>/kolej odjazdy [stacja]</dark_aqua> pokazuje
          rozkład, także powroty. Te same odjazdy są na tablicach przy peronach.'
        - ''
        - <dark_aqua>/kolej wejdz pociąg</dark_aqua> – wsiadasz; bilet przechodzi
          z twojego konta do przewoźnika. <dark_aqua>/kolej zejdz</dark_aqua> – wysiadasz.
        - ''
        - 'Składy w okienku: <dark_aqua>/kolej panel</dark_aqua> (klik = wejście).'
      stan-pociagu:
        title: <dark_green>Stan pociągu</dark_green>
        requires-plugin: Kolej
        text:
        - <dark_aqua>/kolej pociag lista</dark_aqua>, <dark_aqua>/kolej pociag info
          id</dark_aqua> – ciśnienie, węgiel i woda.
        - ''
        - Parowóz spala prawdziwy węgiel i wodę z tendra. Bez paliwa staje; tender
          uzupełnia się na stacjach.
      maszynisci:
        title: <dark_green>Maszyniści</dark_green>
        requires-plugin: Kolej
        permission: kolej.maszynista
        text:
        - Prowadzić może maszynista z licencją przewoźnika.
        - ''
        - <dark_aqua>/kolej prowadz pociąg</dark_aqua> – kabina stojącego parowozu
        - <dark_aqua>/kolej jedz pociąg stacja</dark_aqua> – cel jazdy
        - <dark_aqua>/kolej ster pociąg 0..100</dark_aqua>, <dark_aqua>/kolej hamulec
          pociąg 0..100</dark_aqua>
        - ''
        - Zejście z kabiny uruchamia hamowanie.
      kolej-firma:
        title: <dark_green>Przewoźnik i wpłaty</dark_green>
        requires-plugin: Kolej
        text:
        - 'Kolej prowadzi prywatny przewoźnik ze swoim kontem: <dark_aqua>/kolej firma
          info</dark_aqua>.'
        - ''
        - <dark_aqua>/kolej firma wplac md</dark_aqua> przekazuje twoje pieniądze
          przewoźnikowi. Najpierw sprawdź kwotę – wpłata nie wraca.
      kolej-zgody:
        title: <dark_green>Zgoda na tory</dark_green>
        requires-plugin: Kolej
        text:
        - 'Tory na ziemi kraju wymagają zgody jego Władcy: <dark_aqua>/kolej zgoda
          tak</dark_aqua>, odwołanie: <dark_aqua>/kolej zgoda nie</dark_aqua>. Sojusz
          nie jest wymagany.'
        - ''
        - 'Władca kraju NPC sam odpowiada na wniosek przewoźnika: zgoda, zgoda za
          opłatą albo odmowa.'
      kolej-zarzad:
        title: <dark_green>Zarząd sieci</dark_green>
        requires-plugin: Kolej
        permission: kolej.admin
        text:
        - <dark_aqua>/kolej siec postep</dark_aqua> – części gotowe, opłacone md,
          bieżąca część i odbiór.
        - ''
        - '<dark_aqua>/kolej uruchom glowna</dark_aqua> – sprawdzenie uruchomienia
          linii, nic nie zmienia. Płatne wykonanie: <dark_aqua>/kolej uruchom glowna
          potwierdz</dark_aqua> – tylko po ukończeniu wszystkich części i odbiorze
          torów.'
        - ''
        - 'Wcześniej postaw beczki wody i węgla na obu końcach. Palacz NPC: <dark_aqua>/kolej
          npc palacz</dark_aqua>.'
        - <click:run_command:'/menu kolej-admin'><dark_aqua>Otwórz zarząd Kolei</dark_aqua></click>
  poradnik-handel:
    title: 'Poradnik: Handel i szlaki'
    name: <dark_green>Handel i szlaki</dark_green>
    description: Karawany, konwoje, zlecenia NPC
    author: MEDIVALRPG
    intro:
    - Karawany przewożą prawdziwy towar, a władcy NPC płacą za zlecenia.
    toc-title: <bold>Tematy</bold>
    sections:
      szlaki:
        title: <dark_green>Karawany i konwoje</dark_green>
        requires-plugin: Szlaki
        text:
        - 'Szlaki przewożą prawdziwy towar ze skrzyni do skrzyni: osłem na drodze
          albo łodzią po morzu. Trasy i przewozy: <dark_aqua>/szlaki lista</dark_aqua>.'
        - ''
        - Towar trafia do celu dopiero po przejechaniu trasy. Gdy okolica nie jest
          wczytana, przewóz czeka; pełna skrzynia celu wstrzymuje rozładunek.
        - ''
        - 'W wojnie można zaatakować wrogi konwój z bliska (<dark_aqua>/szlaki napad
          przewóz</dark_aqua>), a unieruchomiony przejąć: <dark_aqua>/szlaki przejmij
          przewóz</dark_aqua> – potrzebny wolny ekwipunek.'
        - ''
        - 'Obrońca naprawia konwój po 30 s bez ataku: <dark_aqua>/szlaki napraw przewóz</dark_aqua>,
          zostań przy nim 10 s i ponów komendę.'
        - <click:run_command:'/menu szlaki'><dark_aqua>Otwórz karawany i trasy morskie</dark_aqua></click>
      szlaki-projekt:
        title: <dark_green>Projektowanie tras</dark_green>
        requires-plugin: Szlaki
        permission: szlaki.zarzadzanie
        text:
        - 'Zarządca wyznacza trasę drogową lub morską: punkty, przystanki, skrzynie,
          towar, okres i opłatę w md. Każda edycja odbiera zatwierdzenie.'
        - ''
        - Trasę zatwierdza administrator. Start uruchamia odjazdy, stop blokuje nowe;
          konwój w drodze jedzie dalej.
        - <click:run_command:'/menu szlaki-projekt'><dark_aqua>Otwórz projektowanie
          tras</dark_aqua></click>
      zlecenia:
        title: <dark_green>Zlecenia i reputacja</dark_green>
        requires-plugin: Wladcy
        text:
        - Władcy NPC płacą za pomoc. Na ziemi kraju NPC wpisz <dark_aqua>/zlecenia</dark_aqua>
          – tablica dnia z <green>[Przyjmij]</green> i <red>[Odrzuć]</red>, odnawiana
          o północy.
        - ''
        - 'Rodzaje: dostawa dla dworu, surowce, których brakuje krajowi (pilne płacą
          więcej), transport zapieczętowanego ładunku na czas.'
        - ''
        - 'Oddanie w stolicy albo przy władcy: <dark_aqua>/zlecenia oddaj</dark_aqua>.
          Nagroda jest odłożona przy przyjęciu i trafia na twoje konto.'
        - ''
        - 'Reputacja u każdego kraju osobno: <dark_red>Wróg</dark_red>, <red>Nieufny</red>,
          Obcy, <dark_green>Znajomy</dark_green>, <dark_aqua>Przyjaciel</dark_aqua>,
          <gold>Bohater</gold>. Wyższa = lepsze zlecenia.'
        - ''
        - <dark_aqua>/reputacja</dark_aqua>, <dark_aqua>/zlecenia kraj kraj</dark_aqua>,
          <dark_aqua>/zlecenia porzuc</dark_aqua>, <dark_aqua>/zlecenia pomoc</dark_aqua>
  poradnik-turnieje:
    title: 'Poradnik: Turnieje'
    name: <dark_green>Turnieje</dark_green>
    description: Zapisy, pojedynki, ranking
    author: MEDIVALRPG
    requires-plugin: Turnieje
    intro:
    - 'Turnieje rycerskie na arenie i pojedynki. Pełna pomoc: <dark_aqua>/turniej
      pomoc</dark_aqua>.'
    toc-title: <bold>Tematy</bold>
    sections:
      turnieje:
        title: <dark_green>Zapisy</dark_green>
        requires-plugin: Turnieje
        text:
        - 'Przed zapisem sprawdź <dark_aqua>/turniej info</dark_aqua>: arena, termin,
          wpisowe i nagrody. Zapis: <dark_aqua>/turniej zapisz</dark_aqua>.'
        - ''
        - <dark_aqua>/turniej wypisz</dark_aqua> – przed startem zwraca wpisowe, po
          starcie oznacza wycofanie z walki.
        - <click:run_command:'/menu turnieje'><dark_aqua>Otwórz Turnieje</dark_aqua></click>
      pojedynki:
        title: <dark_green>Pojedynki</dark_green>
        requires-plugin: Turnieje
        text:
        - '<dark_aqua>/turniej wyzwij gracz</dark_aqua> – wyzwanie; odpowiedź: <dark_aqua>/turniej
          przyjmij</dark_aqua> albo <dark_aqua>/turniej odrzuc</dark_aqua>.'
        - ''
        - <dark_aqua>/turniej ranking</dark_aqua> – zwycięstwa i tytuły, <dark_aqua>/turniej
          ogladaj</dark_aqua> – widownia areny.
      turniej-zasady:
        title: <dark_green>Zasady walki</dark_green>
        requires-plugin: Turnieje
        text:
        - Na arenie z zestawem turniejowym twój ekwipunek jest przechowany i wraca
          po walce.
        - ''
        - Śmiertelny cios to porażka bez utraty rzeczy. Wylogowanie w trakcie oznacza
          eliminację.
      turniej-organizacja:
        title: <dark_green>Turniej kraju</dark_green>
        requires-plugin:
        - Turnieje
        - Kraje
        text:
        - 'Władca może zorganizować turniej z pulą ze skarbca kraju:'
        - <dark_aqua>/turniej zorganizuj arena pula [wpisowe] [minuty]</dark_aqua>
  poradnik-postac:
    title: 'Poradnik: Postać'
    name: <dark_green>Postać</dark_green>
    description: Interakcje, emotki, życie miasta
    author: MEDIVALRPG
    intro:
    - Interakcje z graczami, pozy, tańce i ceremonie oraz życie mieszkańców osad.
    toc-title: <bold>Tematy</bold>
    sections:
      interakcje:
        title: <dark_green>Interakcje i pozy</dark_green>
        requires-plugin: Interakcje
        text:
        - 'Podejdź do gracza: <dark_aqua>/przytul</dark_aqua>, <dark_aqua>/pocaluj</dark_aqua>,
          <dark_aqua>/trzymaj</dark_aqua> (za zgodą), <dark_aqua>/poglaszcz</dark_aqua>,
          <dark_aqua>/piatka</dark_aqua>, <dark_aqua>/lisc</dark_aqua> + nick. Puść
          dłoń: <dark_aqua>/pusc</dark_aqua>.'
        - ''
        - <dark_aqua>/pomachaj</dark_aqua> i <dark_aqua>/uklon</dark_aqua> działają
          też bez celu. Shift + PPM pustą ręką na gracza otwiera menu.
        - ''
        - 'Pozy: <dark_aqua>/usiadz</dark_aqua> (albo PPM w schody), <dark_aqua>/poloz</dark_aqua>;
          wstajesz kucnięciem.'
        - ''
        - '<dark_aqua>/interakcje wlacz|wylacz</dark_aqua>, <dark_aqua>/interakcje
          blokuj gracz</dark_aqua>. Brak animacji: <dark_aqua>/interakcje pakiet</dark_aqua>.'
      emotki:
        title: <dark_green>Emotki i tańce</dark_green>
        requires-plugin: Interakcje
        text:
        - '<dark_aqua>/taniec 1</dark_aqua> ludowy, <dark_aqua>2</dark_aqua> dworski,
          <dark_aqua>3</dark_aqua> biesiadny; koniec: <dark_aqua>/taniec stop</dark_aqua>
          albo ruch.'
        - ''
        - '<dark_aqua>/emotka nazwa</dark_aqua>: klaskanie, salut, nie_wiem, facepalm,
          modlitwa, kleczenie, poklon, salut_miecz, kufel.'
        - ''
        - 'W stronę gracza: <dark_aqua>/emotka poklon nick</dark_aqua>. Przerwanie:
          ruch, kucnięcie albo <dark_aqua>/emotka stop</dark_aqua>.'
      ceremonie:
        title: <dark_green>Ceremonie</dark_green>
        requires-plugin: Interakcje
        requires-command: interakcje tytul
        text:
        - 'Za zgodą drugiej osoby: <dark_aqua>/uscisk</dark_aqua>, <dark_aqua>/toast</dark_aqua>
          (kufle), <dark_aqua>/reweranse</dark_aqua> (ukłon dworski) + nick.'
        - ''
        - <dark_aqua>/pasuj gracz</dark_aqua> – pasowanie mieczem z ręki; od władcy
          kraju daje tytuł Sir albo Pani. <dark_aqua>/interakcje tytul sir|pani|ukryj|pokaz</dark_aqua>.
        - ''
        - <dark_aqua>/lenno gracz</dark_aqua> – przysięga lenna (sama ceremonia).
          <dark_aqua>/koronuj [gracz]</dark_aqua> – koronacja władcy kraju; obecni
          się kłaniają.
      zycie:
        title: <dark_green>Życie mieszkańców</dark_green>
        requires-plugin: Zycie
        text:
        - 'Obywatele mają plan dnia: praca, targ w południe, wieczorem karczma albo
          dom, nocą łóżko, w niedzielę msza. Dymki mówią, co ich cieszy i martwi.'
        - ''
        - Wroga w wojnie witają krzykiem „Straż!” i uciekają do domów; żołnierze kraju
          ruszają na intruza.
      nastroj:
        title: <dark_green>Nastrój i festyny</dark_green>
        requires-plugin: Zycie
        text:
        - <dark_aqua>/zycie</dark_aqua> – nastrój kraju (0–100), <dark_aqua>/zycie
          kraj kraj</dark_aqua> – innego.
        - ''
        - Podnoszą go jedzenie, łóżka, pensje, pokój i budynki jak karczma czy kościół.
          Obniżają głód, bezdomność, wysokie podatki, wojny i wasalstwo.
        - ''
        - Nastrój mnoży podatki, wzrost i produkcję. Poniżej 20 przez dzień – <red>protest</red>.
          Po zwycięstwie albo nowej epoce – <gold>festyn</gold>.
      pozary:
        title: <dark_green>Pożary</dark_green>
        requires-plugin: Zycie
        text:
        - Przy pożarze bije dzwon, mieszkańcy uciekają, a ochotnicy noszą wodę ze
          studni i gaszą ogień.
        - ''
        - Po pożarze spalone budynki trafiają do kolejki napraw kraju.
  poradnik-admin:
    title: 'Poradnik: Administracja'
    name: <dark_red>Administracja</dark_red>
    description: Nadzór, wydajność, Skarb Świata
    author: MEDIVALRPG
    permission: menu.admin
    intro:
    - Dla administracji. Każdy moduł sprawdza też własne uprawnienia.
    toc-title: <bold>Tematy</bold>
    sections:
      integracje-admin:
        title: <dark_green>Uprawnienia modułów</dark_green>
        requires-plugin:
        - Ludnosc
        - Kolej
        - Turnieje
        permission: menu.admin
        text:
        - menu.admin nie nadaje kolej.admin ani praw innych pluginów.
        - ''
        - Zarządca Kolei ustawia sieć, linie, rozkłady i maszynistów. Ludnosc ma diagnostykę
          pracy i zmianę pór roku. Organizator Turniejów zarządza arenami; tablice
          zleceń odświeża wladcy.admin.
        - <click:run_command:'/menu admin'><dark_aqua>Otwórz administrację</dark_aqua></click>
      wydajnosc:
        title: <dark_green>Wydajność serwera</dark_green>
        requires-plugin: Panel
        permission: panel.health.alerts
        text:
        - <dark_aqua>/panel wydajnosc</dark_aqua> – ostatni pomiar TPS, MSPT, graczy,
          encji i NPC oraz ostrzeżenia.
        - ''
        - 'Wykresy z 24 h: panel WWW → Administracja → Wydajność serwera.'
        - <click:run_command:'/panel wydajnosc'><dark_aqua>Pokaż pomiar na czacie</dark_aqua></click>
      straz:
        title: <dark_green>Straż</dark_green>
        requires-plugin: Straz
        permission: straz.admin
        text:
        - Raport dzienny (9:00), alerty (pula, nowe błędy, kolej, TPS) i nocna kopia
          danych pluginów (4:30, 14 dni).
        - ''
        - <dark_aqua>/straz status</dark_aqua>, <dark_aqua>/straz raport [teraz]</dark_aqua>,
          <dark_aqua>/straz alerty</dark_aqua>, <dark_aqua>/straz kopia lista|teraz</dark_aqua>
      discord-admin:
        title: <dark_green>Discord</dark_green>
        requires-plugin: DiscordBot
        permission: discordbot.admin
        text:
        - <dark_aqua>/discord admin uklad podglad</dark_aqua> – plan zmian kanałów,
          <dark_aqua>uklad zastosuj potwierdz</dark_aqua> – wykonanie (server-info,
          angielskie nazwy, regulamin).
        - ''
        - 'Nowy regulamin: pliki do plugins/DiscordBot/regulamin/, potem <dark_aqua>/discord
          admin tresci odswiez</dark_aqua>. Kronika: <dark_aqua>/discord admin kronika</dark_aqua>.'
        - <click:run_command:'/menu admin-discord'><dark_aqua>Otwórz Discord</dark_aqua></click>
      desant-npc:
        title: <dark_green>Wyprawy NPC za morze</dark_green>
        requires-plugin: Armia
        requires-command: nk desant
        permission: armia.admin
        text:
        - Kraj NPC bez granicy z wrogiem płynie w tle (~6 min na 1000 bloków); ląduje
          dopiero przy graczach u brzegu wroga.
        - ''
        - <dark_aqua>/nk desant kraj [cel]</dark_aqua>, <dark_aqua>/nk desant kraj
          status|anuluj|teraz</dark_aqua>. Przed cofnięciem wersji Armii anuluj trwające
          wyprawy.
      skarb-swiata:
        title: <dark_green>Skarb Świata</dark_green>
        requires-plugin: Skarbiec
        permission: skarbiec.admin
        text:
        - Tylko dla właściciela serwera (sprawdzany UUID, nie samo uprawnienie).
        - ''
