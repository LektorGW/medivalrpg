menus:
  main:
    title: <dark_gray>⚜ </dark_gray><gold><bold>MEDIVALRPG</bold></gold><dark_gray>
      ⚜</dark_gray>
    rows: 6
    border: BLACK_STAINED_GLASS_PANE
    border-corners: ORANGE_STAINED_GLASS_PANE
    auto-slots:
    - 10-16
    - 19-25
    - 28-34
    - 37-43
    items:
      samouczek:
        material: 'KNOWLEDGE_BOOK'
        glow: true
        name: '<green><bold>★ Samouczek</bold></green> <gray>– od czego zacząć'
        lore:
        - '<gray>Dziesięć kroków: pieniądze, kraj, ziemia,'
        - '<gray>domy, jedzenie, budowy, produkcja, armia.'
        - '<green>✔</green> <gray>pokazuje, co masz już za sobą.'
        - '<dark_gray>/samouczek'
        - ''
        - '<gold>Kliknij, aby otworzyć'
        action: 'menu:samouczek'
      discord:
        material: IRON_CHAIN
        name: <blue>Discord — powiązanie konta
        lore:
        - <gray>Jednorazowy kod do połączenia kont.
        requires-plugin: DiscordBot
        requires-command: discord polacz
        action: command:discord polacz
      header:
        slot: 4
        head: viewer
        name: <gold><bold><player></bold></gold>
        lore:
        - '<gray>Kraj: <white><country></white>'
        - '<gray>Ranga: <white><rank></white>'
        - '<gray>Graczy online: <white><online></white>'
        - ''
        - '<dark_gray>Kompas Przewodnik: /przewodnik daj'
      postac:
        material: POPPY
        name: <light_purple>❤ Postać i interakcje</light_purple>
        lore:
        - <gray>Interakcje z graczami, tańce,
        - <gray>emotki i pozy (siadanie, leżenie).
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Interakcje
        action: menu:postac
      kraj:
        material: RED_BANNER
        name: <yellow>♜ Kraj</yellow>
        lore:
        - '<gray>Twój kraj: <white><country></white>'
        - <gray>Teren, ludzie, skarbiec, podatki,
        - <gray>dyplomacja, wojna i wasale.
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Kraje
        permission: kraje.use
        action: menu:kraj
      osada:
        material: BRICKS
        name: <gold>⌂ Osada</gold>
        lore:
        - <gray>Obywatele, budynki, budowanie,
        - <gray>spichlerz, kopalnia, plan miasta.
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Ludnosc
        permission: ludnosc.use
        action: menu:osada
      armia:
        material: IRON_SWORD
        name: <red>⚔ Armia</red>
        lore:
        - <gray>Rekrutacja, rozkazy, straż, patrole
        - <gray>i najemnicy.
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Armia
        permission: armia.use
        action: menu:armia
      postep:
        material: EXPERIENCE_BOTTLE
        name: <aqua>✦ Postęp i epoki</aqua>
        lore:
        - <gray>Epoka twojego kraju, punkty badań,
        - <gray>drzewko odkryć, inwestycje, ranking.
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Postep
        permission: postep.use
        action: menu:postep
      pieniadze:
        material: GOLD_INGOT
        name: <gold>⛃ Pieniądze</gold>
        lore:
        - <gray>Saldo, monety, przelewy, handel
        - <gray>i twoje sklepy.
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Skarbiec
        action: menu:skarbiec
      glos:
        material: NOTE_BLOCK
        name: <green>♪ Czat głosowy</green>
        lore:
        - <gray>Rozmawiaj głosem z graczami obok
        - <gray>(w przeglądarce, bez modów).
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Glos
        permission: glos.use
        action: menu:glos
      teleporty:
        material: ENDER_PEARL
        name: <light_purple>✦ Teleporty</light_purple>
        lore:
        - <gray>Spawn, twoje domy, stolica kraju
        - <gray>i powrót do ostatniej pozycji.
        - ''
        - <gold>Kliknij, aby otworzyć
        action: menu:teleporty
      swiat:
        material: FILLED_MAP
        name: <aqua>⛰ Świat i mapa</aqua>
        lore:
        - <gray>Mapa świata, lista krajów,
        - <gray>panel państwa w przeglądarce, nowości.
        - ''
        - <gold>Kliknij, aby otworzyć
        action: menu:swiat
      pomoc:
        material: BOOK
        glow: true
        name: <gold>❓ Pomoc</gold>
        lore:
        - <gray>Kategorie z poradnikiem „Jak zacząć”,
        - <gray>klikalne komendy i wyszukiwarka.
        - <dark_gray>/pomoc • /pomoc szukaj <fraza>
        - ''
        - <gold>Kliknij, aby otworzyć
        action: menu:pomoc
      ustawienia:
        material: COMPARATOR
        name: <gray>⚙ Ustawienia</gray>
        lore:
        - <gray>Interakcje, czat kraju, pasek
        - <gray>i wskaźnik czatu głosowego.
        - ''
        - <gold>Kliknij, aby otworzyć
        action: menu:ustawienia
      admin:
        material: COMMAND_BLOCK
        name: <red>⚒ Admin</red>
        lore:
        - <gray>Państwa, kraje NPC, scenariusze,
        - <gray>koszty władców, NPC Skarbca, reload.
        - ''
        - <gold>Kliknij, aby otworzyć
        permission: menu.admin
        action: menu:admin
      powrot:
        material: RECOVERY_COMPASS
        glow: true
        name: <green>⟲ Wróć do ostatniej pozycji</green>
        lore:
        - <gray>Tam, gdzie skończyłeś poprzednią grę.
        - <gray>Jednorazowo, przez kilka minut po wejściu.
        - <dark_gray>/powrot • /back
        - ''
        - <gold>Kliknij, aby się teleportować
        condition: can-return
        action: command:powrot
      panstwa:
        slot: 51
        material: FILLED_MAP
        glow: true
        name: <gold>⚑ Państwa</gold> <dark_gray>(admin)</dark_gray>
        lore:
        - <gray>Wszystkie kraje graczy i NPC.
        - <gray>Klik na sztandar – teleport do stolicy.
        - <dark_gray>/kraj admin tp <kraj>
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Kraje
        permission: menu.admin
        action: menu:panstwa
      kolej:
        material: POWERED_RAIL
        name: <gold>Kolej
        lore:
        - <gray>Parowozy, przejazdy i firma przewozowa.
        - <gray>Dostępna od startu, niezależnie od epoki.
        action: menu:kolej
        requires-plugin: Kolej
        permission: kolej.use
      turnieje:
        material: IRON_SWORD
        name: <gold>Turnieje rycerskie
        lore: []
        action: menu:turnieje
        requires-plugin: Turnieje
        permission: turnieje.use
      szlaki:
        material: CHEST_MINECART
        name: <gold>Karawany i szlaki morskie</gold>
        lore:
        - <gray>Karawany drogowe i konwoje morskie.
        - <gray>Rzeczywisty przewóz ze skrzyni do skrzyni.
        requires-plugin: Szlaki
        action: menu:szlaki
      firmy:
        material: GOLDEN_HELMET
        name: <gold>⚒ Firmy</gold>
        lore:
        - <gray>Cechy, kompanie kupieckie i manufaktury.
        - <gray>Wspólne konto, udziały, pensje, sklepy
        - <gray>i magazyny firmy. Ranking firm.
        - ''
        - <gold>Kliknij, aby otworzyć
        requires-plugin: Firmy
        action: menu:firmy
      zamknij:
        slot: 49
        material: BARRIER
        name: <red>Zamknij
        action: close
  samouczek:
    title: '<dark_green>★ Samouczek'
    rows: 5
    border: GREEN_STAINED_GLASS_PANE
    border-corners: LIME_STAINED_GLASS_PANE
    auto-slots:
    - 11-15
    - 20-24
    items:
      naglowek:
        slot: 4
        material: 'KNOWLEDGE_BOOK'
        glow: true
        name: '<green><bold>Samouczek</bold></green>'
        lore:
        - '<gray>Dziesięć kroków od pierwszej monety'
        - '<gray>do własnego kraju z wojskiem.'
        - '<gray>Kliknij krok – wykona albo podpowie'
        - '<gray>właściwą komendę. <green>✔</green> <gray>= już zrobione.'
        - ''
        progress: 'summary'
      krok-pieniadze:
        material: 'GOLD_NUGGET'
        name: '<gold>1. Pierwsze pieniądze'
        lore:
        - '<gray>Monety: 1 zł = 10 sr = 100 md.'
        - '<gray>Kupcy NPC na spawnie skupują plony,'
        - '<gray>drewno, kamień, węgiel i kruszce'
        - '<gray>(PPM na kupca). Bankier obok trzyma'
        - '<gray>monety na koncie: <white>/saldo</white><gray>.'
        - '<gray>Bez pieniędzy nie założysz kraju.'
        - ''
        - '<dark_gray>/skarbiec kupcy • /monety • /spawn'
        - '<gold>Kliknij</gold> <gray>– co kupcy skupują dziś'
        requires-plugin: 'Skarbiec'
        progress: 'pieniadze'
        action: 'command:skarbiec kupcy'
      krok-kraj:
        material: 'RED_BANNER'
        name: '<yellow>2. Dołącz do kraju albo załóż własny'
        lore:
        - '<gray>Kraj to ziemia, obywatele i skarbiec.'
        - '<gray>Dołączasz po zaproszeniu od Doradcy:'
        - '<white>/kraj dolacz <kraj></white><gray>. Własny kraj:'
        - '<gray>stań tam, gdzie ma być stolica,'
        - '<white>/kraj zaloz <nazwa></white> <gray>(<cfg:Kraje:economy.found-cost:500> md'
        - '<gray>z konta albo monet).'
        - ''
        - '<dark_gray>/kraj lista – istniejące kraje'
        - '<gold>Kliknij</gold> <gray>– menu Kraj'
        requires-plugin: 'Kraje'
        permission: 'kraje.use'
        progress: 'kraj'
        action: 'menu:kraj'
      krok-ziemia:
        material: 'GRASS_BLOCK'
        name: '<green>3. Zajmij ziemię'
        lore:
        - '<gray>Kraj rośnie chunk po chunku (16×16).'
        - '<gray>Stań na polu przy granicy i wpisz'
        - '<white>/kraj zajmij</white><gray>. Płaci skarbiec kraju –'
        - '<gray>zasil go: <white>/kraj wplac <kwota></white><gray>.'
        - '<gray>Budynki stawia się tylko na swojej ziemi.'
        - ''
        - '<dark_gray>/kraj mapa • /kraj skarbiec • Doradca+'
        - '<gold>Kliknij</gold> <gray>– wpisz /kraj zajmij'
        requires-plugin: 'Kraje'
        permission: 'kraje.use'
        progress: 'ziemia'
        action: 'suggest:/kraj zajmij'
      krok-mieszkania:
        material: 'OAK_DOOR'
        name: '<gold>4. Chata – mieszkania'
        lore:
        - '<gray>Obywatele NPC mieszkają w łóżkach.'
        - '<gray>Bez wolnych łóżek ludność nie rośnie,'
        - '<gray>a to obywatele płacą podatki do skarbca.'
        - '<gray>Zacznij od chaty.'
        - ''
        - '<dark_gray>/ludnosc buduj chata • Doradca+'
        - '<gold>Kliknij</gold> <gray>– wpisz komendę, potem Enter'
        requires-plugin: 'Ludnosc'
        permission: 'ludnosc.use'
        progress: 'mieszkania'
        action: 'suggest:/ludnosc buduj chata'
      krok-jedzenie:
        material: 'WHEAT'
        name: '<gold>5. Jedzenie: pole i spichlerz'
        lore:
        - '<gray>Ludność rośnie tylko przy zapasie'
        - '<gray>jedzenia; głód ją zmniejsza.'
        - '<gray>Pole daje plony, spichlerz je trzyma.'
        - '<gray>Jedzenie możesz też sam włożyć'
        - '<gray>do skrzyni spichlerza.'
        - ''
        - '<dark_gray>/ludnosc buduj pole • /ludnosc buduj spichlerz'
        - '<dark_gray>/ludnosc spichlerz – zapas jedzenia'
        - '<gold>Kliknij</gold> <gray>– wpisz /ludnosc buduj pole'
        requires-plugin: 'Ludnosc'
        permission: 'ludnosc.use'
        progress: 'jedzenie'
        action: 'suggest:/ludnosc buduj pole'
      krok-budowa:
        material: 'GOLDEN_AXE'
        name: '<green>6. Podgląd i zlecenie budowy'
        lore:
        - '<gray>Po <white>/ludnosc buduj <typ></white> <gray>widzisz obrys i opis:'
        - '<gray>co budynek daje i czego potrzebuje.'
        - '<green>zielony</green> <gray>– można, <red>czerwony</red> <gray>– przeszkoda'
        - '<gray>(powód na czacie), <yellow>żółta linia</yellow> <gray>– drzwi.'
        - '<gray>Potem: <white>obroc</white><gray>, <white>wariant</white> <gray>(inny wygląd),'
        - '<white>potwierdz</white> <gray>(płaci skarbiec) albo <white>anuluj</white><gray>.'
        - '<gray>Budują budowniczowie NPC – to trwa.'
        - ''
        - '<dark_gray>/ludnosc typy – co daje i za ile'
        - '<gold>Kliknij</gold> <gray>– obróć, wariant, zleć, porzuć'
        requires-plugin: 'Ludnosc'
        permission: 'ludnosc.use'
        progress: 'budowa'
        action: 'menu:osada-budowa'
      krok-produkcja:
        material: 'IRON_PICKAXE'
        name: '<gray>7. Produkcja: tartak, kopalnia, kamieniołom'
        lore:
        - '<gray>Tartak, kopalnia i kamieniołom dają drewno,'
        - '<gray>rudy i kamień do swoich skrzyń. Magazyn:'
        - '<gray>tragarze znoszą tam urobek, a budowy biorą'
        - '<gray>stamtąd materiały. Liczy się każda skrzynia'
        - '<gray>i beczka magazynu – możesz wkładać sam.'
        - '<gray>Bez zakładów budowy kupują materiał za monety.'
        - '<gray>Większe budynki wymagają większej osady.'
        - ''
        - '<dark_gray>/ludnosc typy • /ludnosc magazyn'
        - '<gold>Kliknij</gold> <gray>– budynki: co dają i ile kosztują'
        requires-plugin: 'Ludnosc'
        permission: 'ludnosc.use'
        progress: 'produkcja'
        action: 'command:ludnosc typy'
      krok-wlasne:
        material: 'OAK_STAIRS'
        name: '<gold>8. Własne budynki'
        lore:
        - '<gray>Budynek postawiony ręcznie też może'
        - '<gray>pracować dla kraju: mieszkanie,'
        - '<gray>spichlerz, magazyn, koszary…'
        - '<gray>Zaznacz dwa rogi i zgłoś typ.'
        - ''
        - '<dark_gray>/ludnosc kopia pos1 • /ludnosc kopia pos2'
        - '<dark_gray>/ludnosc budynek zglos <typ> • Doradca+'
        - '<gold>Kliknij</gold> <gray>– menu Własne budynki'
        requires-plugin: 'Ludnosc'
        requires-command: 'ludnosc budynek'
        permission: 'ludnosc.use'
        progress: 'wlasne'
        action: 'menu:osada-wlasne'
      krok-armia:
        material: 'IRON_SWORD'
        name: '<red>9. Armia i koszary'
        lore:
        - '<gray>Żołnierze NPC bronią kraju i walczą'
        - '<gray>w wojnach. Rekrut to obywatel, żołd'
        - '<gray>płaci skarbiec. Koszary: każda prycza'
        - '<gray>to +1 do limitu żołnierzy; rekruci stają'
        - '<gray>przy koszarach, a żołnierze leczą się obok.'
        - ''
        - '<dark_gray>/ludnosc buduj koszary • /armia rekrutuj <typ>'
        - '<gold>Kliknij</gold> <gray>– menu Armia'
        requires-plugin: 'Armia'
        permission: 'armia.use'
        progress: 'armia'
        action: 'menu:armia'
      krok-pomoc:
        material: 'BOOK'
        name: '<aqua>10. Gdzie szukać pomocy'
        lore:
        - '<white>/pomoc</white> <gray>– komendy i wyszukiwarka'
        - '<white>/menu poradnik</white> <gray>– poradnik gracza'
        - '<white>/mapa</white> <gray>– mapa świata w przeglądarce'
        - '<white>/panel</white> <gray>– twój kraj w przeglądarce'
        - '<white>/discord</white> <gray>– Discord serwera'
        - ''
        - '<gold>Kliknij</gold> <gray>– Centrum pomocy'
        progress: 'pomoc'
        action: 'menu:pomoc'
      poradnik:
        slot: 38
        material: 'WRITABLE_BOOK'
        name: '<aqua>Poradnik: Samouczek'
        lore:
        - '<gray>Te same kroki jako książka.'
        - '<dark_gray>/menu poradnik samouczek'
        action: 'book:poradnik-samouczek'
      wstecz:
        slot: 40
        material: 'ARROW'
        name: '<yellow>« Wróć do menu'
        action: 'menu:main'
      ukryj:
        slot: 42
        material: 'GRAY_DYE'
        name: '<gray>Nie przypominaj przy wejściu'
        lore:
        - '<gray>Wyłącza wiadomość o samouczku'
        - '<gray>po zalogowaniu. Samouczek zostaje w menu.'
        - '<dark_gray>/samouczek ukryj'
        requires-command: 'samouczek ukryj'
        action: 'command:samouczek ukryj'
      przypominaj:
        slot: 43
        material: 'LIME_DYE'
        name: '<green>Przypominaj przy wejściu'
        lore:
        - '<gray>Włącza z powrotem wiadomość'
        - '<gray>o samouczku po zalogowaniu.'
        - '<dark_gray>/samouczek przypominaj'
        requires-command: 'samouczek przypominaj'
        action: 'command:samouczek przypominaj'
  panstwa:
    title: <dark_gray>⚑ Państwa <gray>(<page>/<pages>)
    rows: 6
    type: countries
    permission: menu.admin
    requires-plugin: Kraje
    border: BLACK_STAINED_GLASS_PANE
    border-corners: ORANGE_STAINED_GLASS_PANE
    content-slots:
    - 10-16
    - 19-25
    - 28-34
    - 37-43
    items:
      info:
        slot: 4
        material: BOOK
        name: <gold>Państwa <gray>(<count>)
        lore:
        - <gray>Sztandar w kolorze kraju.
        - <gray>Z obwódką i kołem – kraj NPC.
        - ''
        - <gold>Kliknij sztandar</gold> <gray>– teleport do stolicy
        - <dark_gray>(bez odliczania, na bezpieczny blok)
      poprzednia:
        slot: 48
        material: ARROW
        name: <yellow>« Poprzednia strona
        lore:
        - <gray>Strona <white><page></white> z <white><pages></white>
        action: page:prev
      wstecz:
        slot: 49
        material: OAK_DOOR
        name: <yellow>« Wróć do menu
        action: menu:main
      nastepna:
        slot: 50
        material: ARROW
        name: <yellow>Następna strona »
        lore:
        - <gray>Strona <white><page></white> z <white><pages></white>
        action: page:next
  interakcje:
    title: <dark_purple>❤ Interakcje
    rows: 5
    type: interactions
    requires-plugin: Interakcje
    border: PURPLE_STAINED_GLASS_PANE
    content-slots:
    - 10-16
    - 19-25
    - 28-34
    items:
      info:
        slot: 4
        material: BOOK
        name: <light_purple>Interakcje
        lore:
        - <gray>Kliknij interakcję, potem gracza obok.
        - <gray>Shift + PPM pustą ręką na gracza
        - <gray>otwiera szybkie menu.
        - '<gray>Puść dłoń: <white>/pusc'
      wstecz:
        slot: 40
        material: ARROW
        name: <yellow>« Wróć
        action: menu:postac
  postac:
    title: <dark_purple>❤ Postać i interakcje
    rows: 4
    requires-plugin: Interakcje
    border: PURPLE_STAINED_GLASS_PANE
    auto-slots:
    - 10-16
    - 19-25
    items:
      interakcje:
        material: POPPY
        name: <light_purple>Interakcje z graczem
        lore:
        - <gray>Całus, przytulenie, piątka, ukłon,
        - <gray>uścisk dłoni, toast, ukłon dworski…
        - <gold>Ceremonie:</gold> <gray>pasowanie na rycerza,
        - <gray>przysięga lenna, koronacja władcy.
        - <gray>Wybierz interakcję i gracza obok.
        - ''
        - <gold>Kliknij, aby otworzyć
        permission: interakcje.use
        action: menu:interakcje
      ruchy:
        material: JUKEBOX
        name: <gold>Tańce i emotki
        lore:
        - <gray>Taniec ludowy, dworski, biesiadny,
        - <gray>klaskanie, salut, pokłon, kufel…
        - <dark_gray>/taniec • /emotka
        - ''
        - <gold>Kliknij, aby otworzyć
        action: menu:ruchy
      usiadz:
        material: OAK_STAIRS
        name: <gold>Usiądź
        lore:
        - <gray>Siadasz na ziemi. Możesz też kliknąć
        - <gray>PPM pustą ręką w schody albo płytę.
        - <dark_gray>/usiadz
        permission: interakcje.sit
        action: command:usiadz
      poloz:
        material: RED_BED
        name: <gold>Połóż się
        lore:
        - <gray>Kładziesz się (inni widzą cię leżącego).
        - <dark_gray>/poloz
        permission: interakcje.lay
        action: command:poloz
      wstan:
        material: LEATHER_BOOTS
        name: <gold>Jak wstać?
        lore:
        - <gray>Kucnij (Shift) albo wpisz
        - <gray>tę samą komendę jeszcze raz.
      pusc:
        material: LEAD
        name: <yellow>Puść dłoń
        lore:
        - <gray>Kończy trzymanie się za ręce.
        - <dark_gray>/pusc
