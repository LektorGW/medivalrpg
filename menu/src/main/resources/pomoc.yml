title: Pomoc MEDIVALRPG
intro:
- 'Kliknij kategorię albo komendę. Szukaj: `/pomoc szukaj <fraza>`.'
categories:
  start:
    name: Start
    summary: konto, menu, spawn i domy
    emoji: 🧭
    icon: COMPASS
    color: green
    description: 'Pierwsze kroki: konto, menu, poradnik, spawn i domy.'
    guide:
    - Załóż konto `/register <hasło> <hasło>`, a przy kolejnych wejściach wpisz `/login
      <hasło>`.
    - Otwórz menu `/menu` albo weź kompas Przewodnik do ręki i kliknij PPM.
    - 'Przeczytaj Poradnik: `/menu poradnik`.'
    - 'Nowy? Samouczek krok po kroku: `/samouczek`.'
    - Dołącz do kraju `/kraj dolacz <kraj>` albo załóż własny `/kraj zaloz <nazwa>`.
    - Zapisz dom `/ustawdom` i wracaj do niego przez `/dom`.
    commands:
    - command: /register <hasło> <hasło>
      description: Rejestracja konta przy pierwszym wejściu (to samo hasło dwa razy)
      keywords:
      - rejestracja
      - zarejestruj
      - reg
      - konto
      - haslo
    - command: /login <hasło>
      description: Logowanie przy kolejnych wejściach
      keywords:
      - logowanie
      - zaloguj
      - l
      - haslo
      - sesja
    - command: /zmienhaslo <stare> <nowe>
      description: Zmiana hasła do konta (kończy też sesje w panelu WWW)
      requires-plugin: Straznik
      keywords:
      - changepassword
      - zmiana hasla
      - haslo
      - konto
    - command: /wyloguj
      description: Wylogowanie i wyjście z serwera (kończy sesję — kolejne wejście
        wymaga hasła)
      requires-plugin: Straznik
      click: run
      keywords:
      - logout
      - wyloguj
      - sesja
    - command: /menu
      description: Główne menu ze wszystkimi funkcjami serwera
      click: run
      keywords:
      - m
      - gui
    - command: /pomoc
      description: 'Centrum pomocy: kategorie, poradniki i wyszukiwarka'
      click: run
    - command: /samouczek
      description: 'Samouczek: 10 kroków od pierwszych monet do własnego kraju'
      requires-command: samouczek
      discord: false
      click: run
      keywords:
      - samouczek
      - tutorial
      - poczatek
      - od czego zaczac
      - nowy gracz
    - command: /samouczek ukryj
      description: Wyłącza przypomnienie o samouczku po zalogowaniu
      requires-command: samouczek ukryj
      discord: false
      click: run
      keywords:
      - nie pokazuj
      - przypomnienie
    - command: /samouczek przypominaj
      description: Włącza z powrotem przypomnienie o samouczku po zalogowaniu
      requires-command: samouczek przypominaj
      discord: false
      click: run
    - command: /menu poradnik
      description: 'Poradnik: spis rozdziałów (każdy rozdział to osobna książka)'
      click: run
      keywords:
      - poradnik
      - ksiazka
      - rozdzial
      - samouczek
    - command: /menu poradnik <rozdział>
      description: Wybrany rozdział, np. kraj, ekonomia, firmy, zaklady, kolej
      insert: '/menu poradnik '
    - command: /przewodnik daj
      description: Nowy kompas Przewodnik, gdy go zgubisz
      click: run
      keywords:
      - kompas
    - command: /spawn
      description: Teleport na spawn (odliczanie, nie ruszaj się)
      click: run
      keywords:
      - sp
    - command: /powrot
      description: 'Raz po wejściu: powrót do ostatniej pozycji'
      keywords:
      - back
    - command: /ustawdom [nazwa]
      description: Zapisz dom w miejscu, w którym stoisz
      keywords:
      - home
    - command: /dom [nazwa]
      description: Teleport do domu
      keywords:
      - home
    - command: /domy
      description: Lista twoich domów (kliknij, aby się teleportować)
      click: run
    - command: /usundom <nazwa>
      description: Usuń dom
    - command: /mapa
      description: Link do mapy świata z granicami krajów
      click: run
      requires-plugin: Kraje
    - command: /panel
      description: Jednorazowy link do panelu kraju w przeglądarce
      click: run
      requires-plugin: Panel
      keywords:
      - www
      - strona
      - przegladarka
    - command: /panel wyloguj
      description: Wyloguj wszystkie sesje panelu www
      requires-plugin: Panel
    - command: /discord polacz
      description: Jednorazowy kod do powiązania konta Minecraft z Discordem (ważny
        5 minut)
      requires-plugin: DiscordBot
      requires-command: discord polacz
      click: run
      keywords:
      - discord
      - polacz
      - autorola
      - konto
    - command: /discord odlacz
      description: Usuń powiązanie kont; zachowuje Whitelisted i dawne role, odbiera
        tylko pozostałe role nadane przez bota
      requires-plugin: DiscordBot
      requires-command: discord odlacz
      keywords:
      - discord
      - odlacz
      - konto
    - command: /discord status
      description: Stan połączenia bota Discord
      requires-plugin: DiscordBot
      requires-command: discord status
      click: run
    - command: /discord pomoc
      description: Pomoc powiązania konta z Discordem
      requires-plugin: DiscordBot
      requires-command: discord pomoc
      click: run
    - command: /discord admin przygotuj potwierdz
      description: Utwórz brakujące role i kanały bota Discord (jawne polecenie administratora)
      requires-plugin: DiscordBot
      requires-command: discord admin przygotuj potwierdz
      permission: discordbot.admin
      discord: false
    - command: /discord admin uklad podglad
      description: Pełny podgląd porządkowania Discorda bez zmian
      requires-plugin: DiscordBot
      requires-command: discord admin uklad podglad
      permission: discordbot.admin
      discord: false
      click: run
    - command: /discord admin uklad zastosuj potwierdz
      description: Utwórz i sprawdź nowy układ; stare kanały pozostają do osobnego
        potwierdzenia, istniejące role są zachowane
      requires-plugin: DiscordBot
      requires-command: discord admin uklad zastosuj potwierdz
      permission: discordbot.admin
      discord: false
    - command: /discord admin uklad usun-stare potwierdz <kod>
      description: 'Osobny nieodwracalny etap: eksport do 1000 wiadomości i usunięcie
        starych kanałów z wyjątkami'
      requires-plugin: DiscordBot
      requires-command: discord admin uklad usun-stare potwierdz
      permission: discordbot.admin
      discord: false
    - command: /discord admin kronika
      description: Stan kolejki kroniki wojen. Fakty po zdarzeniu, grupy co 5 min,
        podsumowanie o 21:00.
      permission: discordbot.admin
      requires-plugin: DiscordBot
      requires-command: discord admin kronika
      discord: false
    - command: /discord admin tresci odswiez
      description: Sprawdź wiadomość server-info i opublikuj regulamin z plików plugins/DiscordBot/regulamin/*.md
      permission: discordbot.admin
      requires-plugin: DiscordBot
      requires-command: discord admin tresci odswiez
      discord: false
      click: run
    - command: /discord admin synchronizuj
      description: Ponownie nadaj role Discorda według powiązań kont i krajów
      permission: discordbot.admin
      requires-plugin: DiscordBot
      requires-command: discord admin synchronizuj
      discord: false
      click: run
  kraj:
    discord-page-2:
      name: Kraj — flagi i sztandary
      description: Chorągwie kraju, sztandary vanilla i przedmioty z własnym obrazkiem.
    name: Kraj
    summary: zakładanie, teren, obywatele i czat
    emoji: 🏰
    icon: RED_BANNER
    color: yellow
    description: Zakładanie kraju, teren, obywatele, wygląd i czat kraju.
    requires-plugin: Kraje
    guide:
    - Stań na wybranym miejscu i wpisz `/kraj zaloz <nazwa>` — ten chunk zostanie
      stolicą.
    - 'Powiększaj teren: `/kraj zajmij` na chunku przylegającym do kraju.'
    - Zapraszaj graczy `/kraj zapros <gracz>`, a zaufanym nadaj Doradcę `/kraj awansuj
      <gracz>`.
    - 'Rozmawiaj tylko z obywatelami: `/kc <wiadomość>`.'
    commands:
    - command: /kraj zaloz <nazwa>
      description: Załóż kraj; chunk pod tobą zostaje stolicą
      rank: bez kraju
    - command: /kraj zajmij
      description: Zajmij chunk, na którym stoisz
      rank: Doradca+
      keywords:
      - teren
      - claim
    - command: /kraj porzuc
      description: Oddaj chunk, na którym stoisz
      rank: Doradca+
    - command: /kraj stolica
      description: Przenieś stolicę na ten chunk
      rank: Władca
    - command: /kraj spawn
      description: Teleport do stolicy kraju
      rank: obywatel
    - command: /kraj zapros <gracz>
      description: Zaproś gracza do kraju
      rank: Doradca+
    - command: /kraj dolacz <kraj>
      description: Dołącz do kraju z zaproszenia
      rank: bez kraju
    - command: /kraj odrzuc <kraj>
      description: Odrzuć zaproszenie do kraju
    - command: /kraj opusc
      description: Opuść swój kraj
    - command: /kraj wyrzuc <gracz>
      description: Wyrzuć obywatela
      rank: Doradca+
    - command: /kraj awansuj <gracz>
      description: Nadaj rangę Doradcy
      rank: Władca
    - command: /kraj degraduj <gracz>
      description: Odbierz rangę Doradcy
      rank: Władca
    - command: /kraj przekaz <gracz>
      description: Przekaż władzę innemu obywatelowi
      rank: Władca
    - command: /kraj rozwiaz
      description: Rozwiąż kraj
      rank: Władca
    - command: /kraj kolor <kolor>
      description: Zmień kolor kraju na mapie i liście
      rank: Władca
    - command: /kraj opis <tekst>
      description: Ustaw opis kraju
      rank: Doradca+
    - command: /kraj info [kraj]
      description: Informacje o kraju
    - command: /kraj lista [strona]
      description: Ranking krajów
    - command: /kraj mapa
      description: Mapa okolicznych chunków na czacie
      click: run
    - command: /kraj czat
      description: Przełącz czat na krajowy i z powrotem
      click: run
    - command: /kc <wiadomość>
      description: Wiadomość do obywateli twojego kraju
    - command: /ks <wiadomość>
      description: Wiadomość do sojuszników
    - command: /kraj pomoc [strona]
      description: Pełna pomoc Kraju z opisami
    - command: /kraj flaga
      discord-page: 2
      description: 'Chorągiew kraju: stan, oczekujące zgłoszenie i link do wgrania
        obrazka w panelu'
      requires-command: kraj flaga
      keywords:
      - choragiew
      - flaga
      - sztandar
      - herb
    - command: /kraj flaga postaw|auto|historia|wycofaj
      discord-page: 2
      description: Postaw chorągiew tutaj albo nad stolicą, historia zgłoszeń, wycofanie
        zgłoszenia
      rank: Władca/Doradca
      requires-command: kraj flaga
    - command: /kraj flaga sztandar [podglad]
      discord-page: 2
      description: Sztandar z wzorem flagi kraju (barwniki) — do postawienia, na tarczę
        i dla wojska; opłata i limit dzienny
      rank: Władca/Doradca
      requires-command: kraj flaga sztandar
      keywords:
      - sztandar
      - tarcza
      - wzor
      - flaga
    - command: /kraj flaga przedmiot
      discord-page: 2
      description: Przedmiot „Sztandar kraju” z dokładnym obrazkiem flagi — w ręce
        i do postawienia (Shift+PPM zabiera)
      rank: Władca/Doradca
      requires-command: kraj flaga przedmiot
      keywords:
      - sztandar
      - flaga
      - dekoracja
  dyplomacja:
    name: Dyplomacja i wojna
    summary: sojusze, wojny, oblężenia i wasale
    emoji: 🛡️
    icon: SHIELD
    color: red
    description: Sojusze, wojny, oblężenia, wasale, unie, ambasady i rozmowy z władcami
      NPC.
    requires-plugin: Kraje
    guide:
    - 'Sojusz i pokój proponuje Władca: `/kraj sojusz <kraj>`, `/kraj pokoj <kraj>`.'
    - Podczas wojny stań na chunku wroga przy granicy i wpisz `/kraj oblezenie`.
    - 'Z władcą NPC porozmawiasz, stojąc obok niego: `/wladca rozmowa`.'
    commands:
    - command: /kraj sojusz <kraj>
      description: Zaproponuj lub przyjmij sojusz
      rank: Władca
    - command: /kraj pokoj <kraj>
      description: Zaproponuj lub przyjmij pokój
      rank: Władca
    - command: /kraj wojna <kraj>
      description: Wypowiedz wojnę
      rank: Władca
    - command: /kraj zerwij <kraj>
      description: Zerwij sojusz
      rank: Władca
    - command: /kraj oblezenie
      description: Rozpocznij oblężenie chunka wroga
      rank: Doradca+
    - command: /kraj oblezenia
      description: Trwające oblężenia
      click: run
    - command: /kraj desant
      description: Zdobądź przyczółek z morza
      rank: Doradca+
    - command: /kraj kapitulacja <wróg> [dni]
      description: Skapituluj i zostań wasalem
      rank: Władca
    - command: /kraj kapitulacja przyjmij <kraj>
      description: Przyjmij kapitulację wroga
      rank: Władca
    - command: /kraj kapitulacja odrzuc <kraj>
      description: Odrzuć kapitulację wroga
      rank: Władca
    - command: /kraj wasale [kraj]
      description: Suweren i wasale kraju
    - command: /kraj wykup
      description: Wykup się z wasalstwa
      rank: Władca
    - command: /kraj zwolnij <wasal>
      description: Zwolnij wasala
      rank: Władca
    - command: /kraj unia zaproponuj <kraj>
      description: Zaproponuj unię personalną
      rank: Władca
    - command: /kraj unia przyjmij <kraj>
      description: Przyjmij unię personalną
      rank: Władca
    - command: /kraj unia odrzuc <kraj>
      description: Odrzuć propozycję unii
      rank: Władca
    - command: /kraj unia rzadz
      description: Wybierz, którym krajem unii rządzisz
      rank: wspólny władca
      discord: false
    - command: /kraj unia zerwij [potwierdz]
      description: Zerwij unię (z potwierdzeniem)
      rank: wspólny władca
    - command: /kraj unia info [kraj]
      description: Unia personalna kraju
    - command: /kraj ambasada otworz <kraj>
      description: Poproś o ambasadę w tym miejscu
      rank: Władca
    - command: /kraj ambasada przyjmij|odrzuc <kraj>
      description: Odpowiedz na prośbę o ambasadę
      rank: Władca
    - command: /kraj ambasada zamknij|wydal <kraj>
      description: Zamknij naszą albo wydal obcą ambasadę
      rank: Władca
      discord: false
    - command: /kraj ambasada lista [kraj]
      description: Ambasady kraju
    - command: /kraj ambasada tp <kraj>
      description: Teleport do ambasady
      rank: obywatel
    - command: /wladca rozmowa
      description: Rozmowa z władcą NPC stojącym obok
      requires-plugin: Wladcy
      keywords:
      - npc
      - krol
    - command: /wladca koniec
      description: Zakończ rozmowę z władcą
      requires-plugin: Wladcy
    - command: /wladca pomoc [strona]
      description: Pomoc rozmów z władcami
      requires-plugin: Wladcy
  ekonomia:
    name: Ekonomia
    summary: monety, bank, handel, sklepy i podatki
    emoji: 💰
    icon: GOLD_INGOT
    color: gold
    description: Monety, bank, przelewy, handel, sklepy oraz skarbiec i podatki kraju.
    requires-plugin: Skarbiec
    guide:
    - 'Monety: miedziak (1 md), srebrnik (10 md) i złota korona (100 md). 1 zł = 10
      sr = 100 md.'
    - Bankier NPC (PPM) przyjmuje i wypłaca monety, kupiec NPC skupuje i sprzedaje
      towary.
    - 'Kupcy: ogólny, kowal, spożywczy, budowlany. Oferta zmienia się z każdą dostawą
      (co 12 h): `/skarbiec kupcy`.'
    - 'Stan konta: `/saldo`; przelew: `/zaplac <gracz> <kwota>`; bezpieczna wymiana:
      `/handel <gracz>`.'
    - 'Sklep: skrzynia z tabliczką [Sklep] / Sprzedam lub Kupię / ilość / cena.'
    commands:
    - command: /saldo
      description: Stan konta w banku i sakiewki
      click: run
      keywords:
      - konto
      - pieniadze
      - kasa
    - command: /monety
      description: Ile monet masz przy sobie
      click: run
      keywords:
      - sakiewka
    - command: /zaplac <gracz> <kwota>
      description: Przelew bankowy do gracza
      keywords:
      - przelew
      - pay
    - command: /handel <gracz>
      description: Bezpieczna wymiana z graczem obok
      keywords:
      - wymiana
      - trade
    - command: /skarbiec kupcy
      description: 'Kupcy i dostawy: co mają, czego szukają, kiedy nowa dostawa'
      requires-plugin: Skarbiec
      click: run
      keywords:
      - kupiec
      - dostawa
      - towary
      - oferta
      - kowal
    - command: /skarbiec sklepy
      description: Lista twoich sklepów
      click: run
    - command: /skarbiec pomoc [strona]
      description: Pełna pomoc pieniędzy i sklepów
    - command: /kraj skarbiec
      description: Stan i operacje skarbca kraju
      rank: obywatel
      requires-plugin: Kraje
      click: run
    - command: /kraj wplac <kwota> [konto|monety]
      description: Wpłać do skarbca kraju
      rank: obywatel
      requires-plugin: Kraje
    - command: /kraj wyplac <kwota>
      description: Wypłać ze skarbca kraju
      rank: Władca
      requires-plugin: Kraje
    - command: /kraj podatek [kwota]
      description: Dzienny podatek od obywateli
      rank: Władca ustawia
      requires-plugin: Kraje
  ludnosc:
    name: Ludność i budowa
    summary: obywatele, budynki, praca i magazyny
    emoji: 👥
    icon: BRICKS
    color: gold
    description: Obywatele, budynki, praca, kopalnie i magazyny.
    requires-plugin: Ludnosc
    discord-page-2:
      name: Ludność — praca, zakłady i obywatele
      description: Zakłady i łańcuchy produkcji, spichlerz, praca, magazyny, kopalnie,
        obywatele i nastrój.
      guide:
      - 'Wioska sama wytwarza szkło, cegły, wełnę i sztabki w zakładach: `/ludnosc
        zaklady`.'
      - 'Pełna skrzynia wstrzymuje pracę – zbuduj magazyn: `/ludnosc magazyn`.'
    guide:
    - Wieśniacy na ziemi kraju zostają obywatelami — potrzebują łóżek i jedzenia.
    - 'Zbuduj dom: `/ludnosc buduj <typ>`, potem `/ludnosc buduj potwierdz`.'
    - 'Pełna skrzynia wstrzymuje pracę – zbuduj magazyn: `/ludnosc magazyn`.'
    - 'Spójrz na wieśniaka i sprawdź jego kartę: `/ludnosc obywatel`.'
    commands:
    - command: /ludnosc info [kraj]
      description: Ludność, jedzenie, podatki
    - command: /ludnosc budynki [kraj]
      description: Budynki i place budowy
    - command: /ludnosc typy
      description: "Budynki: co dają i koszt"
      click: run
    - command: /ludnosc buduj <typ>
      description: Chata, produkcja, zapasy lub koszary — wybierz miejsce
      rank: Doradca+
    - command: /ludnosc buduj obroc|potwierdz|anuluj
      description: Obróć plan, zleć budowę lub porzuć podgląd
      rank: Doradca+
    - command: /ludnosc buduj anuluj [id|potwierdz]
      description: 'Bez argumentu: porzuć podgląd (albo lista placów z id). Plac: id
        albo potwierdz (stoisz na nim); zwrot 100%, gdy prace się nie zaczęły'
      rank: Doradca+
    - command: /ludnosc buduj wariant
      description: Inny wygląd planowanego budynku
      click: run
      keywords:
      - szachulec
      - strzecha
    - command: /ludnosc budowy
      description: 'Place budowy: etap, budowniczowie, braki'
      click: run
    - command: /ludnosc gospodarka
      description: Przepływ materiałów do budów
      click: run
    - command: /ludnosc zaklady
      discord-page: 2
      description: 'Zakłady: huta szkła, cegielnia, owczarnia, kuźnia — paliwo, wydobycie,
        braki'
      click: run
      keywords:
      - szklo
      - cegly
      - welna
      - siano
      - lancuch
      - huta
      - cegielnia
      - owczarnia
      - kuznia
    - command: /ludnosc kopia
      description: 'Kopie budowli graczy: jak to działa'
      click: run
      keywords:
      - szablon
      - schemat
    - command: /ludnosc kopia pos1|pos2|zaznaczenie|wyczysc
      description: Zaznacz budowlę do skopiowania
    - command: /ludnosc kopia zapisz <nazwa> [przód]
      description: Zapisz budowlę jako szablon kraju
      rank: Doradca+
    - command: /ludnosc kopia lista
      description: Kopie budowli twojego kraju
      click: run
    - command: /ludnosc kopia info|buduj|usun <nazwa>
      description: Koszt kopii, budowa albo usunięcie
      rank: Doradca+ (buduj, usun)
    - command: /ludnosc kopia nazwa <stara> <nowa>
      description: Zmień nazwę kopii
      rank: Doradca+
    - command: /ludnosc kolejka
      description: Kolejka budów kraju
      rank: Doradca+
    - command: /ludnosc kolejka anuluj|wyzej|nizej|pokaz <nr>
