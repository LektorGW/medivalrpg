  firmy:
    name: Firmy
    summary: cechy, kompanie i manufaktury graczy
    emoji: ⚒️
    icon: GOLDEN_HELMET
    color: gold
    description: 'Firmy graczy: wspólne konto w Skarbcu, udziały, pensje, sklepy i
      magazyny firmy.'
    requires-plugin: Firmy
    discord-page-2:
      name: Firmy — kontrakty, kredyty i zarząd
      description: Kontrakty z depozytem, zlecenia hurtowe, kredyty, udziały, pensje,
        dywidendy, herb i likwidacja.
    guide:
    - Stań na ziemi kraju, który ma być siedzibą, i wpisz `/firma zaloz <typ> <nazwa>`
      (cech, kompania albo manufaktura). Kosztuje 25 zł opłaty dla kraju i 25 zł kapitału.
    - W kraju gracza zgodę daje Władca albo Doradca (do 72 h, odrzucony wniosek zwraca
      pieniądze); w kraju NPC zgoda jest od razu.
    - Zaproś ludzi `/firma zapros <gracz> <wspolnik|czeladnik>`, wpłacaj `/firma wplac
      <kwota>`, a zyski dziel `/firma dywidenda <kwota>` według udziałów.
    - 'Postaw zwykły [Sklep] na ziemi kraju siedziby i wpisz `/firma sklep`, patrząc
      na niego: utarg trafia do firmy, kraj pobiera podatek od przychodu.'
    commands:
    - command: /firma
      description: 'Okno twojej firmy: konto, ludzie, sklepy, magazyn, księga'
      click: run
      keywords:
      - kompania
      - cech
      - manufaktura
      - firma
    - command: /firma zaloz <typ> <nazwa>
      description: Załóż firmę na ziemi kraju siedziby (25 zł opłaty + 25 zł kapitału)
      insert: '/firma zaloz '
      keywords:
      - zalozenie
      - nowa firma
    - command: /firma start
      requires-command: firma start
      description: Czy mogę założyć firmę? Warunki i zrzutki
      click: run
      keywords:
      - jak zaczac
      - warunki
    - command: /firma zlecenia
      requires-command: firma zlecenia
      description: Tablica zleceń (hurt NPC, kontrakty), najbliższe pierwsze
      click: run
      keywords:
      - tablica
      - zlecenia
      - dostawy
    - command: /firma zrzutka
      requires-command: firma zrzutka
      description: Zrzutki na firmy; wycofaj = zwrot wkładu
      click: run
      keywords:
      - zrzutka
      - wspolnicy
    - command: /firma zrzutka zaloz|dolacz <...>
      requires-command: firma zrzutka
      description: 'Wspólna firma: zaloz typ wkład nazwa / dolacz id kwota'
      insert: '/firma zrzutka '
