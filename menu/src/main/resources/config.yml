# ============================================================
#  Menu — główne menu serwera MEDIVALRPG
#  (c) 2026 Maciej Kaczmarczyk — lektoro.pl
#
#  Menu i książki definiuje się w menus.yml. Tutaj: ustawienia ogólne,
#  kompas „Przewodnik”, /spawn, domy graczy i komunikaty (MiniMessage).
#  Po zmianach: /menu reload
# ============================================================

# Adres mapy świata (squaremap) – placeholder <map_url> i klikalny <map_link>.
map-url: "http://mc.example.org:8100"

placeholders:
  # <country>, gdy gracz nie ma kraju (albo nie ma pluginu Kraje).
  no-country: "brak"
  # <rank>, gdy gracz nie ma kraju.
  no-rank: "-"

menu:
  # Minimalny odstęp między kliknięciami w menu (anty-spam), ms.
  click-cooldown-ms: 250
  # Dźwięki (klucze minecraft, "" = bez dźwięku).
  sounds:
    click: "ui.button.click"
    error: "block.note_block.bass"

# Kompas „Przewodnik” – PPM otwiera /menu.
guide:
  enabled: true
  # COMPASS albo RECOVERY_COMPASS (albo dowolny przedmiot).
  material: COMPASS
  name: "<gold><bold>Przewodnik</bold></gold>"
  lore:
    - "<gray>PPM, aby otworzyć menu"
    - "<dark_gray>Zgubiony? <gray>/przewodnik daj"
  glint: true
  # Daj kompas przy pierwszym wejściu (po zalogowaniu w nLogin). „Pierwsze” = pierwsze od instalacji Menu
  # (lista graczy, którzy już go dostali: plugins/Menu/data/guide-received.txt).
  give-on-first-join: true
  # Slot docelowy: 8 = dziewiąte miejsce paska. Zajęty → pierwszy wolny slot.
  preferred-slot: 8
  # true = można go przekładać w swoim ekwipunku (nigdy do skrzyń, ramek itp.), false = zablokowany w miejscu.
  movable: true
  # Wyrzucenie: delete = znika z komunikatem, jak go odzyskać; block = nie da się wyrzucić.
  on-drop: delete
  # true = nie wypada przy śmierci i wraca po odrodzeniu.
  keep-on-death: true
  # true = (dla COMPASS) igła wskazuje spawn świata z spawn-world (puste = główny świat).
  point-to-spawn: true
  spawn-world: ""
  # Bez nLogina: ile sekund po wejściu dać kompas.
  login-fallback-seconds: 3
  # Z nLoginem: jak długo czekać na zalogowanie (s).
  login-max-wait-seconds: 600

# Samouczek nowego gracza (/samouczek, menu „samouczek” w menus.yml).
# Kroki 1–7 i 9 są odhaczane ze stanu gry (pieniądze, kraj, ziemia, mieszkania, spichlerz, budowa, produkcja, koszary),
# kroki informacyjne po kliknięciu. Stan graczy: plugins/Menu/data/tutorial.json.
tutorial:
  enabled: true
  # Zaproszenie na czacie po pierwszym zalogowaniu i krótkie przypomnienie przy kolejnych wejściach, dopóki gracz
  # nie przejdzie kroków sprawdzanych ze stanu gry albo nie kliknie „nie pokazuj” (/samouczek ukryj).
  # Nic nie jest otwierane ani teleportowane — to tylko wiadomość.
  remind: true
  # Ile sekund po zalogowaniu (Straznik/nLogin) wysłać wiadomość.
  invite-delay-seconds: 3
  # Krok „Pierwsze pieniądze”: tyle miedziaków (konto + monety przy sobie); 100 md = 1 zł.
  money-goal: 100

# Wspólne zasady teleportów /spawn i /dom.
teleport:
  # Ruch o więcej niż tyle bloków od miejsca startu anuluje odliczanie (obrażenia też anulują).
  max-move: 0.5
  # Combat tag: ile sekund po uderzeniu gracza / otrzymaniu ciosu od gracza nie można się teleportować.
  combat-tag-seconds: 10
  # Blokada, gdy gracz stoi na chunku z trwającym oblężeniem (KrajeApi#getSiege; bez pluginu Kraje nieaktywne).
  block-during-siege: true
  # Cząsteczki portalu podczas odliczania i po teleporcie.
  particles: true
  sounds:
    # Co sekundę odliczania ("" = bez dźwięku).
    tick: "block.note_block.hat"
    # Po teleporcie.
    done: "entity.enderman.teleport"

# /spawn (alias /sp). Uprawnienie menu.spawn.bypass (op) pomija odliczanie, cooldown i blokady.
spawn:
  warmup-seconds: 5
  cooldown-seconds: 30
  # Punkt spawnu – ustawia go /ustawspawn (pozycja z obrotem; ustawia też spawn świata).
  # Puste = spawn głównego świata (World#getSpawnLocation).
  location: ""
  # Nowi gracze przy pierwszym wejściu trafiają na spawn (po zalogowaniu w nLogin).
  teleport-new-players: true
  # Odrodzenie po śmierci na /spawn, jeśli gracz nie ma łóżka ani kotwicy odrodzenia.
  respawn-at-spawn: false
  # false = powracający gracz zostaje w miejscu wyjścia zapisanym przez serwer / nLogin.
  # true = każde zalogowanie kończy się na spawnie, z jednorazowym /powrot do ostatniej pozycji.
  always-on-join: false
  # Jak długo po wejściu działa /powrot (minuty; 0 = wyłączone).
  return-window-minutes: 10
  # Pozycja przy wyjściu bliżej niż tyle bloków od spawnu nie nadpisuje zapamiętanej ostatniej pozycji.
  return-keep-radius: 48
  # Niebezpieczna ostatnia pozycja (lawa, przepaść, w bloku) → najbliższe bezpieczne miejsce w tym promieniu.
  return-safe-radius: 8
  # Nazwy NPC Skarbca tworzonych przez /ustawspawn zbuduj.
  npc:
    kupiec: "Kupiec Bartłomiej"
    bankier: "Bankier Zenon"
  # /ustawspawn zbuduj [noair] → podgląd → /ustawspawn zbuduj potwierdz; /ustawspawn cofnij (do restartu).
  # Schematy: plugins/Menu/spawn/spawn.schem, spawn_noair.schem, markers.json (rozpakowywane przy 1. starcie).
  build:
    # Jak długo widać obrys (s) i ile czasu jest na potwierdzenie (s).
    preview-seconds: 30
    confirm-seconds: 120
    # Kierunek patrzenia na spawnie (0 = południe, na tablicę ogłoszeń).
    spawn-yaw: 0
    # Szerokość pasa wygładzania terenu wokół muru (4–6; 0 = bez wygładzania).
    smooth-width: 5
    npc:
      enabled: true
      # Kierunki z README schematu: kupiec na południe (0), bankier na wschód (-90).
      kupiec-yaw: 0
      bankier-yaw: -90
    # Region WorldGuard na obszar schematu + margines, od dołu do góry świata.
    region:
      enabled: true
      id: spawn
      margin: 8
      priority: 10
      # Gracze w regionie nie otrzymują obrażeń (flaga invincible).
      invincible: true
      greeting: "<gold>Witaj w stolicy MEDIVALRPG!"
      farewell: "<gray>Opuszczasz spawn"
      # deny-spawn dla wrogich mobów (pusta lista = mob-spawning deny; to blokuje też zwierzęta).
      deny-spawn: [zombie, zombie_villager, husk, drowned, skeleton, stray, bogged, creeper, spider, cave_spider,
                   enderman, witch, slime, phantom, pillager, vindicator, evoker, ravager, vex, silverfish, breeze]
    # Kraje: obszar chroniony przed zajęciem (/kraj zaloz, /kraj zajmij) – schemat + bufor w chunkach.
    kraje:
      enabled: true
      buffer-chunks: 3

# Domy graczy: /ustawdom [nazwa], /dom [nazwa], /usundom <nazwa>, /domy.
# Dane: plugins/Menu/data/homes.json. Uprawnienie menu.homes.bypass (op) pomija odliczanie, cooldown i blokady.
homes:
  enabled: true
  # Limit domów. Więcej przez uprawnienie menu.homes.<n> (np. menu.homes.3), bez limitu: menu.homes.unlimited (op).
  max: 1
  warmup-seconds: 5
  cooldown-seconds: 30
  # true = dom tylko na terenie własnego kraju albo w dziczy (Kraje). Gdy teren domu przejdzie
  # do obcego kraju (np. podbój), teleport do niego jest zablokowany.
  only-own-or-wild: true

book:
  # Szerokość linii w pikselach (strona książki ma 114 px; mniejsza wartość = zapas bezpieczeństwa).
  line-width: 112
  # Linie na stronę (maks. 14).
  lines-per-page: 14

