# ============================================================
#  Do dopisania w menu/src/main/resources/pomoc.yml (kategoria `firmy`, lista `commands`) DOPIERO przy wdrożeniu
#  jara etapu 2 / 3 (komend etapu 2 i 3 nie ma w jarze etapu 1).
