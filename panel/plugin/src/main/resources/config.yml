# Adres Workera Cloudflare (bez końcowego ukośnika). Plugin łączy się z wss://<adres>/plugin.
# Puste = panel wyłączony.
worker-url: "https://panel.example.workers.dev"

# Sekret współdzielony z Workerem (Worker secret PANEL_SECRET).
# Gdy pusty, plugin przy starcie wygeneruje losowy (48 znaków) i zapisze go tutaj.
plugin-secret: ""

# ---- role panelu --------------------------------------------------------------------------
# Admin panelu (pełny dostęp, także do państw NPC). Nicki graczy (wielkość liter bez znaczenia).
# Dodawanie: /panel admin dodaj <nick> (z konsoli albo przez istniejącego admina).
admins: []
# true = każdy op serwera jest też adminem panelu. Domyślnie false: opy NIE są adminami panelu.
ops-are-admins: false
# „Zarządcy państw NPC” (globalni): dostęp tylko do zarządzania państwami NPC (admin.npc.*),
# bez usuwania krajów, ekonomii, listy graczy i audytu. Przypisanie do JEDNEGO kraju NPC:
# /panel zarzadca przypisz <kraj> <nick> (zapis w plugins/Panel/data.json).
npc-managers: []

# ---- limity -------------------------------------------------------------------------------
limits:
  # Logowanie hasłem: maks. nieudanych prób w oknie czasu, osobno dla nicku i dla adresu IP.
  login-attempts: 5
  login-window-minutes: 15
  # Ile minut ważny jest link logowania z /panel (informacyjnie; ważność pilnuje Worker).
  link-minutes: 10
  # Odstęp między kolejnymi linkami /panel jednego gracza (sekundy).
  link-cooldown-seconds: 10
  # Maks. zmian (mutacji) na minutę wykonanych przez jednego użytkownika panelu.
  mutations-per-minute: 30
  # Ile czasu (ms) czekać na główny wątek serwera; Worker czeka 10 s, więc trzymaj mniej.
  rpc-timeout-ms: 8000
  # Maks. długość opisu kraju (Kraje ma też własny limit: country.description-max-length).
  description-max-length: 200
  # Maks. żołnierzy w jednym zamówieniu (rekrutacja / rozpuszczenie / dodanie przez admina).
  max-army-count: 64
  # Ile wpisów historii skarbca i dziennika AI wysyłać w country.get.
  treasury-log: 20
  npc-log: 30
  # Ile ostatnich wpisów audytu trzymać w pamięci dla admin.audit (pełny log jest w audit.log).
  audit-memory: 1000

# Powiadomienia w grze o zmianach z panelu (dla członków kraju, którego dotyczą).
notify-in-game: true

# Historia państw (wykresy w panelu): co godzinę próbka skarbca, ludności, żołnierzy, chunków i jedzenia
# każdego państwa NPC do plugins/Panel/history/<id kraju>.json. player-countries: true = także kraje graczy.
history:
  enabled: true
  player-countries: false
  keep-days: 30

# Gospodarka kraju (panel: #/gospodarka/<kraj>, RPC country.economy): produkcja, skrzynie, spichlerz, tragarze, budowy,
# braki i obywatele z Ludnosc (materialFlow). Widzą: władca i doradcy kraju, admin panelu, WorldSteward, zarządca kraju NPC.
# Odczyt na głównym wątku; gotowa odpowiedź jest trzymana w pamięci serwera cache-seconds na kraj (Worker i przeglądarka
# jej nie zapisują). fresh (przycisk „Odśwież”) przebudowuje ją najwyżej co fresh-min-seconds.
# Próbnik: co sekundę najwyżej JEDEN kraj, którego ostatnia próbka jest starsza niż sample-seconds — do szacunku
# dziennej produkcji (przyrost towaru w skrzyniach) i wykresów 24 h; pomija rundę, gdy średni tick > skip-above-mspt,
# a odczyt dłuższy niż budget-ms wstrzymuje go proporcjonalnie. Historia jest tylko w pamięci (restart ją zeruje).
economy:
  enabled: true
  cache-seconds: 15
  fresh-min-seconds: 5
  sample-seconds: 300
  # Kraj, którego odczyt trwał k × budget-ms, jest próbkowany k razy rzadziej. Państwa NPC: tylko na żądanie
  # (gdy ktoś otworzy stronę); true = próbkuj je także w tle.
  sample-npc-countries: false
  budget-ms: 8
  skip-above-mspt: 45

# Edytor planu państwa NPC (zakładka „Plan”): podkład mapy z góry (admin.npc.mapRender).
map-render:
  # Margines wokół ziemi kraju (bloki); strona może poprosić o 0–128.
  margin: 32
  # Największy bok obrazu w pikselach; większy obszar jest skalowany 2:1 (albo 4:1…).
  max-size: 768
  # Najwięcej chunków na jedną mapę (przy większym kraju margines maleje).
  max-chunks: 4096
  # Niezaładowane (ale wygenerowane) chunki: ile najwyżej wczytać asynchronicznie na jedną mapę i ile naraz.
  max-async-loads: 1500
  parallel-loads: 8
  # Ile snapshotów chunków robić na jeden tick serwera (główny wątek).
  snapshots-per-tick: 24
  # Po ilu ms odpowiedzieć częściową mapą, jeśli pełna jeszcze się nie zrobiła (Worker czeka 10 s).
  wait-ms: 5500
  # Jak długo trzymać gotową mapę kraju w pamięci.
  cache-seconds: 60
  # Po ilu sekundach przerwać zbieranie chunków (reszta zostaje pusta).
  job-timeout-seconds: 60
  # Limit rozmiaru PNG po zakodowaniu base64 (KB); większy obraz jest dodatkowo zmniejszany 2:1.
  max-png-kb: 1400

plan:
  # Ile bloków poza ziemią kraju mogą leżeć punkty planu (z ostrzeżeniem).
  margin: 32

# Narzędzie „Teren” edytora (admin.npc.territory): zajmowanie i zwalnianie chunków państwa NPC.
territory:
  # Koszt zajęcia chunka jak w Kraje: cost-base + cost-per-chunk × liczba chunków kraju.
  # read-kraje-config: true = weź economy.claim-cost-base / claim-cost-per-chunk z plugins/Kraje/config.yml.
  cost-base: 50
  cost-per-chunk: 5
  read-kraje-config: true
  # Ile chunków zajmować/zwalniać na jeden tick serwera.
  changes-per-tick: 32

# Wydajność serwera (panel: Administracja → „Wydajność serwera”, RPC admin.health, w grze /panel wydajnosc).
# Co interval-seconds: TPS, MSPT (średni czas ticka), gracze, załadowane chunki i encje oraz NPC pluginów
# Ludnosc / Armia / Skarbiec / Wladcy / Zycie (po znacznikach PDC). Historia: fine-minutes pełnej rozdzielczości
# + coarse-hours agregatów minutowych, zapis w plugins/Panel/health.json (co save-minutes i przy wyłączeniu).
health:
  enabled: true
  interval-seconds: 10
  fine-minutes: 60
  coarse-hours: 24
  # Liczenie NPC przegląda wszystkie załadowane encje (główny wątek; czas widać w panelu jako „skan NPC”).
  # npc-scan-every: 3 = licz NPC co trzeci pomiar (między skanami panel pokazuje ostatni wynik).
  npc-scan: true
  npc-scan-every: 1
  save-minutes: 10
  # Najwięcej punktów na jednym wykresie (dłuższe zakresy są uśredniane) i krajów w rozbiciu NPC.
  max-points: 720
  country-limit: 50
  # Progi ostrzeżeń (0 = wyłączony). TPS ostrzega PONIŻEJ progu, reszta POWYŻEJ.
  # sustain-samples: ile kolejnych pomiarów musi przekraczać próg, zanim ostrzeżenie się włączy.
  thresholds:
    tps: 18.0
    tps-critical: 15.0
    mspt: 45.0
    mspt-critical: 50.0
    npc: 2000
    npc-critical: 3000
    entities: 8000
    entities-critical: 12000
    sustain-samples: 2
    # Osobne progi NPC jednego pluginu, np. armia: 1000 (globalny limit wojska).
    npc-plugin:
      armia: 1000
  # Komunikaty w grze przy nowym ostrzeżeniu: gracze z uprawnieniem (domyślnie op) i admini panelu online.
  # cooldown-minutes: najczęściej jeden komunikat na rodzaj i poziom ostrzeżenia.
  alerts:
    enabled: true
    permission: panel.health.alerts
    panel-admins: true
    cooldown-minutes: 15
    recovery: true
    console: true

# Logowanie wiadomości wymienianych z Workerem (diagnostyka; hasła nie są logowane).
debug: false

