#
#  Panel 2026-10-27: „Wydajność serwera” (TPS, MSPT, NPC). Przycisk w menu admina (menus.admin.items, rząd „serwer”)
#  pokazuje na czacie ostatni pomiar i aktywne ostrzeżenia; pełne wykresy są w panelu WWW:
#  Administracja → Wydajność serwera (#/admin/serwer).
#  Uprawnienie panel.health.alerts (domyślnie op) — to samo, które dostaje komunikaty o spadku wydajności.
#  keep-open: false — wynik jest na czacie, menu ma się zamknąć.
# ============================================================

menus:
  admin:
    items:
      wydajnosc:
        material: CLOCK
        name: "<gold>⚠ Wydajność serwera"
        lore:
          - "<gray>TPS, czas ticka (MSPT), gracze, encje"
          - "<gray>i liczba NPC pluginów (Ludność, Armia, Skarbiec…)."
          - "<gray>Wykresy z 24 h: panel WWW → Administracja."
          - ""
          - "<gold>Kliknij</gold> <gray>– stan teraz na czacie"
          - "<dark_gray>/panel wydajnosc"
        requires-plugin: Panel
        permission: panel.health.alerts
        action: "command:panel wydajnosc"

