# Skarbiec — ekonomia MEDIVALRPG
# © 2026 Maciej Kaczmarczyk — lektoro.pl
#
# Kwoty: liczba = miedziaki albo tekst, np. "1 zł 5 sr" (1 sr = 10 md, 1 zł = 100 md).

world-economy:
  # Włączyć dopiero po migracji sald i pełnym spisie fizycznych monet.
  # Stała pula: 1 000 000 zł; właściciel: WorldSteward. Brak automatycznych dopłat.
  enabled: false
  # Domknięcie puli obywateli NPC (world:households).
  labor-share:
    # Udział „robocizny” w płatnościach za budowy, naprawy, modernizacje, drogi, wyrównanie terenu, rozbudowę kopalni
    # i chaty opłacane przez obywateli (powody z prefiksami poniżej). Ten % płatności to wynagrodzenie obywateli NPC:
    # najpierw jest ZALEGŁOŚCIĄ płatnika (pieniądze zostają w world:payments), zwroty `Ludnosc: zwrot…` ją zmniejszają
    # (zwrot 100 % z kolejki kasuje ją całą), a po `settle-after-hours` przechodzi jednym przelewem do world:households.
    # Zwrot nigdy nie jest blokowany: gdy world:payments nie wystarcza, brakująca część wraca z world:households.
    # 0 = wyłączone. Pieniądze tylko przechodzą między pulami świata; suma 100 000 000 md bez zmian.
    percent: 60
    # Najwyżej tyle dziennie trafia do obywateli (md); 0 = bez limitu. ~3000 pokrywa ~2500 md/dzień drenażu z zapasem.
    daily-cap: 3000
    # Gdy pula obywateli ma już tyle (md), nic nie przechodzi. 0 = bez celu.
    target-balance: 400000
    settle-after-hours: 24
    prefixes:
      - "Ludnosc: budowa "
      - "Ludnosc: drogi"
      - "Ludnosc: naprawa "
      - "Ludnosc: modernizacja "
      - "Ludnosc: wyrównanie terenu"
      - "Ludnosc: rozbudowa kopalni"
      - "Ludnosc: obywatele opłacają budowę chaty"
    refund-prefixes:
      - "Ludnosc: zwrot"
  grants:
    # Jednorazowe zasilenia wdrożeniowe z rezerwy (obywatele NPC 312 600 md, kupcy 50 000 md).
    # false (zalecane): wykonuje je właściciel komendą /skarbswiata wdrozenie albo w panelu po sprawdzeniu bilansu.
    # true: wykonują się raz przy starcie. Każde ma własny klucz jednorazowości (plik bank/grants.json + wpis w księdze).
    auto-on-start: false

storage:
  # Co ile sekund migawka kont (accounts.json). Każda operacja i tak trafia od razu do dziennika (journal.log).
  snapshot-interval-seconds: 60
  # Wymuszaj zapis dziennika na dysk (fsync) po każdej paczce operacji — odporność na awarię zasilania.
  fsync: true
  # Ile dni trzymać dzienne pliki logów transakcji (bank/logs/).
  log-keep-days: 90
  # Strefa czasu dla „dnia” (limity kupca, rotacja logów). Puste = strefa serwera.
  timezone: "Europe/Warsaw"

coins:
  # Poświata (glint) na monetach — łatwiej odróżnić je od zwykłych bryłek.
  glint: true
  copper:
    name: "<#c47a3a>Miedziak"
    lore:
      - "<gray>Moneta Skarbca"
      - "<dark_gray>Wartość: 1 md"
  silver:
    name: "<#d8dde3>Srebrnik"
    lore:
      - "<gray>Moneta Skarbca"
      - "<dark_gray>Wartość: 10 md (1 sr)"
  gold:
    name: "<gold>Złota korona"
    lore:
      - "<gray>Moneta Skarbca"
      - "<dark_gray>Wartość: 100 md (1 zł)"

bank:
  # Trzy przyciski szybkiej wypłaty u bankiera.
  quick-withdraw: ["1 sr", "1 zł", "10 zł"]
  # Czas na wpisanie „innej kwoty” na czacie.
  chat-input-timeout-seconds: 30

pay:
  # /zaplac: anywhere = wszędzie, banker = tylko w pobliżu bankiera NPC.
  mode: anywhere
  banker-radius: 8
  min-amount: 1

merchant:
  # Zapłata za skup: coins = monety do ekwipunku, account = na konto bankowe. Zakupy u kupca tak samo.
  payout: coins
  # Maksymalny zarobek jednego gracza u kupców dziennie (anty-farma). 0 = bez limitu.
  daily-limit: "500 zł"
  # Spadek ceny przy dużej podaży: co `step` sztuk danego towaru sprzedanych dziś przez WSZYSTKICH graczy
  # cena skupu spada o `drop-percent` %, najniżej do `min-percent` % ceny bazowej. Reset o północy.
  supply:
    enabled: true
    step: 256
    drop-percent: 5
    min-percent: 40
  # Zmienna oferta: co `period-hours` kupiec zmienia ceny skupu o ±`price-swing-percent` % i wybiera `featured`
  # towarów, których szuka (+`featured-bonus-percent` % ceny, limit sztuk × `featured-limit-multiplier`, błysk w GUI).
  # Wszyscy kupcy mają tę samą ofertę. Cena skupu nigdy nie dorównuje cenie sprzedaży (brak zysku na odsprzedaży).
  rotation:
    enabled: true
    period-hours: 3
    price-swing-percent: 15
    featured: 6
    featured-bonus-percent: 40
    featured-limit-multiplier: 2
  # Rynek dynamiczny: kupiec ma prawdziwy magazyn i budżet (konto world:merchant w zamkniętym obiegu).
  # - Zapas: czego ma dużo, kupuje i sprzedaje taniej; czego brakuje, płaci więcej i drożej sprzedaje.
  #   Mnożnik = (cel / zapas)^elasticity, w granicach min-percent..max-percent % ceny bazowej z cennika.
  #   Cel zapasu = target-bundles partii (albo `target-stock` przy towarze w cenniku).
  # - Budżet: mnożnik ceny SKUPU = (budżet / budget.target)^budget.elasticity, w granicach budget.min..max-percent %.
  #   Mniej pieniędzy = niższe ceny i proporcjonalnie mniejsze limity sztuk; pusty budżet = kupiec nie skupuje.
  # - Sprzedaje wyłącznie to, co ma w magazynie. Cena sprzedaży jest zawsze o spread-percent % wyższa niż cena skupu.
  # - Ceny są płynne: zapas odniesienia dochodzi do rzeczywistego z połowicznym czasem smoothing-hours,
  #   skup liczy się od większego, sprzedaż od mniejszego z nich (szybki zrzut ani wykup nie dają zysku).
  # - Nadwyżkę ponad cel kupiec wywozi: surplus-decay-percent-per-day % nadwyżki dziennie (przedmioty znikają, pieniądze nie).
  # - Przedmioty NIE powstają z powietrza. Wyjątek tylko jawnie: `restock-per-day: N` przy towarze w cenniku
  #   oznacza, że kupiec sam dostarcza N sztuk dziennie, do poziomu celu (domyślnie żaden towar tego nie ma).
  market:
    enabled: true
    target-bundles: 32
    elasticity: 0.5
    min-percent: 50
    max-percent: 175
    spread-percent: 25
    smoothing-hours: 6
    surplus-decay-percent-per-day: 10
    low-stock-percent: 50
    high-stock-percent: 150
    history-hours: 168
    budget:
      target: "500 zł"
      elasticity: 0.5
      min-percent: 30
      max-percent: 125
  # Dostawy: pełny katalog jest duży, ale w danym okresie każdy typ kupca handluje tylko częścią. Towary stałe
  # (`core: true` w cenniku albo `core:` typu) są zawsze, reszta jego kategorii rotuje co `period-hours` godzin
  # (pierwsza dostawa dnia o `start-hour` czasu storage.timezone). Wybór jest deterministyczny (typ, numer okresu,
  # pora roku) — po restarcie ten sam. Towary z `seasons:` pojawiają się tylko w swojej porze roku z Ludnosc
  # (bez Ludnosc nie ma ich wcale) w osobnych miejscach `seasonal`. `featured` towarów z oferty typu kupiec szuka
  # (premia z `rotation.featured-bonus-percent`, limit × `rotation.featured-limit-multiplier`); wahania cen ±
  # `rotation.price-swing-percent` nadal co `rotation.period-hours`. Zapas towaru spoza oferty czeka w magazynie
  # (bez wywozu nadwyżki) i wraca razem z towarem. enabled: false = każdy typ handluje całym swoim katalogiem.
  # Wszystkie typy mają WSPÓLNY magazyn, budżet world:merchant i dzienne limity sztuk/zarobku.
  default-type: ogolny
  assortment:
    enabled: true
    period-hours: 12
    start-hour: 6
    featured: 4
    preview: true
  # Typy kupców (NPC: /skarbiec npc stworz kupiec ["nazwa"] [skin] [typ], zmiana: /skarbiec npc typ <id|najblizszy> <typ>).
  # categories: kategorie z cennika ("*" = wszystkie), core: dodatkowe towary zawsze w ofercie,
  # rotating: towary z dostawy naraz, seasonal: miejsca na towary sezonowe. Kupcy bez typu dostają default-type.
  types:
    ogolny:
      name: "<green>Kupiec ogólny"
      icon: WHEAT
      categories: ["*"]
      core: []
      rotating: 20
      seasonal: 2
    spozywczy:
      name: "<gold>Kupiec spożywczy"
      icon: BREAD
      categories: [plody, przyprawy, ziola, zywnosc, ryby, nasiona]
      core: [BEETROOT, WHEAT_SEEDS, EGG, COOKED_BEEF, COD]
      rotating: 16
      seasonal: 3
    budowlany:
      name: "<aqua>Rzemieślnik budowlany"
      icon: BRICKS
      categories: [drewno, kamien, budulec, wyroby, barwniki, tekstylia, zwierzece]
      core: [OAK_PLANKS, STONE_BRICKS, SAND, GLASS, BRICKS, CLAY_BALL, WHITE_WOOL]
      rotating: 18
      seasonal: 1
    kowal:
      name: "<gray>Kowal"
      icon: IRON_AXE
      categories: [paliwo, kruszce, narzedzia, bron, zbroja, jezdziectwo]
      core: [RAW_IRON, COPPER_INGOT, GOLD_INGOT, IRON_PICKAXE, IRON_SWORD, ARROW]
      rotating: 12
      seasonal: 0
  # Cennik (pełny katalog). amount = sztuk w partii (jedno kliknięcie), buy = ile kupiec PŁACI za partię,
  # sell = ile kupiec BIERZE za partię (0/brak = nie sprzedaje), daily-limit = sztuk na gracza dziennie (0 = bez),
  # category = kategoria (typy kupców), core: true = zawsze w ofercie, seasons = pora roku Ludnosc (wiosna|lato|jesien|zima).
