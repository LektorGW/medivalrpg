shops:
  enabled: true
  # Maks. sklepów jednego gracza (skarbiec.admin bez limitu).
  max-per-player: 10
  max-price: "1000 zł"
  # Maks. ilość w jednej transakcji (linia 3 tabliczki).
  max-amount: 576
  containers: [CHEST, TRAPPED_CHEST, BARREL]
  # Gdzie wolno zakładać sklepy (wymaga pluginu Kraje; bez niego — wszędzie):
  #   anywhere    — wszędzie
  #   own-or-wild — na terenie własnego kraju albo w dziczy
  #   own         — tylko na terenie własnego kraju
  territory: own-or-wild
  # Sklep „Kupię”: sprzedający dostaje zapłatę jako monety (coins) albo przelewem na konto (account).
  # Pieniądze zawsze schodzą z konta bankowego właściciela sklepu.
  buy-payout: coins

trade:
  # Maks. odległość graczy podczas /handel (bloki).
  range: 10
  countdown-seconds: 3
  request-timeout-seconds: 60

npc:
  # NPC obracają głowę do najbliższego gracza.
  look-at-players: true
  look-radius: 6
  default-name:
    banker: "<gold>Bankier"
    merchant: "<green>Kupiec"
  # Domyślny skin (nick konta Mojang). Puste = losowy z 9 domyślnych skinów, stały dla danego NPC.
  # Zmiana: /skarbiec npc skin <id|najblizszy> <nick|losowy>
  default-skin:
    banker: ""
    merchant: ""
  # Kramy kupców (modele BetterModel `skarbiec_kram_<typ>`, osobny dla każdego typu). Stawia admin:
  # /skarbiec kram postaw|przesun|obroc|usun. Bez BetterModel kupcy działają bez kramów.
  # Modele są tylko pakietowe (bez bytów w świecie i bez kolizji) — gracz swobodnie podchodzi i klika kupca.
  stalls:
    enabled: true
    # Odległość (bloki), z której gracz widzi kram.
    view-distance: 48
    # Kopiuj modele do plugins/BetterModel/models przy starcie (podmienia tylko własne pliki skarbiec_kram_*).
    install-models: true

# Statystyki Skarbu Świata (panel, tylko WorldSteward).
stats:
  census:
    # Spis monet: ile ms na tick wolno liczyć załadowane chunki (główny wątek).
    live-ms-per-tick: 2.0
    # Odczyt plików świata w tle: procent czasu pracy wątku (reszta to przerwy, żeby nie obciążać dysku i CPU).
    disk-duty-percent: 40
  trail:
    # Log ruchów stosów monet (podniesienie, upuszczenie, skrzynie, lejki). Bez numerów seryjnych — monety dalej się stackują.
    enabled: true
    max-events-per-second: 200

# Diagnostyka: loguj każde kliknięcie w NPC/hitbox (typ zdarzenia, stan anulowania, inne pluginy nasłuchujące).
debug-npc-clicks: false

