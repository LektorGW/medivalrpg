    handel: "Handel"
    sklepy: "Sklepy"
    admin: "Admin"
  help-entries:
    saldo:
      short: "stan konta i sakiewki"
      description: "Pokazuje saldo konta bankowego i wartość monet w ekwipunku."
    zaplac:
      short: "przelew do gracza"
      description: "Przelewa pieniądze z twojego konta na konto innego gracza (także offline). Kwota np. 150, 3zł, 1zł 5sr."
    monety:
      short: "ile masz monet"
      description: "Pokazuje, ile miedziaków, srebrników i złotych koron nosisz przy sobie."
    bankier:
      short: "wpłaty i wypłaty monet"
      description: "U bankiera wpłacisz wszystkie monety na konto albo wypłacisz kwotę w monetach."
    kwoty:
      short: "przelicznik monet"
      description: "1 złota korona (zł) = 10 srebrników (sr) = 100 miedziaków (md). Reszta wydawana automatycznie."
    handel:
      short: "bezpieczna wymiana z graczem obok"
      description: "Okno handlu 2×4 pola + monety. Obie strony potwierdzają, po 3 s następuje wymiana. Każda zmiana cofa potwierdzenia."
    kupiec:
      short: "skup i sprzedaż towarów"
      description: "Kupiec skupuje i sprzedaje towary z magazynu. Typy: ogólny, kowal, spożywczy, budowlany. Towary stałe są zawsze, reszta zmienia się z każdą dostawą (okno pokazuje, co przyjdzie). Dzienny limit zarobku."
    kupcy:
      short: "kupcy, dostawy i czego szukają"
      description: "Lista typów kupców: ile towarów mają teraz w ofercie, czego szukają (★ lepsza cena) i kiedy nowa dostawa."
    sklep:
      short: "tabliczka na skrzyni"
      description: "Linia 1: [Sklep], 2: Sprzedam albo Kupię, 3: ilość, 4: cena. Towar — pierwszy przedmiot w skrzyni. Kupujący płaci monetami, utarg trafia na twoje konto."
    sklepy:
      short: "lista twoich sklepów"
      description: "Pokazuje twoje sklepy, ich położenie i stan towaru."
    admin-konto:
      short: "zmiana salda"
      description: "Konto: nick gracza, identyfikator (np. country:<uuid>) albo kraj:<nazwa>."
    admin-monety:
      short: "wydanie monet graczowi"
      description: "Daje graczowi monety do ekwipunku (zapisywane w dzienniku zdarzeń)."
    admin-kram:
      short: "kram kupca (model BetterModel)"
      description: "Stawia kram przy kupcu (model zależny od typu), przesuwa go o x y z bloków, obraca o stopnie albo usuwa. Kram nie ma kolizji i wraca po restarcie."
    admin-npc-typ:
      short: "zmień typ kupca"
      description: "Ustawia typ kupca (ogólny, kowal, spożywczy, budowlany — merchant.types w configu). Kupcy bez typu są ogólni."
    admin-npc:
      short: "postaw bankiera/kupca"
      description: "Stawia NPC (Mannequin) w twoim miejscu. Nazwę z polskimi znakami podaj w cudzysłowie, skin = nick Mojang."
    admin-npc-usun:
      short: "usuń NPC"
      description: "Usuwa najbliższy NPC (do 5 bloków) albo NPC o podanym id."
    admin-npc-skin:
      short: "zmień skin NPC"
      description: "Nick Mojang albo „losowy” (jeden z 9 domyślnych skinów, inny dla każdego NPC). najblizszy = NPC do 5 bloków."
    admin-npc-lista:
      short: "lista NPC"
      description: "Pokazuje wszystkich bankierów i kupców."
    admin-log:
      short: "dziennik transakcji"
      description: "Ostatnie operacje na koncie (po 10 na stronę) i zdarzenia z monetami."
    admin-info:
      short: "statystyki ekonomii"
      description: "Liczba kont, pieniądze w bankach, sklepy, NPC."
    admin-reload:
      short: "przeładuj config"
      description: "Wczytuje ponownie config.yml (ceny, komunikaty, wygląd monet)."
